# Mitgelieferte Vertragsarten (DMS #1038): bleiben nach der Installation, Updates ergänzen neue, überschreiben aber
# nichts, was du geändert hast. Die Fristen sind übliche Werte als Vorschlag – ohne Gewähr, keine Rechtsberatung.
# Seit März 2022 laufen viele Verbraucherverträge (Strom, Gas, Internet, Handy, Zeitschriften, Fitnessstudio) nach der
# Mindestlaufzeit unbefristet weiter und sind dann mit einem Monat kündbar.
# Ab 1.2.0 hat jede Vertragsart die Vorlage „Kündigung“ (dms-registry #160); am Vertrag über Mappe → „Vorlage hinzufügen“.
- kennung: strom
  typ: vertragsart
  werte: { name: Strom, nutzung: beides, mindestlaufzeit: { anzahl: 12, einheit: monate }, verlaengerung: läuft unbefristet weiter, kuendigungsfrist: { anzahl: 1, einheit: monate }, kuendigung_zum: jederzeit }
  beschriftungen: { en: { name: Electricity } }
  vorlagen: [{ datei: vorlagen/kuendigung.md, titel: Kündigung }]
