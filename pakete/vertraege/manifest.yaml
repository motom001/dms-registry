# Paket Verträge (dms-registry #159, Etappe 15): ein Mappentyp für alle Verträge – zu Hause und im Betrieb –,
# Vertragsarten mit typischen Fristen und Code, der Status und Fristen ausrechnet. Schema: schema/manifest.schema.json
schema: 1
id: vertraege
name: Verträge
herausgeber: app.ablago
version: 1.0.1
beschreibung: Ein Mappentyp für alle Verträge, zu Hause und im Betrieb. Du trägst ein, was es ist, bei wem und wie lange es läuft – das Paket rechnet aus, bis wann du kündigen musst, und erinnert rechtzeitig.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
kategorien: [vorlagen]
symbol: file-signature
# 0.238.0: Bedingung „eigene Organisation“ (DMS #995); darin enthalten Zeitraum (0.227.0, #1035), Anzeige-Bedingungen
# (0.228.0, #1033), mehrere Ziele (0.230.0, #1036), berechnete Felder und Hinweise (0.231.0, #1034), „Paket nach Zeitplan
# ausführen“ (0.233.0, #1082), Vorbelegen (0.234.0, #1037) und Vorgaben (0.236.0, #1038)
dms: ">=0.238.0"
# „So nutzt du es“ (dms-registry #164)
kurzanleitung:
  de:
    - Lege einen Vertrag an und trage ein, was es ist, bei wem und wann er begonnen hat.
    - Wähle die Vertragsart, etwa Mobilfunk – Ablago schlägt die üblichen Fristen in leere Felder vor.
    - Unter „Kündigen bis“ steht, bis wann die Kündigung spätestens ankommen muss; das Paket rechnet jeden Morgen neu.
    - Schalte unter Automatisierungen „Vertrag rechtzeitig kündigen“ ein, wenn du 30 Tage vorher erinnert werden willst.
  en:
    - Create a contract and enter what it is, who it is with and when it started.
    - Choose the contract type, e.g. mobile phone – Ablago suggests the usual periods in empty fields.
    - “Cancel by” shows the last day the cancellation must arrive; the package recalculates every morning.
    - Turn on “Cancel the contract in time” under automations to get a reminder 30 days before.
abhaengigkeiten:
  basis: ">=1.7.0"
inhalt:
  mappentypen: inhalt/mappentypen.yaml
  sichten: inhalt/sichten.yaml
  vorgaben: inhalt/vorgaben.yaml
  beispiele: inhalt/beispiele.yaml
  automatisierungen: inhalt/automatisierungen.yaml
code:
  sprache: c
  quelle: code/
  # Rechnet bei jeder Änderung eines Vertrags und nach Zeitplan (Automatisierung „Verträge täglich prüfen“ – der Status
  # hängt am Datum).
  ereignisse: [mappe.angelegt, mappe.geaendert, zeitplan.ausgefuehrt, paket.einstellungen_geaendert]
  mappentypen: [vertrag]
  rechte:
    lesen: [vertrag, vertragsart]   # die Vertragsart liefert nichts für die Rechnung, nur Name und Vorschläge
    schreiben: [vertrag]            # schreibt nur die berechneten Felder (Status, Kündigen bis, Ende, pro Monat …)
    dokumente: keine
  netz: []
  einstellungen:
    - abschnitt: Berechnung
      felder:
        - schluessel: aktiv
          name: Status und Fristen ausrechnen
          typ: janein
          standard: true
          hilfe: Aus Beginn, Laufzeit, Verlängerung und Kündigungsfrist. Ohne Haken bleiben die berechneten Felder, wie sie sind.
