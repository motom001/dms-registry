# Paket Verträge (dms-registry #159, Etappe 15): ein Mappentyp für alle Verträge – zu Hause und im Betrieb –,
# Vertragsarten mit typischen Fristen und Code, der Status und Fristen ausrechnet. Schema: schema/manifest.schema.json
schema: 1
id: vertraege
name: Verträge
herausgeber: app.ablago
version: 1.3.0
beschreibung: Ein Mappentyp für alle Verträge, zu Hause und im Betrieb. Du trägst ein, was es ist, bei wem und wie lange es läuft – das Paket rechnet aus, bis wann du kündigen musst, und erinnert rechtzeitig.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
kategorien: [vorlagen]
symbol: file-signature
# 0.238.0: Bedingung „eigene Organisation“ (DMS #995); darin enthalten Zeitraum (0.227.0, #1035), Anzeige-Bedingungen
# (0.228.0, #1033), mehrere Ziele (0.230.0, #1036), berechnete Felder und Hinweise (0.231.0, #1034), „Paket nach Zeitplan
# ausführen“ (0.233.0, #1082), Vorbelegen (0.234.0, #1037) und Vorgaben (0.236.0, #1038)
# 0.243.0: Umbau (DMS #1041) – Verträge, Versicherungen und Mietverträge aus Haushalt und Vermietung ziehen hierher
# 0.245.0: Aktionen im Menü „Mappe“ (DMS #1039); 0.245.3: Bedingungen auf zielOptional-Ziele (DMS #1122) –
# 0.245.1/0.245.2 lehnten Pakete mit Bedingungen ab; 0.248.0: Umbau setzt Zeiträume (DMS #1125)
dms: ">=0.248.0"
# „So nutzt du es“ (dms-registry #164)
kurzanleitung:
  de:
    - Lege einen Vertrag an und trage ein, was es ist, bei wem und wann er begonnen hat.
    - Wähle die Vertragsart, etwa Mobilfunk – Ablago schlägt die üblichen Fristen in leere Felder vor.
    - Unter „Kündigen bis“ steht, bis wann die Kündigung spätestens ankommen muss; das Paket rechnet jeden Morgen neu.
    - Schalte unter Automatisierungen „Vertrag rechtzeitig kündigen“ ein, wenn du 30 Tage vorher erinnert werden willst.
  en:
    - Create a contract and enter what it is, who it is with and when it started.
    - Choose the contract type, e.g. mobile phone – Ablago suggests the usual periods in empty fields.
    - “Cancel by” shows the last day the cancellation must arrive; the package recalculates every morning.
    - Turn on “Cancel the contract in time” under automations to get a reminder 30 days before.
abhaengigkeiten:
  basis: ">=1.7.0"
# Umbau (dms-registry #163, DMS #1041): Haushalt und Vermietung bringen ab 2.0.0 keine eigenen Vertragstypen mehr mit.
# Ihre Mappen ziehen beim Installieren bzw. Aktualisieren von Verträge hierher, mit allen Werten; was nicht passt, steht
# danach in einer Notiz an der Mappe. Ist Verträge noch nicht installiert, übernimmt der Vertrag den alten Typ aus Haushalt
# mit seiner Id (Ansichten, Rechte und Links bleiben). Ablago zeigt vorher, was wohin geht, und fragt nach.
umbau:
  - von: "haushalt:vertrag"
    nach: vertrag
    # Die Art (Strom, Mobilfunk …) wird die Bezeichnung – die Vertragsart wählst du danach (die Fristen schlägt sie vor).
    felder: { vertragspartner: von, art: bezeichnung, vertragsnummer: vertragsnummer, beginn: beginn, kuendigungsfrist: kuendigungsfrist,
              betrag: betrag, zahlweise: zahlweise, verbleib_original: verbleib_original }
  - von: "haushalt:versicherung"
    nach: vertrag
    felder: { versicherer: von, art: versicherung_art, versicherungsnummer: vertragsnummer, versichert_verweis: versicherte_personen,
              beitrag: betrag, zahlweise: zahlweise, hauptfaelligkeit: hauptfaelligkeit, verbleib_original: verbleib_original }
    # Ab 1.3.0 (Ablago 0.248.0, #1125) gleich die üblichen Fristen der Vertragsart – nur in leere Felder.
    setzen: { art: { vorgabe: versicherung }, bezeichnung: Versicherung, mindestlaufzeit: { anzahl: 12, einheit: monate },
              verlaengerung: verlängert sich um, verlaengerung_um: { anzahl: 12, einheit: monate },
              kuendigungsfrist: { anzahl: 3, einheit: monate }, kuendigung_zum: Laufzeitende }
  - von: "vermietung:mietvertrag"
    nach: vertrag
    felder: { wohnung: betrifft, mieter: an, beginn: beginn, gekuendigt_am: gekuendigt_am, ende: vertragsende, mietart: mietart,
              kaltmiete: kaltmiete, vorauszahlung: vorauszahlung, sonstiges: sonstiges, mieterhoehung_ab: mieterhoehung_ab,
              kaution: kaution, kaution_konto: kaution_konto, kaution_zurueck_am: kaution_zurueck_am, verbleib_original: verbleib_original }
    setzen: { art: { vorgabe: miete }, bezeichnung: Mietvertrag, verlaengerung: läuft unbefristet weiter,
              kuendigungsfrist: { anzahl: 3, einheit: monate }, kuendigung_zum: Monatsende }
inhalt:
  mappentypen: inhalt/mappentypen.yaml
  sichten: inhalt/sichten.yaml
  vorgaben: inhalt/vorgaben.yaml
  beispiele: inhalt/beispiele.yaml
  automatisierungen: inhalt/automatisierungen.yaml
# Aktion im Menü „Mappe“ (dms-registry #160, DMS #1039): öffnet „Brief aus Vorlage“ von Ablago mit den Vorlagen dieses
# Pakets an der Vertragsart (z. B. „Kündigung“) – ohne eigenen Code, Ablago legt das PDF mit dem Zugriff der Person ab.
mappenaktionen:
  - schluessel: vorlage_hinzufuegen
    name: Vorlage hinzufügen
    beschreibung: Kündigung und andere Briefe aus den Vorlagen der Vertragsart als PDF in den Vertrag legen. Wenn du die Kündigung abgeschickt hast, trag „Gekündigt am“ ein.
    mappentypen: [vertrag]
    rechte: [dokument_hinzufuegen]
    dialog: dms:vorlage
    bedingung:
      modus: alle
      bedingungen: [{ art: feld, bedingung: { feld: art, op: nichtLeer } }]
      grund: Erst eine Vertragsart wählen – ihre Vorlagen stehen dann hier.
code:
  sprache: c
  quelle: code/
  # Rechnet bei jeder Änderung eines Vertrags und nach Zeitplan (Automatisierung „Verträge täglich prüfen“ – der Status
  # hängt am Datum).
  ereignisse: [mappe.angelegt, mappe.geaendert, zeitplan.ausgefuehrt, paket.einstellungen_geaendert]
  mappentypen: [vertrag]
  rechte:
    lesen: [vertrag, vertragsart]   # die Vertragsart liefert nichts für die Rechnung, nur Name und Vorschläge
    schreiben: [vertrag]            # schreibt nur die berechneten Felder (Status, Kündigen bis, Ende, pro Monat …)
    dokumente: keine
  netz: []
  einstellungen:
    - abschnitt: Berechnung
      felder:
        - schluessel: aktiv
          name: Status und Fristen ausrechnen
          typ: janein
          standard: true
          hilfe: Aus Beginn, Laufzeit, Verlängerung und Kündigungsfrist. Ohne Haken bleiben die berechneten Felder, wie sie sind.
