# Paket Hallo Post – kleinstes Beispiel für ein Paket mit Code. Schema: schema/manifest.schema.json
schema: 1
id: hallo_post
name: Hallo Post
version: 1.0.4
beschreibung: 'Ein kleines Beispiel für Entwickler: zählt neue Post und nennt die Zahl auf Knopfdruck. Im Alltag brauchst du es nicht – es ist eine Vorlage für eigene Pakete.'
autor:
  name: Thomas Meissner
  github: motom001
herausgeber: app.ablago
lizenz: Apache-2.0
kurzanleitung:
  de:
    - Lass ein paar Post-Dokumente hereinkommen, etwa über den Upload.
    - Klicke unter Werkbank → Pakete → Hallo Post → Einstellungen auf „Wie viel Post kam bisher?“.
    - 'Für eigene Pakete: Der Code in code/hallo.c ist die kleinste Vorlage für ein Paket mit Code.'
  en:
    - Let a few post documents come in, e.g. by uploading them.
    - Under Workbench → Packages → Hallo Post → Settings, click “Wie viel Post kam bisher?”.
    - 'For your own packages: the code in code/hallo.c is the smallest template for a package with code.'
# 0.88.0: Paket-Läufer (Pakete mit Code)
dms: ">=0.88.0"
inhalt: {}
code:
  sprache: c
  quelle: code/
  ereignisse: [post.angelegt]
  rechte: {}            # braucht keine Mappen und keine Dokumente
  netz: []
  aktionen:
    - schluessel: zaehlen
      name: Wie viel Post kam bisher?
