# Paket Office und E-Mail – Volltext für Word-, Excel-, PowerPoint- und OpenDocument-Dateien, RTF, Textdateien und
# E-Mails (.eml, .msg), die Ablago nicht selbst liest. Schema: schema/manifest.schema.json
schema: 1
id: office_email
name: Office und E-Mail
version: 1.1.1
beschreibung: Macht Word-, Excel-, PowerPoint- und OpenDocument-Dateien, RTF, Textdateien und E-Mails (.eml, .msg) im Volltext durchsuchbar. Makros und eingebettete Objekte führt es nie aus. Abgeschottet im Paket-Läufer, ohne Netz.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
# Recht dms:volltext, code.volltext und Ereignis datei.volltext gibt es seit 0.145.0 (DMS #614): nur Volltext schreiben,
# ohne Schreibrecht auf Dokumente; Ablago meldet auch neue Versionen, den Bestand und „Volltext neu erzeugen“.
dms: ">=0.145.0"
inhalt: {}
code:
  sprache: c
  quelle: code/
  ereignisse: [datei.volltext]
  # Dateitypen, für die das Paket den Volltext liefert. application/octet-stream: Dateien ohne bekannten Typ (z. B.
  # .msg aus manchen Browsern) – das Paket holt sie nur bei passender Endung und entscheidet am Inhalt.
  volltext:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.wordprocessingml.template
    - application/vnd.ms-word.document.macroenabled.12
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.openxmlformats-officedocument.spreadsheetml.template
    - application/vnd.ms-excel.sheet.macroenabled.12
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - application/vnd.openxmlformats-officedocument.presentationml.slideshow
    - application/vnd.ms-powerpoint.presentation.macroenabled.12
    - application/vnd.oasis.opendocument.text
    - application/vnd.oasis.opendocument.spreadsheet
    - application/vnd.oasis.opendocument.presentation
    - message/rfc822
    - application/vnd.ms-outlook
    - application/rtf
    - text/rtf
    - text/plain
    - application/octet-stream
  rechte:
    lesen: ["*"]           # Dokumente liegen in Mappen beliebiger Typen
    dokumente: lesen       # die Datei lesen; den Volltext schreibt es mit dms:volltext – Dokumente ändern kann es nicht
    schnittstellen: ["dms:volltext"]
  netz: []
