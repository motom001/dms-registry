# Mappentyp Organisation. Das DMS legt ihn als basis_organisation an; angezeigt wird „Organisation“.
- schluessel: organisation
  name: Organisation
  beschreibung: Firma, Behörde, Arztpraxis, Versicherung, Bank, Verein oder andere Stelle, mit der du zu tun hast – auch deine eigene Firma. AGB und Preislisten legst du unter Dokumente mit ihrem Stand im Namen ab, z. B. „AGB Stand 2026-01“.
  beschriftungen: { en: { name: "Organisation", beschreibung: "Company, authority, doctor’s practice, insurer, bank, club or any other body you deal with – your own company too. Keep terms and conditions and price lists under Documents with their date in the name, e.g. “Terms as of 2026-01”." } }
  titelVorlage: "{name}"
  felder:
    # Stammdaten
    - key: name
      label: Name
      beschriftungen: { en: { label: "Name" } }
      typ: text
      pflicht: true
      eindeutig: true
      maxLen: 120
      # Für die Erkennung (DMS 0.113): Post wird an diesem Namen wiedererkannt (schwaches Merkmal).
      # Ab 1.7.0 ausdrücklich „name“: Bei einer eigenen Organisation liest Ablago den Namen über diese Bedeutung (DMS #995).
      erkennung: { art: name }
    - key: kuerzel
      label: Kürzel
      beschriftungen: { en: { label: "Short name", hilfe: "Abbreviation, e.g. “SWM” for Stadtwerke Musterstadt" } }
      typ: text
      maxLen: 20
      hilfe: Kurzname, z. B. „SWM“ für Stadtwerke Musterstadt
      erkennung: { art: name }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Lieferant": "Supplier", "Kunde": "Customer", "Bank": "Bank", "Versicherung": "Insurance", "Behörde": "Authority", "Arbeitgeber": "Employer", "Arzt/Praxis": "Doctor/practice", "Handwerker": "Tradesperson", "Vermieter": "Landlord", "Verein": "Club", "Versorger": "Utility", "Sonstige": "Other" } } }
      typ: auswahl
      mehrfach: true
      optionen: [Lieferant, Kunde, Bank, Versicherung, Behörde, Arbeitgeber, Arzt/Praxis, Handwerker, Vermieter, Verein, Versorger, Sonstige]
    # Ab 1.7.0 (DMS #995, dms-registry #158): Das sind wir – Ablago weiß, wer „wir“ sind (Auskünfte, Briefkopf, Erkennung).
    # Ändern nur mit Verwaltungsrecht (Thomas 10.11.2026: Standardberechtigung am Feld).
    - key: eigene_organisation
      label: Eigene Organisation
      beschriftungen: { en: { label: "Own organisation", hilfe: "This is us – e.g. your own company or business. Ablago uses it for data protection information, letterheads and recognition. Only people with administration rights can change it." } }
      typ: janein
      standard: false
      merkmal: eigeneOrganisation
      schreibschutz: verwaltung
      hilfe: Das sind wir – z. B. deine eigene Firma oder dein Gewerbe. Ablago nimmt das für Datenschutz-Auskünfte, Briefköpfe und die Erkennung. Ändern kann es nur, wer Ablago verwaltet.
    - key: kundennummer
      label: Kundennummer
      beschriftungen: { en: { label: "Customer number", hilfe: "Your own number with this organisation (customer, membership, policyholder or patient number)" } }
      typ: text
      maxLen: 60
      hilfe: Deine eigene Nummer bei dieser Organisation (Kunden-, Mitglieds-, Versicherten- oder Patientennummer)
      # Starkes Merkmal: steht die Nummer im Brief, ist der Absender eindeutig (Leerzeichen und Bindestriche zählen nicht).
      erkennung: { art: nummer, hinweis: "Steht meist oben rechts im Brief, z. B. „Kundennummer 100-4711“" }
    # Ab 1.2.0: IBAN und Umsatzsteuer-Id der Organisation – starke Merkmale für die Erkennung.
    - key: iban
      label: IBAN
      beschriftungen: { en: { label: "IBAN", hilfe: "The organisation’s account, e.g. from the letterhead or the invoice (DE89 3704 0044 0532 0130 00)" } }
      typ: text
      maxLen: 42
      muster: "[A-Z]{2}[0-9]{2}( ?[A-Z0-9]){11,30}"
      # Ab 1.3.0 (DMS 0.121): Länge des Landes und Prüfziffer, Anzeige in Vierergruppen.
      format: iban
      hilfe: Konto der Organisation, z. B. aus dem Briefkopf oder der Rechnung (DE89 3704 0044 0532 0130 00)
      erkennung: { art: iban }
    - key: ustid
      label: Umsatzsteuer-Id
      beschriftungen: { en: { label: "VAT ID", hilfe: "e.g. DE123456789 – shown on invoices from companies" } }
      typ: text
      maxLen: 20
      hilfe: z. B. DE123456789 – steht auf Rechnungen von Firmen
      erkennung: { art: ustid }
    - key: beschreibung
      label: Beschreibung
      beschriftungen: { en: { label: "Description" } }
      typ: langtext
    # Ab 1.7.0: Datenschutz – nur bei einer eigenen Organisation zu sehen (Abschnitt mit Anzeige-Bedingung, DMS #1033, #995).
    - key: verantwortlicher
      label: Verantwortlicher
      beschriftungen: { en: { label: "Controller", hilfe: "Who is responsible for data protection (Art. 4 No. 7 GDPR) – usually the organisation itself, otherwise a person" } }
      typ: referenz
      ziel: [organisation, person]
      verweisart: bezug
      hilfe: Wer für den Datenschutz verantwortlich ist (Art. 4 Nr. 7 DSGVO) – meist die Organisation selbst, sonst eine Person
    - key: datenschutzbeauftragter
      label: Datenschutzbeauftragter
      beschriftungen: { en: { label: "Data protection officer", hilfe: "Only if you have one – often required only from a certain number of employees. No legal advice." } }
      typ: referenz
      ziel: person
      verweisart: bezug
      hilfe: Nur, wenn es einen gibt – oft erst ab einer bestimmten Zahl von Beschäftigten nötig. Keine Rechtsberatung.
    # Kontakt
    - key: telefon
      label: Telefon
      beschriftungen: { en: { label: "Phone" } }
      typ: text
      maxLen: 40
      format: telefon
      erkennung: { art: telefon }
    - key: fax
      label: Fax
      beschriftungen: { en: { label: "Fax" } }
      typ: text
      maxLen: 40
      format: telefon
      erkennung: { art: fax }
    - key: email
      label: E-Mail
      beschriftungen: { en: { label: "Email", hilfe: "e.g. contact@example.org" } }
      typ: text
      maxLen: 200
      muster: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
      hilfe: z. B. kontakt@beispiel.de
      format: email
      erkennung: { art: email }
    - key: internet
      label: Internetseite
      beschriftungen: { en: { label: "Website", hilfe: "e.g. https://www.example.org" } }
      typ: text
      maxLen: 200
      format: internetseite
      hilfe: z. B. https://www.beispiel.de
      # Auch die Domain einer E-Mail-Adresse im Brief zählt (…@beispiel.de).
      erkennung: { art: internet }
    # Anschrift
    - key: strasse
      label: Straße
      beschriftungen: { en: { label: "Street" } }
      typ: text
      maxLen: 120
      erkennung: { art: strasse }
    - key: hausnummer
      label: Hausnummer
      beschriftungen: { en: { label: "House number" } }
      typ: text
      maxLen: 10
      erkennung: { art: hausnummer }
    - key: plz
      label: PLZ
      beschriftungen: { en: { label: "Postcode", hilfe: "Five digits in Germany" } }
      typ: text
      maxLen: 10
      hilfe: In Deutschland fünfstellig
      # In Deutschland (oder ohne Land) genau 5 Ziffern, sonst frei.
      format: plz
      landFeld: land
      erkennung: { art: plz }
    - key: ort
      label: Ort
      beschriftungen: { en: { label: "Town" } }
      typ: text
      maxLen: 80
      erkennung: { art: ort }
    - key: land
      label: Land
      beschriftungen: { en: { label: "Country" } }
      typ: text
      maxLen: 60
      standard: Deutschland
  register:
    - key: stammdaten
      name: Stammdaten
      beschriftungen: { en: { name: "Basic data" } }
      art: felder
      felder: [name, kuerzel, art, eigene_organisation, kundennummer, iban, ustid, beschreibung, verantwortlicher, datenschutzbeauftragter]
      abschnitte:
        - vor: verantwortlicher
          titel: Datenschutz
          beschriftungen: { en: { titel: "Data protection" } }
          anzeigenWenn: [{ feld: eigene_organisation, op: gleich, wert: true }]
    - key: kontakt
      name: Kontakt
      beschriftungen: { en: { name: "Contact" } }
      art: felder
      felder: [telefon, fax, email, internet]
    - key: anschrift
      name: Anschrift
      beschriftungen: { en: { name: "Address" } }
      art: felder
      felder: [strasse, hausnummer, plz, ort, land]
    # Ab 1.1.0: Niederlassungen und Ansprechpartner, die auf diese Organisation verweisen.
    - key: niederlassungen
      name: Niederlassungen
      beschriftungen: { en: { name: "Branches" } }
      art: verknuepfungen
      quellen: [{ typ: niederlassung, feld: organisation }]
    - key: ansprechpartner
      name: Ansprechpartner
      beschriftungen: { en: { name: "Contacts" } }
      art: verknuepfungen
      quellen: [{ typ: person, feld: organisation }]
    # Ab 1.7.0 im Hinweis: AGB und Preislisten mit Stand im Namen ablegen (dms-registry #158).
    - key: dokumente
      name: Dokumente
      beschriftungen: { en: { name: "Documents" } }
      art: dokumente
    # Im DMS seit 0.73 „Historie“ (vorhandene Installationen hat die Migration 036 schon umbenannt).
    - key: protokoll
      name: Historie
      beschriftungen: { en: { name: "History" } }
      art: protokoll
  trefferliste: [name, art, ort, telefon]

# Mappentyp Niederlassung (ab 1.1.0): Filiale, Zweigstelle, Praxis oder Außenstelle einer Organisation.
- schluessel: niederlassung
  name: Niederlassung
  beschreibung: Filiale, Zweigstelle, Praxis oder Außenstelle einer Organisation – mit eigener Anschrift und eigenem Telefon.
  beschriftungen: { en: { name: "Branch", beschreibung: "Branch, office, practice or outpost of an organisation – with its own address and phone." } }
  titelVorlage: "{organisation} – {name}"
  felder:
    - key: organisation
      label: Organisation
      beschriftungen: { en: { label: "Organisation" } }
      typ: referenz
      ziel: organisation
      verweisart: zugehoerigkeit
      pflicht: true
      erkennung: {}
    - key: name
      label: Name
      beschriftungen: { en: { label: "Name", hilfe: "e.g. “Market Square branch” or “North practice”" } }
      typ: text
      pflicht: true
      maxLen: 120
      hilfe: "z. B. „Filiale Marktplatz“ oder „Praxis Nord“"
      erkennung: {}
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", hilfe: "e.g. branch, office, practice", optionen: { "Filiale": "Branch", "Zweigstelle": "Branch office", "Geschäftsstelle": "Office", "Praxis": "Practice", "Außenstelle": "Outpost", "Werk/Lager": "Plant/warehouse", "Büro": "Office", "Sonstige": "Other" } } }
      typ: auswahl
      optionen: [Filiale, Zweigstelle, Geschäftsstelle, Praxis, Außenstelle, Werk/Lager, Büro, Sonstige]
      hilfe: z. B. Filiale, Zweigstelle, Praxis
    - key: nummer
      label: Nummer
      beschriftungen: { en: { label: "Number", hilfe: "Branch or site number, e.g. establishment number" } }
      typ: text
      maxLen: 40
      hilfe: Filial- oder Stellennummer, z. B. Betriebsstättennummer
      erkennung: { art: nummer }
    - key: oeffnungszeiten
      label: Öffnungszeiten
      beschriftungen: { en: { label: "Opening hours" } }
      typ: langtext
    - key: beschreibung
      label: Beschreibung
      beschriftungen: { en: { label: "Description" } }
      typ: langtext
    - { key: telefon, label: Telefon, typ: text, maxLen: 40, format: telefon, erkennung: {}, beschriftungen: { en: { label: "Phone" } }  }
    - { key: fax, label: Fax, typ: text, maxLen: 40, format: telefon, erkennung: {}, beschriftungen: { en: { label: "Fax" } }  }
    - key: email
      label: E-Mail
      beschriftungen: { en: { label: "Email", hilfe: "e.g. branch@example.org" } }
      typ: text
      maxLen: 200
      muster: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
      hilfe: z. B. filiale@beispiel.de
      format: email
      erkennung: {}
    - { key: internet, label: Internetseite, typ: text, maxLen: 200, format: internetseite, erkennung: {}, beschriftungen: { en: { label: "Website" } }  }
    - { key: strasse, label: Straße, typ: text, maxLen: 120, erkennung: {}, beschriftungen: { en: { label: "Street" } }  }
    - { key: hausnummer, label: Hausnummer, typ: text, maxLen: 10, erkennung: {}, beschriftungen: { en: { label: "House number" } }  }
    - { key: plz, label: PLZ, typ: text, maxLen: 10, format: plz, landFeld: land, erkennung: {}, beschriftungen: { en: { label: "Postcode" } }  }
    - { key: ort, label: Ort, typ: text, maxLen: 80, erkennung: {}, beschriftungen: { en: { label: "Town" } }  }
    - { key: land, label: Land, typ: text, maxLen: 60, standard: Deutschland, beschriftungen: { en: { label: "Country" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [organisation, name, art, nummer, oeffnungszeiten, beschreibung], beschriftungen: { en: { name: "General" } }  }
    - { key: kontakt, name: Kontakt, art: felder, felder: [telefon, fax, email, internet], beschriftungen: { en: { name: "Contact" } }  }
    - { key: anschrift, name: Anschrift, art: felder, felder: [strasse, hausnummer, plz, ort, land], beschriftungen: { en: { name: "Address" } }  }
    - key: ansprechpartner
      name: Ansprechpartner
      beschriftungen: { en: { name: "Contacts" } }
      art: verknuepfungen
      quellen: [{ typ: person, feld: niederlassung }]
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [organisation, name, art, ort, telefon]

# Mappentyp Person (ab 1.1.0): ein Kontakt – kein Benutzer des DMS.
- schluessel: person
  name: Person
  beschreibung: Ein Mensch, mit dem du zu tun hast – Ansprechpartner, Ärztin, Vermieter, Verwandte. Eine Person ist kein Benutzer des DMS und kann sich nicht anmelden.
  beschriftungen: { en: { name: "Person", beschreibung: "Someone you deal with – a contact, a doctor, a landlord, relatives. A person isn’t a user of Ablago and can’t sign in." } }
  titelVorlage: "{titel} {vorname} {nachname}"
  felder:
    - { key: anrede, label: Anrede, typ: auswahl, optionen: [Frau, Herr, divers/keine], beschriftungen: { en: { label: "Title", optionen: { "Frau": "Ms", "Herr": "Mr", "divers/keine": "diverse/none" } } }  }
    - { key: titel, label: Titel, typ: text, maxLen: 40, hilfe: z. B. Dr., beschriftungen: { en: { label: "Academic title", hilfe: "e.g. Dr" } }  }
    # Für die Erkennung (DMS 0.113): „Visitenkarte scannen“ füllt die markierten Felder.
    - { key: vorname, label: Vorname, typ: text, maxLen: 80, erkennung: {}, beschriftungen: { en: { label: "First name" } }  }
    - { key: nachname, label: Nachname, typ: text, pflicht: true, maxLen: 80, erkennung: {}, beschriftungen: { en: { label: "Last name" } }  }
    - key: beziehung
      label: Beziehung
      beschriftungen: { en: { label: "Relationship", optionen: { "Familie": "Family", "Freund/in": "Friend", "Ansprechpartner": "Contacts", "Arzt/Ärztin": "Doctor", "Handwerker": "Tradesperson", "Mieter/in": "Tenant", "Vermieter/in": "Landlord", "Nachbar/in": "Neighbour", "Sonstige": "Other" } } }
      typ: auswahl
      mehrfach: true
      optionen: [Familie, Freund/in, Ansprechpartner, Arzt/Ärztin, Handwerker, Mieter/in, Vermieter/in, Nachbar/in, Sonstige]
    - key: geburtstag
      label: Geburtstag
      beschriftungen: { en: { label: "Birthday", hilfe: "If you want a reminder, add a yearly “Date reached” automation in the Workbench under Automations." } }
      typ: datum
      # Ab 1.3.0 (DMS 0.121): nicht in der Zukunft.
      max: heute
      hilfe: "Wer erinnert werden möchte, legt in der Werkbank unter Automatisierungen eine jährliche Erinnerung „Datum erreicht“ an."
    - { key: beschreibung, label: Beschreibung, typ: langtext, beschriftungen: { en: { label: "Description" } }  }
    - { key: organisation, label: Organisation, typ: referenz, ziel: organisation, verweisart: bezug, hilfe: Wo die Person arbeitet bzw. wofür sie Ansprechpartner ist, erkennung: {}, beschriftungen: { en: { label: "Organisation", hilfe: "Where the person works or what they are the contact for" } }  }
    # Ab 1.6.1 (dms-registry #139): nur Niederlassungen der gewählten Organisation; ist sie leer, alle.
    - key: niederlassung
      label: Niederlassung
      beschriftungen: { en: { label: "Branch" } }
      typ: referenz
      ziel: niederlassung
      verweisart: bezug
      auswahlFilter: [{ art: feld, feld: organisation, op: zeigtAuf, wert: { art: eigenesFeld, feld: organisation } }]
    - { key: funktion, label: Funktion, typ: text, maxLen: 80, hilfe: z. B. Kundenberaterin, erkennung: {}, beschriftungen: { en: { label: "Role", hilfe: "e.g. customer adviser" } }  }
    - { key: abteilung, label: Abteilung, typ: text, maxLen: 80, beschriftungen: { en: { label: "Department" } }  }
    - { key: telefon, label: Telefon, typ: text, maxLen: 40, format: telefon, erkennung: {}, beschriftungen: { en: { label: "Phone" } }  }
    - { key: mobil, label: Mobil, typ: text, maxLen: 40, format: telefon, erkennung: {}, beschriftungen: { en: { label: "Mobile" } }  }
    - key: email
      label: E-Mail
      beschriftungen: { en: { label: "Email", hilfe: "e.g. name@example.org" } }
      typ: text
      maxLen: 200
      muster: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
      hilfe: z. B. name@beispiel.de
      format: email
      erkennung: {}
    - { key: strasse, label: Straße, typ: text, maxLen: 120, erkennung: {}, beschriftungen: { en: { label: "Street" } }  }
    - { key: hausnummer, label: Hausnummer, typ: text, maxLen: 10, erkennung: {}, beschriftungen: { en: { label: "House number" } }  }
    - { key: plz, label: PLZ, typ: text, maxLen: 10, format: plz, landFeld: land, erkennung: {}, beschriftungen: { en: { label: "Postcode" } }  }
    - { key: ort, label: Ort, typ: text, maxLen: 80, erkennung: {}, beschriftungen: { en: { label: "Town" } }  }
    - { key: land, label: Land, typ: text, maxLen: 60, standard: Deutschland, beschriftungen: { en: { label: "Country" } }  }
  register:
    - { key: stammdaten, name: Stammdaten, art: felder, felder: [anrede, titel, vorname, nachname, beziehung, geburtstag, beschreibung], beschriftungen: { en: { name: "Basic data" } }  }
    - { key: arbeit, name: Arbeit, art: felder, felder: [organisation, niederlassung, funktion, abteilung], beschriftungen: { en: { name: "Work" } }  }
    - { key: kontakt, name: Kontakt, art: felder, felder: [telefon, mobil, email], beschriftungen: { en: { name: "Contact" } }  }
    - { key: anschrift, name: Anschrift, art: felder, felder: [strasse, hausnummer, plz, ort, land], beschriftungen: { en: { name: "Address" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [nachname, vorname, beziehung, organisation, telefon]

# Mappentyp Ablageort (ab 1.6.0, DMS #883): wo das Papier liegt – verschachtelt, der Titel zeigt den ganzen Pfad.
# Früher legte ihn das DMS selbst an (Kennung ablageort); Basis übernimmt diesen dann mit gleicher Id (DMS ab 0.212.0).
- schluessel: ablageort
  name: Ablageort
  beschreibung: Wo Originale liegen – verschachtelt, z. B. zu Hause › Arbeitszimmer Schrank › roter Ordner
  beschriftungen: { en: { name: "Storage location", beschreibung: "Where originals are kept – nested, e.g. at home › study cupboard › red binder" } }
  titelVorlage: "{liegt_in} › {name}"
  felder:
    - { key: name, label: Name, typ: text, pflicht: true, maxLen: 120, hilfe: "z. B. roter Ordner, Safe im Flur, beim Notar, vernichtet", beschriftungen: { en: { label: "Name", hilfe: "e.g. red binder, safe in the hallway, at the notary's, destroyed" } }  }
    - { key: liegt_in, label: Liegt in, typ: referenz, ziel: ablageort, verweisart: zugehoerigkeit, hilfe: "Der Ort, in dem dieser Ort liegt – z. B. der Schrank, in dem der Ordner steht. Leer lassen für ganz oben.", beschriftungen: { en: { label: "Located in", hilfe: "The location this location is in – e.g. the cupboard the binder stands in. Leave empty for the very top." } }  }
    - { key: beschreibung, label: Beschreibung, typ: langtext, maxLen: 2000, beschriftungen: { en: { label: "Description" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [name, liegt_in, beschreibung], beschriftungen: { en: { name: "General" } }  }
    - { key: enthaelt, name: Enthält, art: verknuepfungen, quellen: [{ typ: ablageort, feld: liegt_in }], beschriftungen: { en: { name: "Contains" } }  }
    # Alle Mappen, die auf diesen Ort verweisen (z. B. über „Verbleib Originaldokumente“).
    - { key: liegt_hier, name: Liegt hier, art: verknuepfungen, beschriftungen: { en: { name: "Kept here" } }  }
    - { key: fotos, name: Fotos, art: dokumente, beschriftungen: { en: { name: "Photos" } }  }
  trefferliste: [_titel, beschreibung]
