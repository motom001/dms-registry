# Ab 1.8.0: eine Ansicht „Basis“ mit drei Ansichten darunter – Organisationen, Personen und Ablageorte, je mit Symbol.
# Die feineren Ansichten (Versicherungen, Banken, Behörden, Ärzte und Praxen, Niederlassungen, Familie und Freunde,
# Ansprechpartner) sind weggefallen: Niederlassungen legt man an der Organisation an, alles andere findet die Suche.
# Ein Update nimmt keine Ansichten weg – die alten bleiben in bestehenden Ablagen, bis man sie löscht.
- schluessel: basis
  name: Basis
  beschreibung: Organisationen, Personen und Ablageorte
  beschriftungen: { en: { name: "Basics", beschreibung: "Organisations, people and storage locations" } }
  symbol: box
  typen: [organisation, person, ablageort]

- schluessel: organisationen
  name: Organisationen
  beschreibung: Firmen, Banken, Versicherungen, Behörden und Praxen – mit ihren Niederlassungen
  beschriftungen: { en: { name: "Organisations", beschreibung: "Companies, banks, insurers, authorities and practices – with their branches" } }
  eltern: basis
  symbol: landmark
  typen: [organisation]

- schluessel: personen
  name: Personen
  beschreibung: Kontakte – keine Benutzer von Ablago
  beschriftungen: { en: { name: "People", beschreibung: "Contacts – not users of Ablago" } }
  eltern: basis
  symbol: users
  typen: [person]

# Ab 1.6.0: Ablageorte (DMS #883). Hat die Ablage schon die Ansicht des früheren Ablageorts, übernimmt Basis diese.
- schluessel: ablageorte
  name: Ablageorte
  beschreibung: Wo Originale liegen
  beschriftungen: { en: { name: "Storage locations", beschreibung: "Where originals are kept" } }
  eltern: basis
  symbol: archive
  typen: [ablageort]
