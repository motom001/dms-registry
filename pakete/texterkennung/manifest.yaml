# Paket Texterkennung – Tesseract als WebAssembly, Referenzpaket für den Paket-Läufer. Schema: schema/manifest.schema.json
schema: 1
id: texterkennung
name: Texterkennung (Deutsch und Englisch)
version: 2.2.0
beschreibung: Das Grundpaket für die Texterkennung des DMS – macht gescannte PDFs und Fotos durchsuchbar, auf Deutsch und Englisch. Weitere Sprachen gibt es als Zusatzsprachen (z. B. Französisch, Spanisch, Türkisch). Erkennt die Sprache je Seite, richtet Seiten auf, ohne Netz.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
kategorien: [volltext, suche]
symbol: scan-text
# 0.133.0: Ereignis „Volltext fertig“ auch ohne Text, Schnittstelle dms:texterkennung, Fortsetzung („weiter“),
# Seitenbild auch für JPEG und PNG, Sprachdaten aus Zusatzpaketen (texterkennung_<sprache>)
# 0.139.0: Sprachen je Seite beim Volltext schreiben (seitensprachen, Seiten durch \f getrennt), Text je Seite beim
# Lesen des Volltexts (motom001/dms#579). Wortpositionen (woerter, motom001/dms#631) nimmt erst 0.149.0 an; ältere
# übergehen das Feld – deshalb bleibt die Grenze.
dms: ">=0.139.0"
inhalt: {}
code:
  sprache: c
  quelle: code/
  ereignisse: [volltext.fertig]
  rechte:
    lesen: ["*"]          # Dokumente liegen in Mappen beliebiger Typen; Lesen der Mappe nur für „Nur diese Mappentypen“
    dokumente: schreiben  # Seiten als Bild lesen und den Volltext schreiben
    schnittstellen: ["dms:texterkennung"]  # die Texterkennung des DMS: Dokumente ohne Text warten auf dieses Paket
  netz: []
  einstellungen:
    - abschnitt: Texterkennung
      felder:
        - schluessel: sprache
          name: Sprache
          typ: auswahl
          optionen: [Automatisch, Deutsch, Englisch, Deutsch und Englisch]
          standard: Automatisch
          hilfe: Automatisch – das Paket erkennt die Sprache jeder Seite einzeln. Es liest eine Seite zuerst in der Sprache der Seite davor (am Anfang Deutsch), erkennt die Sprache des Texts und liest die Seite in einer anderen erkannten Sprache ein zweites Mal, wenn deren Sprachdaten da sind – die sicherere Lesung gilt (Englisch immer, weitere über Zusatzsprachen wie „Texterkennung – Zusatzsprache Französisch“). Stehen auf einer Seite zwei Sprachen, liest es sie mit beiden zugleich. Das DMS bekommt die Sprachen je Seite und durchsucht jede Seite mit den Wortstämmen ihrer Sprache. Bei „Deutsch und Englisch“ liest es jede Seite zweimal und nimmt die sicherere Lesung – das dauert doppelt so lang.
        - schluessel: verwerfen
          name: Vorhandenen Volltext verwerfen und neu erkennen
          typ: janein
          standard: false
          hilfe: Aus – Text aus dem PDF bleibt, das Paket erkennt nur Dokumente ohne Text (Scans, Fotos). An – das Paket erkennt jedes PDF und Bild neu und ersetzt den Text aus dem PDF. „Volltext neu erzeugen → Für alle Dokumente“ in der Werkbank erkennt immer neu, auch wenn das hier aus ist.
        - schluessel: drehen
          name: Seiten selbst aufrichten
          typ: janein
          standard: true
          hilfe: Erkennt die Lage jeder Seite (quer, auf dem Kopf) und die Schrift (z. B. Kyrillisch) und richtet die Seite vor dem Lesen auf. Kostet etwa ein Zehntel mehr Zeit.
        - schluessel: max_seiten
          name: Höchstens so viele Seiten
          typ: zahl
          min: 1
          max: 1000
          standard: 100
          hilfe: Lange Dokumente erkennt das Paket abschnittsweise (etwa eine Minute je Aufruf); am Dokument steht, wie weit es ist.
        - schluessel: dpi
          name: Auflösung (dpi)
          typ: zahl
          min: 150
          max: 400
          standard: 300
    - liste: typen
      name: Nur diese Mappentypen
      eintrag: Mappentyp
      hilfe: Leer – Dokumente in allen Mappen.
      felder:
        - { schluessel: typ, name: Mappentyp, typ: mappentyp, pflicht: true }
