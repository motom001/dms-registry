# Paket Vermietung. Schema: schema/manifest.schema.json
schema: 1
id: vermietung
name: Vermietung
herausgeber: app.ablago
version: 2.0.0
beschreibung: Mietobjekte, Wohnungen und Nebenkostenabrechnungen – für Vermieter mit wenigen Wohnungen. Mietverträge und Ausgaben kommen aus den Paketen Verträge und Rechnungen, mit Fristen für Abrechnung, Mieterhöhung und Kündigung.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
# 0.79.0: Beispiele verweisen auf Beispiele ({ beispiel: … }), Verweis auf den Ablageort von Ablago
# 0.113.0: Feld-Eigenschaft „für die Erkennung nutzen“ (erkennung, DMS #336/#391)
# 0.121.0: Feldformate und Datumsgrenzen (format, landFeld, min/max bei Datum, DMS #535)
# 0.127.0: Wortlisten für die Suche (inhalt.wortlisten, DMS #356)
# 0.177.0: mitgelieferte Automatisierungen (inhalt.automatisierungen, Ablago #712) – das Datumsfeld erinnert nicht mehr selbst
# 0.212.0: Ablageort aus dem Paket Basis (basis:ablageort, Ablago #883)
# 0.243.0: Verträge 1.1.0 und Rechnungen 1.1.0 (Umbau, DMS #1041) – Mietvertrag und Ausgabe ziehen dorthin (dms-registry #163)
dms: ">=0.243.0"
# „So nutzt du es“ (dms-registry #164)
kurzanleitung:
  de:
    - Lege je Haus oder Eigentumswohnung ein Mietobjekt an und darin die Wohnungen.
    - Leg je Mietverhältnis einen Vertrag mit der Vertragsart Miete an – unter „Betrifft“ die Wohnung, als Kunde die Mieter.
    - Rechnungen rund ums Haus legst du als Rechnung ab, mit dem Mietobjekt unter „Betrifft“ und „Umlagefähig“ – so findest du sie für Anlage V und Nebenkosten wieder.
    - Leg jedes Jahr eine Nebenkostenabrechnung mit „Versenden bis“ an.
  en:
    - Create a rental property for each house or owned flat, and the units in it.
    - Create a contract of the type rent for each tenancy – the unit under “Concerns”, the tenants as customer.
    - File invoices for the building as an invoice, with the rental property under “Concerns” and “Recoverable” – so you find them again for the tax return and service charges.
    - Create a service charge statement with “Send by” every year.
abhaengigkeiten:
  # Ab 2.0.0 (dms-registry #163): Mietverträge aus Verträge, Ausgaben aus Rechnungen; Haushalt nicht mehr (Steuerjahr optional).
  basis: ">=1.7.0"
  haus: ">=1.0.0"
  vertraege: ">=1.1.0"
  rechnungen: ">=1.1.0"
inhalt:
  mappentypen: inhalt/mappentypen.yaml
  sichten: inhalt/sichten.yaml
  beispiele: inhalt/beispiele.yaml
  wortlisten: inhalt/wortlisten.yaml
  automatisierungen: inhalt/automatisierungen.yaml
