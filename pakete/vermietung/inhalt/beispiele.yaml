# Beispiel-Mappen mit erfundenen Daten: Familie Muster vermietet ein Zweifamilienhaus.
# Verweise zwischen Beispielen ({ beispiel: … }) ab DMS 0.79.0; die Bank des Kautionskontos kommt aus den Beispielen
# des Pakets Basis. Ab 2.0.0 sind die Mietverträge Verträge (Paket Verträge) und die Ausgaben Rechnungen (Paket Rechnungen).
- typ: "basis:person"
  schluessel: mieterin_eg
  werte: { anrede: Frau, vorname: Petra, nachname: Mieterin, beziehung: [Mieter/in], telefon: "0123 44444", email: petra.mieterin@example.org }
- typ: "basis:person"
  schluessel: mieter_og
  werte: { anrede: Herr, vorname: Jonas, nachname: Mieter, beziehung: [Mieter/in], mobil: "0170 0000000" }
- typ: mietobjekt
  schluessel: gartenstrasse
  werte: { bezeichnung: Zweifamilienhaus Gartenstraße 8, art: Mehrfamilienhaus, strasse: Gartenstraße, hausnummer: "8", plz: "12345", ort: Musterstadt, baujahr: "1965", einheiten: 2, grundsteuer_az: "123/456/78901" }
- typ: wohnung
  schluessel: eg
  werte: { mietobjekt: { beispiel: gartenstrasse }, bezeichnung: EG, art: Wohnung, lage: Erdgeschoss mit Garten, wohnflaeche: 78.5, zimmer: 3, zaehler: "Strom 1ESY1160111111, Wasser kalt 22-3344" }
- typ: wohnung
  schluessel: og
  werte: { mietobjekt: { beispiel: gartenstrasse }, bezeichnung: OG, art: Wohnung, lage: Obergeschoss mit Balkon, wohnflaeche: 64, zimmer: 2.5, zaehler: "Strom 1ESY1160222222, Wasser kalt 22-3345" }
- typ: "vertraege:vertrag"
  werte:
    bezeichnung: Mietvertrag EG
    art: { vorgabe: "vertraege:miete" }
    betrifft: [{ beispiel: eg }]
    an: [{ beispiel: mieterin_eg }]
    beginn: "2021-04-01"
    verlaengerung: läuft unbefristet weiter
    kuendigungsfrist: { anzahl: 3, einheit: monate }
    kuendigung_zum: Monatsende
    mietart: Indexmiete
    kaltmiete: 720
    vorauszahlung: 210
    mieterhoehung_ab: "2027-01-01"
    kaution: 2160
    kaution_konto: { beispiel: "basis:sparkasse" }
- typ: "vertraege:vertrag"
  werte:
    bezeichnung: Mietvertrag OG
    art: { vorgabe: "vertraege:miete" }
    betrifft: [{ beispiel: og }]
    an: [{ beispiel: mieter_og }]
    beginn: "2019-08-01"
    verlaengerung: läuft unbefristet weiter
    kuendigungsfrist: { anzahl: 3, einheit: monate }
    kuendigung_zum: Monatsende
    gekuendigt_am: "2026-09-28"
    mietart: Festmiete
    kaltmiete: 560
    vorauszahlung: 170
    sonstiges: 40
    kaution: 1680
- typ: "rechnungen:rechnung"
  schluessel: grundsteuer2025
  werte: { betrifft: [{ beispiel: gartenstrasse }], kostenart: Grundsteuer, datum: "2025-02-15", betrag: 412, bezahlt_am: "2025-02-15", umlagefaehig: true }
- typ: "rechnungen:rechnung"
  schluessel: versicherung2025
  werte: { betrifft: [{ beispiel: gartenstrasse }], kostenart: Versicherung, datum: "2025-01-10", betrag: 689.9, bezahlt_am: "2025-01-10", umlagefaehig: true, notiz: Wohngebäudeversicherung }
- typ: "rechnungen:rechnung"
  werte: { betrifft: [{ beispiel: og }], kostenart: Reparatur, datum: "2026-03-04", betrag: 318.6, bezahlt_am: "2026-03-10", umlagefaehig: false, notiz: Thermostatventile im Bad und in der Küche getauscht }
- typ: nebenkostenabrechnung
  werte: { mietobjekt: { beispiel: gartenstrasse }, jahr: "2025", von: "2025-01-01", bis: "2025-12-31", versenden_bis: "2026-12-31", kosten: 4630.4, rechnungen: [{ beispiel: grundsteuer2025 }, { beispiel: versicherung2025 }] }
