# Mappentypen des Pakets Vermietung. Schema: schema/inhalt.schema.json
# Ablago legt sie als vermietung:<schluessel> an; angezeigt wird der Name.
# Ab 2.0.0 (dms-registry #163): Mietverträge sind Verträge aus dem Paket Verträge (Vertragsart Miete, „Betrifft“ = Wohnung),
# Ausgaben sind Rechnungen aus dem Paket Rechnungen („Betrifft“ = Mietobjekt oder Wohnung). Den Umzug bestehender Mappen
# machen diese Pakete.
# Mieter sind Personen (basis:person), Firmen Organisationen (basis:organisation),
# das Haus selbst darf zusätzlich eine Immobilie aus dem Paket Haus sein (Wartungen, Zählerstände).

- schluessel: mietobjekt
  name: Mietobjekt
  beschreibung: Ein vermietetes Haus oder eine vermietete Eigentumswohnung – mit allen Wohnungen, Abrechnungen und Ausgaben.
  beschriftungen: { en: { name: "Rental property", beschreibung: "A house or owned flat you let – with all units, statements and expenses." } }
  titelVorlage: "{bezeichnung}"
  felder:
    - { key: bezeichnung, label: Bezeichnung, typ: text, pflicht: true, eindeutig: true, maxLen: 120, hilfe: "z. B. „Mehrfamilienhaus Lindenstraße 4“", beschriftungen: { en: { label: "Name", hilfe: "e.g. “Apartment building Lindenstraße 4”" } }  }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Mehrfamilienhaus": "Apartment building", "Einfamilienhaus": "Detached house", "Eigentumswohnung": "Owned flat", "Gewerbe": "Commercial", "Garage/Stellplatz": "Garage/parking space", "Sonstiges": "Other" } } }
      typ: auswahl
      optionen: [Mehrfamilienhaus, Einfamilienhaus, Eigentumswohnung, Gewerbe, Garage/Stellplatz, Sonstiges]
    - { key: strasse, label: Straße, typ: text, maxLen: 120, beschriftungen: { en: { label: "Street" } }  }
    - { key: hausnummer, label: Hausnummer, typ: text, maxLen: 10, beschriftungen: { en: { label: "House number" } }  }
    # Ab 1.1.0 (DMS 0.121): PLZ mit Format, dazu das Land.
    - { key: plz, label: PLZ, typ: text, maxLen: 10, format: plz, landFeld: land, beschriftungen: { en: { label: "Postcode" } }  }
    - { key: ort, label: Ort, typ: text, maxLen: 80, beschriftungen: { en: { label: "Town" } }  }
    - { key: land, label: Land, typ: text, maxLen: 60, standard: Deutschland, beschriftungen: { en: { label: "Country" } }  }
    - { key: baujahr, label: Baujahr, typ: text, maxLen: 4, muster: "[0-9]{4}", hilfe: "Vierstellig, z. B. 1965", beschriftungen: { en: { label: "Year built", hilfe: "Four digits, e.g. 1965" } }  }
    - { key: einheiten, label: Anzahl Einheiten, typ: zahl, min: 1, nachkomma: 0, beschriftungen: { en: { label: "Number of units" } }  }
    - { key: immobilie, label: Immobilie (Paket Haus), typ: referenz, ziel: "haus:immobilie", verweisart: bezug, hilfe: Falls du Wartungen und Zählerstände des Hauses im Paket Haus führst, beschriftungen: { en: { label: "Property (House package)", hilfe: "If you keep the building’s maintenance and meter readings in the House package" } }  }
    - { key: verwalter, label: Hausverwaltung, typ: referenz, ziel: "basis:organisation", verweisart: bezug, hilfe: Bei Eigentumswohnungen die WEG-Verwaltung, beschriftungen: { en: { label: "Property management", hilfe: "For owned flats, the owners’ association management" } }  }
    # Für die Erkennung (DMS 0.113): Post mit diesem Aktenzeichen gehört zu diesem Mietobjekt.
    - { key: grundsteuer_az, label: Aktenzeichen Grundsteuer, typ: text, maxLen: 40, hilfe: Steht auf dem Grundsteuerbescheid, erkennung: { art: nummer }, beschriftungen: { en: { label: "Property tax reference", hilfe: "Shown on the property tax assessment" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo Kaufvertrag, Grundbuchauszug und Teilungserklärung auf Papier liegen, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where the purchase contract is" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [bezeichnung, art, strasse, hausnummer, plz, ort, land, baujahr, einheiten, immobilie, verwalter, grundsteuer_az, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - key: wohnungen
      name: Wohnungen
      beschriftungen: { en: { name: "Units" } }
      art: verknuepfungen
      quellen: [{ typ: wohnung, feld: mietobjekt }]
    - key: abrechnungen
      name: Nebenkosten
      beschriftungen: { en: { name: "Service charges" } }
      art: verknuepfungen
      quellen: [{ typ: nebenkostenabrechnung, feld: mietobjekt }]
    - key: ausgaben
      name: Ausgaben
      beschriftungen: { en: { name: "Expenses" } }
      art: verknuepfungen
      quellen: [{ typ: "rechnungen:rechnung", feld: betrifft }]
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [bezeichnung, art, ort, einheiten]

- schluessel: wohnung
  name: Wohnung
  beschreibung: Eine vermietbare Einheit in einem Mietobjekt – Wohnung, Gewerbeeinheit, Garage oder Stellplatz.
  beschriftungen: { en: { name: "Unit", beschreibung: "A lettable unit in a rental property – flat, commercial unit, garage or parking space." } }
  titelVorlage: "{mietobjekt} – {bezeichnung}"
  felder:
    - { key: mietobjekt, label: Mietobjekt, typ: referenz, ziel: mietobjekt, verweisart: zugehoerigkeit, pflicht: true, beschriftungen: { en: { label: "Rental property" } }  }
    - { key: bezeichnung, label: Bezeichnung, typ: text, pflicht: true, maxLen: 60, hilfe: "z. B. „EG links“ oder „Whg. 3“", beschriftungen: { en: { label: "Name", hilfe: "e.g. “Ground floor left” or “Flat 3”" } }  }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Wohnung": "Unit", "Gewerbe": "Commercial", "Garage/Stellplatz": "Garage/parking space", "Sonstiges": "Other" } } }
      typ: auswahl
      optionen: [Wohnung, Gewerbe, Garage/Stellplatz, Sonstiges]
      standard: Wohnung
    - { key: lage, label: Lage, typ: text, maxLen: 60, hilfe: "z. B. „2. OG rechts“", beschriftungen: { en: { label: "Location", hilfe: "e.g. “2nd floor right”" } }  }
    - { key: wohnflaeche, label: Wohnfläche (m²), typ: zahl, min: 0, nachkomma: 2, beschriftungen: { en: { label: "Living space (m²)" } }  }
    - { key: zimmer, label: Zimmer, typ: zahl, min: 0, nachkomma: 1, beschriftungen: { en: { label: "Rooms" } }  }
    - { key: zaehler, label: Zähler, typ: langtext, hilfe: "Zählernummern der Wohnung, z. B. „Strom 1ESY…, Wasser kalt …“", beschriftungen: { en: { label: "Meters", hilfe: "Meter numbers of the unit, e.g. “Electricity 1ESY…, cold water …”" } }  }
    - { key: notiz, label: Notiz, typ: langtext, hilfe: Ausstattung, Schlüssel, Besonderheiten, beschriftungen: { en: { label: "Note", hilfe: "Fittings" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [mietobjekt, bezeichnung, art, lage, wohnflaeche, zimmer, zaehler, notiz], beschriftungen: { en: { name: "General" } }  }
    - key: mietvertraege
      name: Mietverträge
      beschriftungen: { en: { name: "Tenancy agreements" } }
      art: verknuepfungen
      quellen: [{ typ: "vertraege:vertrag", feld: betrifft }]
    - key: ausgaben
      name: Ausgaben
      beschriftungen: { en: { name: "Expenses" } }
      art: verknuepfungen
      quellen: [{ typ: "rechnungen:rechnung", feld: betrifft }]
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [mietobjekt, bezeichnung, lage, wohnflaeche, zimmer]

- schluessel: nebenkostenabrechnung
  name: Nebenkostenabrechnung
  beschreibung: Die Betriebskostenabrechnung eines Jahres für ein Mietobjekt – mit Frist für den Versand an die Mieter.
  beschriftungen: { en: { name: "Service charge statement", beschreibung: "One year’s operating cost statement for a rental property – with the deadline for sending it to the tenants." } }
  titelVorlage: "Nebenkosten {jahr} – {mietobjekt}"
  felder:
    - { key: mietobjekt, label: Mietobjekt, typ: referenz, ziel: mietobjekt, verweisart: zugehoerigkeit, pflicht: true, beschriftungen: { en: { label: "Rental property" } }  }
    - { key: jahr, label: Abrechnungsjahr, typ: text, pflicht: true, muster: "[0-9]{4}", maxLen: 4, hilfe: "Vierstellig, z. B. 2025", beschriftungen: { en: { label: "Statement year", hilfe: "Four digits, e.g. 2025" } }  }
    - { key: von, label: Zeitraum von, typ: datum, beschriftungen: { en: { label: "Period from" } }  }
    - { key: bis, label: Zeitraum bis, typ: datum, beschriftungen: { en: { label: "Period until" } }  }
    - key: versenden_bis
      label: Versenden bis
      beschriftungen: { en: { label: "Send by", hilfe: "End of the statement period plus twelve months – after that, back claims are usually excluded. The included automation reminds you 60 days before." } }
      typ: datum
      hilfe: Ende des Abrechnungszeitraums plus zwölf Monate – danach sind Nachforderungen in der Regel ausgeschlossen. Die mitgelieferte Automatisierung erinnert 60 Tage vorher.
      frist: { vorlauf: 60, einheit: tage }
    - { key: versendet_am, label: Versendet am, typ: datum, max: heute, beschriftungen: { en: { label: "Sent on" } }  }
    - { key: kosten, label: Umlagefähige Kosten gesamt, typ: betrag, waehrung: EUR, beschriftungen: { en: { label: "Total rechargeable costs" } }  }
    - { key: ergebnis, label: Nachzahlungen/Guthaben gesamt, typ: betrag, waehrung: EUR, hilfe: Summe über alle Mieter – Nachzahlungen positiv, Guthaben negativ. Die Abrechnung je Wohnung liegt als Dokument dabei., beschriftungen: { en: { label: "Total back payments/credits", hilfe: "Sum over all tenants – back payments positive" } }  }
    # Ab 2.0.0 ohne Abhängigkeit von Haushalt: das Steuerjahr, wenn Haushalt installiert ist (zielOptional, DMS #1036).
    - { key: steuerjahr, label: Steuerjahr, typ: referenz, zielOptional: ["haushalt:steuerjahr"], verweisart: bezug, hilfe: Für die Anlage V, beschriftungen: { en: { label: "Tax year", hilfe: "For the rental income form (Anlage V)" } }  }
    # Ab 2.0.0: die Rechnungen, die in diese Abrechnung eingeflossen sind (Paket Rechnungen).
    - { key: rechnungen, label: Rechnungen, typ: referenz, ziel: "rechnungen:rechnung", mehrfach: true, verweisart: bezug, hilfe: Die umgelegten Rechnungen dieses Jahres – Grundsteuer, Versicherung, Müll …, beschriftungen: { en: { label: "Invoices", hilfe: "The recharged invoices of this year – property tax, insurance, waste …" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [mietobjekt, jahr, von, bis, versenden_bis, versendet_am, kosten, ergebnis, steuerjahr, rechnungen], beschriftungen: { en: { name: "General" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [mietobjekt, jahr, versenden_bis, versendet_am, ergebnis]
