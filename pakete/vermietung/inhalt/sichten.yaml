# Ansichten des Pakets Vermietung. Schema: schema/inhalt.schema.json
# Ab 2.0.0: Mietverträge sind Verträge (Paket Verträge), Ausgaben Rechnungen (Paket Rechnungen) – die Ansichten zeigen die,
# deren „Betrifft“ auf eine Wohnung bzw. ein Mietobjekt oder eine Wohnung zeigt.
- schluessel: vermietung
  name: Vermietung
  beschreibung: Mietobjekte, Wohnungen, Mietverträge, Nebenkosten und Ausgaben
  beschriftungen: { en: { name: "Letting", beschreibung: "Rental properties, units, tenancy agreements, service charges and expenses" } }
  typen: [mietobjekt, wohnung, nebenkostenabrechnung]
- { schluessel: mietobjekte, name: Mietobjekte, eltern: vermietung, typen: [mietobjekt], beschriftungen: { en: { name: "Rental properties" } }  }
- { schluessel: wohnungen, name: Wohnungen, eltern: vermietung, typen: [wohnung], beschriftungen: { en: { name: "Units" } }  }
- schluessel: mietvertraege
  name: Mietverträge
  beschreibung: Verträge, die eine Wohnung betreffen
  beschriftungen: { en: { name: "Tenancy agreements", beschreibung: "Contracts concerning a unit" } }
  eltern: vermietung
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: betrifft, operator: zeigtAufTyp, wert: ["vermietung:wohnung"] }
- { schluessel: nebenkosten, name: Nebenkostenabrechnungen, eltern: vermietung, typen: [nebenkostenabrechnung], beschriftungen: { en: { name: "Service charge statements" } }  }
- schluessel: ausgaben
  name: Ausgaben
  beschreibung: Rechnungen, die ein Mietobjekt oder eine Wohnung betreffen
  beschriftungen: { en: { name: "Expenses", beschreibung: "Invoices concerning a rental property or unit" } }
  eltern: vermietung
  typen: ["rechnungen:rechnung"]
  bedingungen:
    - { feld: betrifft, operator: zeigtAufTyp, wert: ["vermietung:mietobjekt", "vermietung:wohnung"] }
- schluessel: ausgaben_dieses_jahr
  name: Ausgaben dieses Jahr
  beschriftungen: { en: { name: "Expenses this year" } }
  eltern: ausgaben
  typen: ["rechnungen:rechnung"]
  bedingungen:
    - { feld: betrifft, operator: zeigtAufTyp, wert: ["vermietung:mietobjekt", "vermietung:wohnung"] }
    - { feld: datum, operator: imZeitraum, wert: { art: jahr } }
- schluessel: ausgaben_letztes_jahr
  name: Ausgaben letztes Jahr
  beschreibung: Für die Anlage V der letzten Steuererklärung
  beschriftungen: { en: { name: "Expenses last year", beschreibung: "For the Anlage V of the last tax return" } }
  eltern: ausgaben
  typen: ["rechnungen:rechnung"]
  bedingungen:
    - { feld: betrifft, operator: zeigtAufTyp, wert: ["vermietung:mietobjekt", "vermietung:wohnung"] }
    - { feld: datum, operator: imZeitraum, wert: { art: jahr, versatz: -1 } }
- schluessel: ausgaben_umlagefaehig
  name: Umlagefähig letztes Jahr
  beschreibung: Was in die nächste Nebenkostenabrechnung gehört
  beschriftungen: { en: { name: "Rechargeable last year", beschreibung: "What belongs in the next service charge statement" } }
  eltern: ausgaben
  typen: ["rechnungen:rechnung"]
  bedingungen:
    - { feld: umlagefaehig, operator: ja }
    - { feld: datum, operator: imZeitraum, wert: { art: jahr, versatz: -1 } }
- schluessel: abrechnung_offen
  name: Abrechnung offen
  beschreibung: Nebenkostenabrechnungen, die noch nicht versendet sind
  beschriftungen: { en: { name: "Statement outstanding", beschreibung: "Service charge statements not yet sent" } }
  eltern: vermietung
  typen: [nebenkostenabrechnung]
  bedingungen:
    - { feld: versendet_am, operator: leer }
- schluessel: mieterhoehung
  name: Mieterhöhung möglich
  beschreibung: Mietverträge ohne Ende, bei denen in den nächsten 3 Monaten eine Erhöhung möglich ist oder schon möglich war
  beschriftungen: { en: { name: "Rent increase possible", beschreibung: "Tenancy agreements without an end where an increase is possible in the next 3 months or was already possible" } }
  eltern: vermietung
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: ende, operator: leer }
    - { feld: mieterhoehung_ab, operator: kleiner, wert: { art: heute, versatz: 3, einheit: monate } }
- schluessel: vertrag_endet
  name: Vertrag endet bald
  beschreibung: Mietverträge, die in den nächsten 3 Monaten enden
  beschriftungen: { en: { name: "Agreement ending soon", beschreibung: "Tenancy agreements ending in the next 3 months" } }
  eltern: vermietung
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: betrifft, operator: zeigtAufTyp, wert: ["vermietung:wohnung"] }
    - { feld: ende, operator: zwischen, wert: [{ art: heute }, { art: heute, versatz: 3, einheit: monate }] }
