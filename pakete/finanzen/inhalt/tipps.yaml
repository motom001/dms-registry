# Tipps (Ablago ab 0.285.0, dms-registry #132): je ein kurzer Satz, der an die Stelle in einer Mappe führt.
- schluessel: einspruch
  text: Trag beim Steuerbescheid „Einspruch bis“ ein. So verpasst du die Frist für einen Einspruch nicht.
  bereich: fristen
  typ: steuerjahr
  ziel: mappe.feld:einspruch_bis
- schluessel: belege
  text: Im Steuerjahr zeigt „Belege“ alles, was du diesem Jahr zugeordnet hast – praktisch für die Steuererklärung.
  typ: steuerjahr
  ziel: mappe.register:belege
- schluessel: kontoauszug
  text: Leg Kontoauszüge als Mappe am Konto ab – dann findest du sie unter „Kontoauszüge“ am Konto wieder.
  typ: konto
  ziel: mappe.register:kontoauszuege
