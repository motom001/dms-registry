# Ansichten des Pakets Haus. Schema: schema/inhalt.schema.json
# Ab dieser Version (Thomas, 20.11.2026): oben eine Ansicht mit dem Namen des Pakets und Symbol, darunter je Mappentyp
# eine Ansicht. Fristen-Ansichten bleiben vorerst hier und ziehen unter „Fristen“ aus Basis, sobald Ablago das kann (dms #1517).
# Ab 1.6.0 ohne „Zählerstände dieses Jahr“ und „letztes Jahr“ – solche Ansichten legt man sich bei Bedarf selbst an.
- schluessel: haus
  name: Haus
  beschreibung: Immobilien, Wartungen und Zählerstände
  beschriftungen: { en: { name: "House", beschreibung: "Properties, maintenance and meter readings" } }
  symbol: house
  typen: [immobilie, wartung, zaehlerstand]
- { schluessel: immobilien, name: Immobilien, eltern: haus, symbol: land-plot, typen: [immobilie], beschriftungen: { en: { name: "Properties" } } }
- { schluessel: wartungen, name: Wartungen, eltern: haus, symbol: wrench, typen: [wartung], beschriftungen: { en: { name: "Maintenance" } } }
- { schluessel: zaehlerstaende, name: Zählerstände, eltern: haus, symbol: gauge, typen: [zaehlerstand], beschriftungen: { en: { name: "Meter readings" } } }
- schluessel: wartung_faellig
  name: Wartung fällig
  beschreibung: Wartungen, die in den nächsten 3 Monaten fällig sind oder schon überfällig
  beschriftungen: { en: { name: "Maintenance due", beschreibung: "Maintenance due in the next 3 months or already overdue" } }
  eltern: haus
  symbol: calendar-clock
  typen: [wartung]
  bedingungen:
    - { feld: naechste_faellig, operator: kleiner, wert: { art: heute, versatz: 3, einheit: monate } }
