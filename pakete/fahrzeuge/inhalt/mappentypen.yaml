    - { key: durchgefuehrt_am, label: Durchgeführt am, typ: datum, max: heute, anzeigen: { bedingungen: [{ art: feld, bedingung: { feld: status, op: einerVon, wert: { art: fest, wert: [durchgeführt] } } }] }, beschriftungen: { en: { label: "Done on" } } }
    - { key: werkstatt, label: Werkstatt, typ: referenz, ziel: "basis:organisation", verweisart: bezug, beschriftungen: { en: { label: "Workshop" } } }
