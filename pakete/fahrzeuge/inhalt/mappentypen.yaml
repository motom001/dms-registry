# Mappentypen des Pakets Fahrzeuge. Schema: schema/inhalt.schema.json
# Das DMS legt sie als fahrzeuge_<schluessel> an; angezeigt wird der Name.
# Gemeinsame Felder wie im Paket Haushalt: art, verbleib_original (→ Ablageort des DMS).

- schluessel: fahrzeug
  name: Fahrzeug
  beschreibung: Auto, Motorrad, Wohnmobil, Anhänger oder E-Bike.
  beschriftungen: { en: { name: "Vehicle", beschreibung: "Car, motorbike, motorhome, trailer or e-bike." } }
  titelVorlage: "{bezeichnung} – {kennzeichen}"
  felder:
    - { key: bezeichnung, label: Bezeichnung, typ: text, pflicht: true, maxLen: 120, hilfe: "z. B. „Familienauto“ oder „VW Golf“", beschriftungen: { en: { label: "Name", hilfe: "e.g. “Family car” or “VW Golf”" } }  }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Pkw": "Car", "Motorrad": "Motorbike", "Wohnmobil": "Motorhome", "Anhänger": "Trailer", "E-Bike": "E-bike", "Sonstige": "Other" } } }
      typ: auswahl
      pflicht: true
      optionen: [Pkw, Motorrad, Wohnmobil, Anhänger, E-Bike, Sonstige]
    # Für die Erkennung (DMS 0.113): Post mit Kennzeichen oder Fahrzeug-Identnummer gehört zu diesem Fahrzeug.
    - { key: kennzeichen, label: Kennzeichen, typ: text, eindeutig: true, maxLen: 20, hilfe: "z. B. MU-ST 123", erkennung: { art: nummer, hinweis: "Leerzeichen und Bindestriche zählen nicht: MU-ST 123 = MU ST123" }, beschriftungen: { en: { label: "Registration number", hilfe: "e.g. MU-ST 123" } }  }
    - { key: fin, label: Fahrzeug-Identnummer, typ: text, maxLen: 17, muster: "[A-HJ-NPR-Z0-9]{17}", hilfe: "17 Zeichen ohne I, O und Q – steht im Fahrzeugschein unter E", erkennung: { art: nummer }, beschriftungen: { en: { label: "Vehicle identification number", hilfe: "17 characters without I, O and Q – shown in the registration certificate under E" } }  }
    # Ab 1.2.0 (DMS 0.121): nicht in der Zukunft.
    - { key: erstzulassung, label: Erstzulassung, typ: datum, max: heute, beschriftungen: { en: { label: "First registration" } }  }
    # Bis 1.0.x war der Halter ein Textfeld (halter). Ein Update legt den Verweis dazu; den Text wandelt der
    # Administrator in der Werkbank mit Vorschau um (aus_text, DMS 0.120, #534).
    - { key: halter_verweis, label: Halter, typ: referenz, ziel: "basis:person", verweisart: bezug, aus_text: halter, hilfe: Wer im Fahrzeugschein steht – eine Person aus dem Paket Basis, beschriftungen: { en: { label: "Keeper", hilfe: "Who is named in the registration certificate – a person from the Basis package" } }  }
    - key: hu_faellig
      label: HU fällig
      beschriftungen: { en: { label: "MOT due", hilfe: "Next main inspection (sticker; the month is enough – then use the first of the month). The included automation reminds the person responsible one month before." } }
      typ: datum
      hilfe: Nächste Hauptuntersuchung (Plakette, Monat genügt – dann den Monatsersten). Die mitgelieferte Automatisierung erinnert einen Monat vorher den Verantwortlichen.
      frist: { vorlauf: 1, einheit: monate }
    # Ab 1.4.0 (Ablago 0.177, #113): an wen die HU-Erinnerung geht – ein Benutzer, anders als der Halter.
    - { key: verantwortlich, label: Verantwortlich, typ: referenz, ziel: "dms:benutzer", hilfe: "Wer sich um HU und Termine kümmert – bekommt die Erinnerung. Leer: wer das Fahrzeug angelegt hat.", beschriftungen: { en: { label: "Responsible", hilfe: "Who takes care of the inspection and appointments – gets the reminder. Empty: whoever created the vehicle." } }  }
    - { key: versicherung, label: Versicherung, typ: referenz, ziel: "haushalt:versicherung", verweisart: bezug, hilfe: Die Kfz-Versicherung aus dem Paket Haushalt, beschriftungen: { en: { label: "Insurance", hilfe: "The car insurance from the Household package" } }  }
    - { key: finanzierung, label: Finanzierung/Leasing, typ: referenz, ziel: "haushalt:vertrag", verweisart: bezug, hilfe: Kredit- oder Leasingvertrag aus dem Paket Haushalt, beschriftungen: { en: { label: "Financing/leasing", hilfe: "Loan or leasing contract from the Household package" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo der Fahrzeugbrief (Zulassungsbescheinigung Teil II) liegt, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where the vehicle title (registration certificate part II) is kept" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [bezeichnung, art, kennzeichen, fin, erstzulassung, halter_verweis, hu_faellig, verantwortlich, versicherung, finanzierung, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - key: werkstattrechnungen
      name: Werkstattrechnungen
      beschriftungen: { en: { name: "Garage invoices" } }
      art: verknuepfungen
      quellen: [{ typ: werkstattrechnung, feld: fahrzeug }]
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [bezeichnung, art, kennzeichen, hu_faellig]

- schluessel: werkstattrechnung
  name: Werkstattrechnung
  beschreibung: Rechnung über Inspektion, Reparatur, Reifenwechsel oder HU.
  beschriftungen: { en: { name: "Garage invoice", beschreibung: "Invoice for a service, repair, tyre change or inspection." } }
  titelVorlage: "{datum} – {fahrzeug} – {werkstatt}"
  felder:
    - { key: fahrzeug, label: Fahrzeug, typ: referenz, ziel: fahrzeug, verweisart: zugehoerigkeit, beschriftungen: { en: { label: "Vehicle" } }  }
    # Für die Erkennung: „Aus Dokument ausfüllen“ nimmt Werkstatt, Datum und Betrag aus der Rechnung.
    - { key: werkstatt, label: Werkstatt, typ: referenz, ziel: "basis:organisation", verweisart: bezug, erkennung: {}, beschriftungen: { en: { label: "Garage" } }  }
    - { key: datum, label: Datum, typ: datum, pflicht: true, erkennung: {}, beschriftungen: { en: { label: "Date" } }  }
    - { key: kilometerstand, label: Kilometerstand, typ: zahl, min: 0, nachkomma: 0, beschriftungen: { en: { label: "Mileage" } }  }
    - { key: arbeiten, label: Arbeiten, typ: langtext, hilfe: "z. B. „Inspektion, Bremsbeläge vorn, Ölwechsel“", beschriftungen: { en: { label: "Work done", hilfe: "e.g. “Service, front brake pads, oil change”" } }  }
    - { key: betrag, label: Betrag, typ: betrag, min: 0, waehrung: EUR, erkennung: {}, beschriftungen: { en: { label: "Amount" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo die Rechnung auf Papier liegt, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where the paper invoice is kept" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [fahrzeug, werkstatt, datum, kilometerstand, arbeiten, betrag, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [datum, fahrzeug, werkstatt, kilometerstand, betrag]
