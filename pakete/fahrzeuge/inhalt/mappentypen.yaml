# Mappentypen des Pakets Fahrzeuge. Schema: schema/inhalt.schema.json
# Ablago legt sie als fahrzeuge:<schluessel> an; angezeigt wird der Name.
# Gemeinsame Felder wie im Paket Haushalt: art, verbleib_original (→ Ablageort aus Basis).
# Ab 2.0.0 (dms-registry #163): Werkstattrechnungen sind Rechnungen (Paket Rechnungen, „Betrifft“ = Fahrzeug),
# Versicherung und Finanzierung Verträge aus dem Paket Verträge. Den Umzug bestehender Mappen machen diese Pakete.

- schluessel: fahrzeug
  name: Fahrzeug
  mehrzahl: Fahrzeuge
  beschreibung: Auto, Motorrad, Wohnmobil, Anhänger oder E-Bike.
  beschriftungen: { en: { erkennbarAn: "Registration certificate or purchase contract for the vehicle: registration number, first registration", name: "Vehicle", mehrzahl: "Vehicles", beschreibung: "Car, motorbike, motorhome, trailer or e-bike." } }
  titelVorlage: "{bezeichnung} – {kennzeichen}"
  erkennbarAn: "Zulassungsbescheinigung oder Kaufvertrag zum Fahrzeug: Kennzeichen, Erstzulassung"
  felder:
    - { key: bezeichnung, label: Bezeichnung, typ: text, pflicht: true, maxLen: 120, hilfe: "z. B. „Familienauto“ oder „VW Golf“", beschriftungen: { en: { label: "Name", hilfe: "e.g. “Family car” or “VW Golf”" } }  }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Pkw": "Car", "Motorrad": "Motorbike", "Wohnmobil": "Motorhome", "Anhänger": "Trailer", "Lkw": "Lorry", "Zugmaschine": "Tractor", "E-Bike": "E-bike", "Sonstige": "Other" } } }
      typ: auswahl
      pflicht: true
      optionen: [Pkw, Motorrad, Wohnmobil, Anhänger, Lkw, Zugmaschine, E-Bike, Sonstige]
    # Für die Erkennung (DMS 0.113): Post mit Kennzeichen oder Fahrzeug-Identnummer gehört zu diesem Fahrzeug.
    - { key: kennzeichen, label: Kennzeichen, typ: text, eindeutig: true, maxLen: 20, hilfe: "z. B. MU-ST 123", erkennung: { art: nummer, hinweis: "Leerzeichen und Bindestriche zählen nicht: MU-ST 123 = MU ST123" }, beschriftungen: { en: { label: "Registration number", hilfe: "e.g. MU-ST 123" } }  }
    - { key: fin, label: Fahrzeug-Identnummer, typ: text, maxLen: 17, muster: "[A-HJ-NPR-Z0-9]{17}", hilfe: "17 Zeichen ohne I, O und Q – steht im Fahrzeugschein unter E", erkennung: { art: nummer }, beschriftungen: { en: { label: "Vehicle identification number", hilfe: "17 characters without I, O and Q – shown in the registration certificate under E" } }  }
    # Ab 1.2.0 (DMS 0.121): nicht in der Zukunft.
    - { key: erstzulassung, label: Erstzulassung, typ: datum, max: heute, beschriftungen: { en: { label: "First registration" } }  }
    # Bis 1.0.x war der Halter ein Textfeld (halter). Ein Update legt den Verweis dazu; den Text wandelt der
    # Administrator in der Werkbank mit Vorschau um (aus_text, DMS 0.120, #534).
    - { key: halter_verweis, label: Halter, typ: referenz, ziel: "basis:person", verweisart: bezug, aus_text: halter, hilfe: Wer im Fahrzeugschein steht – eine Person aus dem Paket Basis, beschriftungen: { en: { label: "Keeper", hilfe: "Who is named in the registration certificate – a person from the Basis package" } }  }
    - key: hu_faellig
      label: HU fällig
      beschriftungen: { en: { label: "MOT due", hilfe: "Next main inspection (sticker; the month is enough – then use the first of the month). The included automation reminds the person responsible one month before." } }
      typ: datum
      hilfe: Nächste Hauptuntersuchung (Plakette, Monat genügt – dann den Monatsersten). Die mitgelieferte Automatisierung erinnert einen Monat vorher den Verantwortlichen.
      frist: { vorlauf: 1, einheit: monate }
    # Ab 2.3.0 (dms-registry #227): An- und Abmeldung als Felder, kein eigener Typ. Papiere sind Dokumente am Fahrzeug.
    - key: status
      label: Status
      beschriftungen: { en: { label: "Status", hilfe: "Vehicles taken out of service drop out of the views.", optionen: { "zugelassen": "registered", "vorübergehend abgemeldet": "temporarily deregistered", "außer Betrieb": "out of service (sold, scrapped)" } } }
      typ: auswahl
      standard: zugelassen
      optionen: [zugelassen, vorübergehend abgemeldet, außer Betrieb]
      hilfe: Fahrzeuge außer Betrieb (verkauft, verschrottet) fallen aus den Ansichten.
    - { key: zugelassen_seit, label: Zugelassen seit, typ: datum, max: heute, hilfe: "Auf euch – nicht die Erstzulassung", beschriftungen: { en: { label: "Registered since", hilfe: "To you – not the first registration" } } }
    - { key: abgemeldet_am, label: Abgemeldet am, typ: datum, anzeigen: { bedingungen: [{ art: feld, bedingung: { feld: status, op: einerVon, wert: { art: fest, wert: [vorübergehend abgemeldet, außer Betrieb] } } }] }, beschriftungen: { en: { label: "Deregistered on" } } }
    - { key: saisonkennzeichen, label: Saisonkennzeichen, typ: text, maxLen: 10, hilfe: "Monate wie auf dem Kennzeichen, z. B. „04–10“; leer = ganzjährig", beschriftungen: { en: { label: "Seasonal plate", hilfe: "Months as on the plate, e.g. “04–10”; empty = all year" } } }
    - { key: zulassungsstelle, label: Zulassungsstelle, typ: referenz, ziel: "basis:organisation", verweisart: bezug, beschriftungen: { en: { label: "Registration office" } } }
    # Ab 1.4.0 (Ablago 0.177, #113): an wen die HU-Erinnerung geht – ein Benutzer, anders als der Halter.
    - { key: verantwortlich, label: Verantwortlich, typ: referenz, ziel: "dms:benutzer", hilfe: "Wer sich um HU und Termine kümmert – bekommt die Erinnerung. Leer: wer das Fahrzeug angelegt hat.", beschriftungen: { en: { label: "Responsible", hilfe: "Who takes care of the inspection and appointments – gets the reminder. Empty: whoever created the vehicle." } }  }
    # Ab 2.0.0 Verträge aus dem Paket Verträge (bis 1.x Versicherung bzw. Vertrag aus Haushalt; beim Umzug zeigen die
    # Felder von selbst auf den Vertrag).
    - { key: versicherung, label: Versicherung, typ: referenz, ziel: "vertraege:vertrag", verweisart: bezug, hilfe: Die Kfz-Versicherung – ein Vertrag mit der Vertragsart Versicherung, beschriftungen: { en: { label: "Insurance", hilfe: "The car insurance – a contract of the type insurance" } }  }
    - { key: finanzierung, label: Finanzierung/Leasing, typ: referenz, ziel: "vertraege:vertrag", verweisart: bezug, hilfe: Kredit- oder Leasingvertrag – ein Vertrag aus dem Paket Verträge, beschriftungen: { en: { label: "Financing/leasing", hilfe: "Loan or leasing contract – a contract from the Contracts package" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo der Fahrzeugbrief (Zulassungsbescheinigung Teil II) liegt, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where the vehicle title (registration certificate part II) is kept" } }  }
    # Ab 2.9.0 (dms-registry #279): technische Daten mit Anwendungsfall – Versicherung (HSN/TSN), ABE (Typgenehmigung),
    # Kfz-Steuer (Hubraum, Kraftstoff, Emissionsklasse, CO₂, Gesamtmasse), Anhänger (Anhänge- und Stützlast), Reifenkauf.
    # Feldkennungen der Zulassungsbescheinigung Teil I in der Hilfe. Die Zulassungsbescheinigung füllt leere Werte nach.
    - { key: hsn, label: Herstellerschlüssel (HSN), typ: text, maxLen: 4, muster: "[0-9]{4}", hilfe: "Feld 2.1, vier Ziffern – fragt die Versicherung", beschriftungen: { en: { label: "Manufacturer code (HSN)", hilfe: "Field 2.1, four digits – asked for by insurers" } } }
    - { key: tsn, label: Typschlüssel (TSN), typ: text, maxLen: 3, muster: "[A-Z0-9]{3}", hilfe: "Feld 2.2, die ersten drei Zeichen – fragt die Versicherung", beschriftungen: { en: { label: "Type code (TSN)", hilfe: "Field 2.2, the first three characters – asked for by insurers" } } }
    - { key: typgenehmigung, label: Typgenehmigung, typ: text, maxLen: 35, hilfe: "Feld K, z. B. e1*2007/46*0123*05 – steht auch in ABE und Teilegutachten", erkennung: { art: nummer }, beschriftungen: { en: { label: "Type approval", hilfe: "Field K, e.g. e1*2007/46*0123*05 – also listed in part approvals" } } }
    - { key: hubraum, label: Hubraum (cm³), typ: zahl, min: 0, hilfe: Feld P.1 – für die Kfz-Steuer, beschriftungen: { en: { label: "Engine capacity (cm³)", hilfe: "Field P.1 – for vehicle tax" } } }
    - key: kraftstoff
      label: Kraftstoff
      typ: auswahl
      optionen: [Benzin, Diesel, Elektro, Hybrid Benzin/Elektro, Hybrid Diesel/Elektro, Autogas (LPG), Erdgas (CNG), Wasserstoff, Sonstige]
      hilfe: Feld P.3
      beschriftungen: { en: { label: "Fuel", hilfe: "Field P.3", optionen: { "Benzin": "Petrol", "Diesel": "Diesel", "Elektro": "Electric", "Hybrid Benzin/Elektro": "Hybrid petrol/electric", "Hybrid Diesel/Elektro": "Hybrid diesel/electric", "Autogas (LPG)": "LPG", "Erdgas (CNG)": "CNG", "Wasserstoff": "Hydrogen", "Sonstige": "Other" } } }
    - { key: emissionsklasse, label: Emissionsklasse, typ: text, maxLen: 25, hilfe: "Feld 14, z. B. „Euro 6d“ – für Kfz-Steuer und Umweltzone", beschriftungen: { en: { label: "Emission class", hilfe: "Field 14, e.g. “Euro 6d” – for vehicle tax and low emission zones" } } }
    - { key: co2, label: CO₂ (g/km), typ: zahl, min: 0, hilfe: Feld V.7 – zählt bei der Kfz-Steuer ab Erstzulassung Mitte 2009, beschriftungen: { en: { label: "CO₂ (g/km)", hilfe: "Field V.7 – counts for German vehicle tax from first registration mid-2009" } } }
    - { key: zul_gesamtmasse, label: Zulässige Gesamtmasse (kg), typ: zahl, min: 0, hilfe: Feld F.1 – Kfz-Steuer bei Anhänger und Wohnmobil, Führerscheinklasse, beschriftungen: { en: { label: "Permissible total mass (kg)", hilfe: "Field F.1 – tax for trailers and motorhomes, licence category" } } }
    - { key: anhaengelast_gebremst, label: Anhängelast gebremst (kg), typ: zahl, min: 0, hilfe: Feld O.1, beschriftungen: { en: { label: "Towing capacity braked (kg)", hilfe: "Field O.1" } } }
    - { key: anhaengelast_ungebremst, label: Anhängelast ungebremst (kg), typ: zahl, min: 0, hilfe: Feld O.2, beschriftungen: { en: { label: "Towing capacity unbraked (kg)", hilfe: "Field O.2" } } }
    - { key: stuetzlast, label: Stützlast (kg), typ: zahl, min: 0, hilfe: Feld 13 – auch für den Fahrradträger auf der Kupplung, beschriftungen: { en: { label: "Nose weight (kg)", hilfe: "Field 13 – also for a bike rack on the tow bar" } } }
    - { key: reifengroessen, label: Zulässige Reifengrößen, typ: langtext, maxLen: 1000, hilfe: "Felder 15.1/15.2, beim CoC alle zulässigen – je Zeile eine Größe, z. B. „205/55 R16 91V“", beschriftungen: { en: { label: "Permitted tyre sizes", hilfe: "Fields 15.1/15.2, all permitted ones on the CoC – one size per line, e.g. “205/55 R16 91V”" } } }
    - key: feinstaubplakette
      label: Feinstaubplakette
      typ: auswahl
      optionen: [keine, rot, gelb, grün, blau]
      hilfe: Werte nach XKfz-Codeliste „Nummer der Feinstaubplakette“
      beschriftungen: { en: { label: "Emission sticker", hilfe: "Values from the XKfz code list", optionen: { "keine": "none", "rot": "red", "gelb": "yellow", "grün": "green", "blau": "blue" } } }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [bezeichnung, art, kennzeichen, fin, erstzulassung, halter_verweis, status, zugelassen_seit, abgemeldet_am, saisonkennzeichen, zulassungsstelle, hu_faellig, verantwortlich, versicherung, finanzierung, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - { key: technische_daten, name: Technische Daten, art: felder, felder: [hsn, tsn, typgenehmigung, hubraum, kraftstoff, emissionsklasse, co2, zul_gesamtmasse, anhaengelast_gebremst, anhaengelast_ungebremst, stuetzlast, reifengroessen, feinstaubplakette], beschriftungen: { en: { name: "Technical data" } } }
    # Ab 2.0.0: alle Rechnungen mit „Betrifft“ = dieses Fahrzeug (Werkstatt, Reifen, Zubehör …).
    - key: werkstattrechnungen
      name: Rechnungen
      beschriftungen: { en: { name: "Invoices" } }
      art: verknuepfungen
      quellen: [{ typ: "rechnung_bestellung:rechnung", feld: betrifft }]
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [bezeichnung, art, kennzeichen, hu_faellig]

# Ab 2.3.0 (dms-registry #227): der Prüfbericht der Hauptuntersuchung. Am Fahrzeug unter „Verknüpfungen“ (kein eigenes
# Register). „HU fällig“ am Fahrzeug zieht eine Automatisierung nach, sobald Ablago das kann (dms #1557) – bis dahin von Hand.
- schluessel: hauptuntersuchung
  name: Hauptuntersuchung
  mehrzahl: Hauptuntersuchungen
  beschreibung: Prüfbericht der HU oder Sicherheitsprüfung – Ergebnis, Mängel, Nachprüfung und nächste HU.
  beschriftungen: { en: { erkennbarAn: "Roadworthiness test report: registration number, defects, inspection sticker", name: "Main inspection", mehrzahl: "Main inspections", beschreibung: "Inspection report of the German main inspection (HU) – result, defects, re-inspection and next inspection." } }
  titelVorlage: "HU {geprueft_am|datum:MM/JJJJ} – {fahrzeug|kurz:25} – {ergebnis}"
  erkennbarAn: "Prüfbericht der Hauptuntersuchung: Kennzeichen, Mängel, Prüfplakette"
  felder:
    - { key: fahrzeug, label: Fahrzeug, typ: referenz, ziel: fahrzeug, pflicht: true, verweisart: bezug, beschriftungen: { en: { label: "Vehicle" } } }
    - { key: geprueft_am, label: Geprüft am, typ: datum, max: heute, erkennung: { art: datum }, beschriftungen: { en: { label: "Inspected on" } } }
    - { key: pruefstelle, label: Prüfstelle, typ: referenz, ziel: "basis:organisation", verweisart: bezug, hilfe: "TÜV, DEKRA, GTÜ, KÜS oder die Werkstatt", beschriftungen: { en: { label: "Testing body", hilfe: "TÜV, DEKRA, GTÜ, KÜS or the garage" } } }
    - { key: pruefbericht_nr, label: Prüfbericht-Nr., typ: text, maxLen: 40, erkennung: { art: nummer }, beschriftungen: { en: { label: "Report no." } } }
    - { key: kilometerstand, label: Kilometerstand, typ: zahl, min: 0, beschriftungen: { en: { label: "Mileage" } } }
    - key: ergebnis
      erkennung: { art: auswahl }
      label: Ergebnis
      beschriftungen: { en: { label: "Result", optionen: { "ohne Mängel": "no defects", "geringe Mängel": "minor defects", "erhebliche Mängel": "major defects", "gefährliche Mängel": "dangerous defects", "verkehrsunsicher": "unroadworthy", "unmittelbare Verkehrsgefährdung": "immediate danger to traffic" } } }
      typ: auswahl
      optionen: [ohne Mängel, geringe Mängel, erhebliche Mängel, gefährliche Mängel, verkehrsunsicher, unmittelbare Verkehrsgefährdung]
    - key: nachpruefung_bis
      label: Nachprüfung bis
      beschriftungen: { en: { label: "Re-inspection by", hilfe: "With major or dangerous defects within one month. The included automation reminds you a week before." } }
      typ: datum
      hilfe: Bei erheblichen oder gefährlichen Mängeln innerhalb eines Monats. Die mitgelieferte Automatisierung erinnert eine Woche vorher.
      frist: { vorlauf: 7, einheit: tage }
      anzeigen: { bedingungen: [{ art: feld, bedingung: { feld: ergebnis, op: einerVon, wert: { art: fest, wert: [erhebliche Mängel, gefährliche Mängel] } } }] }
    - { key: maengel, label: Mängel und Hinweise, typ: langtext, hilfe: "Wie im Prüfbericht – je Mangel eine Zeile, darunter die Hinweise", beschriftungen: { en: { label: "Defects and notes", hilfe: "As in the report – one line per defect, the notes below" } } }
    # Ab 2.10.0 (dms-registry #278): Angaben des Digitalen Untersuchungsberichts (XKfz 6.1, Type.DigitalerUntersuchungsbericht).
    - key: art_untersuchung
      label: Art der Untersuchung
      typ: auswahl
      erkennung: { art: auswahl }
      optionen: [Hauptuntersuchung, Sicherheitsprüfung]
      hilfe: Codeliste „Art der Untersuchung“ (HU/SP). Eine Sicherheitsprüfung brauchen nur schwere Fahrzeuge, etwa Wohnmobile über 7,5 t.
      beschriftungen: { en: { label: "Type of inspection", hilfe: "HU = main inspection, SP = safety inspection (heavy vehicles only)", optionen: { "Hauptuntersuchung": "Main inspection (HU)", "Sicherheitsprüfung": "Safety inspection (SP)" } } }
    - key: typ_untersuchung
      label: Untersuchung
      typ: auswahl
      erkennung: { art: auswahl }
      optionen: [Erstuntersuchung, Nachuntersuchung]
      hilfe: Codeliste „Typ der Untersuchung“ – Nachuntersuchung nach erheblichen Mängeln
      beschriftungen: { en: { label: "Inspection", hilfe: "Code list “type of inspection” – re-inspection after major defects", optionen: { "Erstuntersuchung": "First inspection", "Nachuntersuchung": "Re-inspection" } } }
    - { key: pruefplakette, label: Prüfplakette zugeteilt, typ: janein, beschriftungen: { en: { label: "Inspection sticker issued" } } }
    - { key: wiedervorfuehrung, label: Wiedervorführung angeordnet, typ: janein, beschriftungen: { en: { label: "Re-inspection ordered" } } }
    - { key: naechste_sp, label: Nächste Sicherheitsprüfung, typ: datum, anzeigen: { bedingungen: [{ art: feld, bedingung: { feld: art_untersuchung, op: einerVon, wert: { art: fest, wert: [Sicherheitsprüfung] } } }] }, beschriftungen: { en: { label: "Next safety inspection" } } }
    - { key: kosten, label: Kosten, typ: betrag, beschriftungen: { en: { label: "Costs" } } }
    - { key: digitaler_bericht, label: Digitaler Untersuchungsbericht, typ: text, maxLen: 500, hilfe: "Link aus dem QR-Code auf dem Prüfbericht. Er wirkt wie ein Schlüssel zu deinem Bericht – nicht weitergeben. Mit der Ergänzung „Fahrzeuge: Abruf beim KBA“ lassen sich die Daten damit abrufen.", beschriftungen: { en: { label: "Digital inspection report", hilfe: "Link from the QR code on the report. It works like a key to your report – don’t share it. With the add-on “Vehicles: KBA lookup” the data can be fetched." } } }
    - { key: hsn, label: Herstellerschlüssel (HSN), typ: text, maxLen: 4, muster: "[0-9]{4}", hilfe: Laut Bericht – kommt ans Fahrzeug, wenn es dort fehlt, beschriftungen: { en: { label: "Manufacturer code (HSN)", hilfe: "According to the report – copied to the vehicle if missing there" } } }
    - { key: tsn, label: Typschlüssel (TSN), typ: text, maxLen: 3, muster: "[A-Z0-9]{3}", hilfe: Laut Bericht – kommt ans Fahrzeug, wenn es dort fehlt, beschriftungen: { en: { label: "Type code (TSN)", hilfe: "According to the report – copied to the vehicle if missing there" } } }
    - { key: zul_gesamtmasse, label: Zulässige Gesamtmasse (kg), typ: zahl, min: 0, hilfe: Laut Bericht, beschriftungen: { en: { label: "Permissible total mass (kg)", hilfe: "According to the report" } } }
    - { key: naechste_hu, label: Nächste HU, typ: datum, hilfe: "Von der Plakette – der Monat genügt, dann den Monatsersten. Die Automatisierung „Nächste HU ans Fahrzeug übernehmen“ trägt es am Fahrzeug unter „HU fällig“ ein.", beschriftungen: { en: { label: "Next inspection", hilfe: "From the sticker – the month is enough, then use the first. The automation “Copy next inspection to the vehicle” enters it on the vehicle under “MOT due”." } } }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [fahrzeug, art_untersuchung, typ_untersuchung, geprueft_am, pruefstelle, pruefbericht_nr, kilometerstand, ergebnis, pruefplakette, wiedervorfuehrung, nachpruefung_bis, maengel, naechste_hu, naechste_sp, kosten, digitaler_bericht], beschriftungen: { en: { name: "General" } } }
    - { key: fahrzeugdaten, name: Fahrzeugdaten laut Bericht, art: felder, felder: [hsn, tsn, zul_gesamtmasse], beschriftungen: { en: { name: "Vehicle data per report" } } }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } } }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } } }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [fahrzeug, geprueft_am, ergebnis, naechste_hu]

# Ab 2.9.0 (dms-registry #279): Gutachten, Abnahmen und Teile-Nachweise in einem Typ – Teilegutachten und
# Änderungsabnahme gehören meist zusammen. Art: die 7 Werte der XKfz-Codeliste „Art des Gutachtens“
# (urn:xoev-de:bund:kba:codeliste:artdesgutachtens), dazu Oldtimer-Gutachten, ABE und Teilegutachten.
# „Passt zum Fahrzeug“ füllt Ablago, sobald es den Abgleich mit dem Dokument kann (motom001/dms#1717, Teil 3) – bis dahin von Hand.
- schluessel: gutachten
  name: Gutachten / Abnahme
  mehrzahl: Gutachten / Abnahmen
  beschreibung: Gutachten, Abnahme, ABE oder Teilegutachten zu einem Fahrzeug – mit Eintragung in die Papiere.
  beschriftungen: { en: { erkennbarAn: "Expert report or approval: vehicle, approval, test", name: "Expert report / acceptance", mehrzahl: "Expert reports / acceptances", beschreibung: "Expert report, acceptance test, part approval (ABE) or part report for a vehicle – with entry into the papers." } }
  titelVorlage: "{art|kurz:25} – {fahrzeug|kurz:25} – {gegenstand|kurz:25}"
  erkennbarAn: "Gutachten oder Abnahme: Fahrzeug, Genehmigung, Prüfung"
  felder:
    - { key: fahrzeug, label: Fahrzeug, typ: referenz, ziel: fahrzeug, pflicht: true, verweisart: bezug, beschriftungen: { en: { label: "Vehicle" } } }
    - key: art
      label: Art
      typ: auswahl
      pflicht: true
      erkennung: { art: auswahl }
      optionen: [§ 21 StVZO, § 19 Abs. 2 StVZO, § 19 Abs. 3 StVZO, § 23 StVZO (Oldtimer), § 13 FZV, § 11 Abs. 5 FZV, § 13 EG-FGV, Art. 45 VO (EU) 2018/858, ABE, Teilegutachten]
      hilfe: "§ 21 = Einzelbetriebserlaubnis (Vollgutachten), § 19 Abs. 3 = Änderungsabnahme, § 23 = Oldtimer-Gutachten für das H-Kennzeichen"
      beschriftungen: { en: { label: "Type", hilfe: "§ 21 = individual approval (full report), § 19(3) = acceptance of a modification, § 23 = classic car report", optionen: { "§ 21 StVZO": "§ 21 StVZO", "§ 19 Abs. 2 StVZO": "§ 19(2) StVZO", "§ 19 Abs. 3 StVZO": "§ 19(3) StVZO", "§ 23 StVZO (Oldtimer)": "§ 23 StVZO (classic car)", "§ 13 FZV": "§ 13 FZV", "§ 11 Abs. 5 FZV": "§ 11(5) FZV", "§ 13 EG-FGV": "§ 13 EG-FGV", "Art. 45 VO (EU) 2018/858": "Art. 45 Reg. (EU) 2018/858", "ABE": "General type approval of a part (ABE)", "Teilegutachten": "Part report" } } }
    - { key: gutachtennummer, label: Gutachtennummer, typ: text, maxLen: 40, erkennung: {}, beschriftungen: { en: { label: "Report number" } } }
    - { key: datum, label: Datum, typ: datum, max: heute, erkennung: { art: datum }, beschriftungen: { en: { label: "Date" } } }
    - key: prueforganisation
      label: Prüforganisation
      typ: auswahl
      optionen: [DEKRA, FSP, GTÜ, GÜK, KÜS, TÜH, TÜV Hessen, TÜV NORD, TÜV Rheinland, TÜV SAARLAND, TÜV SÜD, TÜV Thüringen, VÜK, Hersteller, Sonstige]
      hilfe: Nach der XKfz-Codeliste „Prüforganisation“; bei ABE und Teilegutachten oft der Hersteller
      beschriftungen: { en: { label: "Testing organisation", hilfe: "From the XKfz code list; for part approvals often the manufacturer", optionen: { "DEKRA": "DEKRA", "FSP": "FSP", "GTÜ": "GTÜ", "GÜK": "GÜK", "KÜS": "KÜS", "TÜH": "TÜH", "TÜV Hessen": "TÜV Hessen", "TÜV NORD": "TÜV NORD", "TÜV Rheinland": "TÜV Rheinland", "TÜV SAARLAND": "TÜV SAARLAND", "TÜV SÜD": "TÜV SÜD", "TÜV Thüringen": "TÜV Thüringen", "VÜK": "VÜK", "Hersteller": "Manufacturer", "Sonstige": "Other" } } }
    - { key: gegenstand, label: Gegenstand, typ: text, maxLen: 120, hilfe: "z. B. Felgen, Fahrwerk, Auspuff, Anhängerkupplung", beschriftungen: { en: { label: "Subject", hilfe: "e.g. wheels, suspension, exhaust, tow bar" } } }
    - { key: eintragung_noetig, label: Eintragung in die Papiere nötig, typ: janein, standard: false, beschriftungen: { en: { label: "Entry into the papers required" } } }
    - { key: eingetragen_am, label: Eingetragen am, typ: datum, max: heute, anzeigen: { bedingungen: [{ art: feld, bedingung: { feld: eintragung_noetig, op: ja } }] }, beschriftungen: { en: { label: "Entered on" } } }
    - key: passt_zum_fahrzeug
      label: Passt zum Fahrzeug
      typ: auswahl
      standard: nicht geprüft
      optionen: [Nummer gefunden, nicht gefunden – selbst prüfen, nicht geprüft]
      hilfe: Steht die Typgenehmigung oder HSN/TSN des Fahrzeugs im Dokument? „Nicht gefunden“ heißt nicht „passt nicht“ – bitte selbst prüfen.
      beschriftungen: { en: { label: "Matches the vehicle", hilfe: "Does the document list the vehicle’s type approval or HSN/TSN? “Not found” doesn’t mean “doesn’t fit” – please check yourself.", optionen: { "Nummer gefunden": "number found", "nicht gefunden – selbst prüfen": "not found – check yourself", "nicht geprüft": "not checked" } } }
    - { key: verbleib_original, label: Verbleib Original, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: ABE und Teilegutachten muss man oft im Fahrzeug mitführen, beschriftungen: { en: { label: "Where the original is", hilfe: "Part approvals often have to be carried in the vehicle" } } }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [fahrzeug, art, gutachtennummer, datum, prueforganisation, gegenstand, eintragung_noetig, eingetragen_am, passt_zum_fahrzeug, verbleib_original], beschriftungen: { en: { name: "General" } } }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } } }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } } }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [fahrzeug, art, gegenstand, datum]

# Ab 2.9.0 (#279): jede Zulassungsbescheinigung einzeln – Teil I gibt es bei Umzug, Ummeldung oder Eintragung neu.
# „Ersetzt“ verkettet sie. Die mitgelieferte Automatisierung füllt leere Werte am Fahrzeug nach (nur leere, nie
# überschreiben – so schadet auch ein nachträglich eingescannter alter Schein nicht) und übernimmt die nächste HU, wenn sie später ist.
- schluessel: zulassungsbescheinigung
  name: Zulassungsbescheinigung
  mehrzahl: Zulassungsbescheinigungen
  beschreibung: Fahrzeugschein (Teil I) oder Fahrzeugbrief (Teil II) – jede Ausgabe einzeln, mit Anlass.
  beschriftungen: { en: { erkennbarAn: "Registration certificate: registration, vehicle, holder", name: "Registration certificate", mehrzahl: "Registration certificates", beschreibung: "Registration certificate part I or part II – each issue separately, with the reason." } }
  titelVorlage: "{teil} {ausgestellt_am|datum:MM/JJJJ} – {fahrzeug|kurz:25} – {anlass}"
  erkennbarAn: "Zulassungsbescheinigung: Fahrzeugschein, Kennzeichen, Halter"
  felder:
    - { key: fahrzeug, label: Fahrzeug, typ: referenz, ziel: fahrzeug, pflicht: true, verweisart: bezug, beschriftungen: { en: { label: "Vehicle" } } }
    - key: teil
      label: Teil
      typ: auswahl
      pflicht: true
      erkennung: { art: auswahl }
      optionen: [Teil I, Teil II]
      hilfe: Teil I = Fahrzeugschein, Teil II = Fahrzeugbrief
      beschriftungen: { en: { label: "Part", hilfe: "Part I = registration document, part II = vehicle title", optionen: { "Teil I": "Part I", "Teil II": "Part II" } } }
    - { key: nummer, label: Nummer, typ: text, maxLen: 30, erkennung: {}, hilfe: Nummer der Bescheinigung oben links, beschriftungen: { en: { label: "Number", hilfe: "Number of the certificate, top left" } } }
    - { key: ausgestellt_am, label: Ausgestellt am, typ: datum, max: heute, erkennung: { art: datum }, hilfe: Feld I, beschriftungen: { en: { label: "Issued on", hilfe: "Field I" } } }
    - { key: kennzeichen, label: Kennzeichen, typ: text, maxLen: 20, hilfe: Feld A – das Kennzeichen zu dieser Zeit, beschriftungen: { en: { label: "Registration number", hilfe: "Field A – the number at that time" } } }
    - key: anlass
      label: Anlass
      typ: auswahl
      optionen: [Erstzulassung, Umzug, Halterwechsel, Saisonkennzeichen, Eintragung nach § 19/§ 21, Wiederzulassung, Ersatz bei Verlust, Sonstiges]
      beschriftungen: { en: { label: "Reason", optionen: { "Erstzulassung": "First registration", "Umzug": "Move", "Halterwechsel": "Change of keeper", "Saisonkennzeichen": "Seasonal plate", "Eintragung nach § 19/§ 21": "Entry after § 19/§ 21", "Wiederzulassung": "Re-registration", "Ersatz bei Verlust": "Replacement after loss", "Sonstiges": "Other" } } }
    - { key: ersetzt, label: Ersetzt, typ: referenz, ziel: zulassungsbescheinigung, verweisart: bezug, auswahlFilter: [{ art: feld, feld: fahrzeug, op: zeigtAuf, wert: { art: eigenesFeld, feld: fahrzeug } }], hilfe: Die vorige Bescheinigung desselben Teils – sie gilt dann nicht mehr, beschriftungen: { en: { label: "Replaces", hilfe: "The previous certificate of the same part – it no longer applies" } } }
    - { key: naechste_hu, label: Nächste HU, typ: datum, hilfe: Feld X (nur Teil I) – Monat genügt, dann den Monatsersten, beschriftungen: { en: { label: "Next inspection", hilfe: "Field X (part I only) – the month is enough, then use the first" } } }
    - { key: hsn, label: Herstellerschlüssel (HSN), typ: text, maxLen: 4, muster: "[0-9]{4}", hilfe: Feld 2.1, beschriftungen: { en: { label: "Manufacturer code (HSN)", hilfe: "Field 2.1" } } }
    - { key: tsn, label: Typschlüssel (TSN), typ: text, maxLen: 3, muster: "[A-Z0-9]{3}", hilfe: Feld 2.2, die ersten drei Zeichen, beschriftungen: { en: { label: "Type code (TSN)", hilfe: "Field 2.2, the first three characters" } } }
    - { key: typgenehmigung, label: Typgenehmigung, typ: text, maxLen: 35, hilfe: Feld K, beschriftungen: { en: { label: "Type approval", hilfe: "Field K" } } }
    - { key: hubraum, label: Hubraum (cm³), typ: zahl, min: 0, hilfe: Feld P.1, beschriftungen: { en: { label: "Engine capacity (cm³)", hilfe: "Field P.1" } } }
    - { key: emissionsklasse, label: Emissionsklasse, typ: text, maxLen: 25, hilfe: Feld 14, beschriftungen: { en: { label: "Emission class", hilfe: "Field 14" } } }
    - { key: co2, label: CO₂ (g/km), typ: zahl, min: 0, hilfe: Feld V.7, beschriftungen: { en: { label: "CO₂ (g/km)", hilfe: "Field V.7" } } }
    - { key: zul_gesamtmasse, label: Zulässige Gesamtmasse (kg), typ: zahl, min: 0, hilfe: Feld F.1, beschriftungen: { en: { label: "Permissible total mass (kg)", hilfe: "Field F.1" } } }
    - { key: anhaengelast_gebremst, label: Anhängelast gebremst (kg), typ: zahl, min: 0, hilfe: Feld O.1, beschriftungen: { en: { label: "Towing capacity braked (kg)", hilfe: "Field O.1" } } }
    - { key: anhaengelast_ungebremst, label: Anhängelast ungebremst (kg), typ: zahl, min: 0, hilfe: Feld O.2, beschriftungen: { en: { label: "Towing capacity unbraked (kg)", hilfe: "Field O.2" } } }
    - { key: stuetzlast, label: Stützlast (kg), typ: zahl, min: 0, hilfe: Feld 13, beschriftungen: { en: { label: "Nose weight (kg)", hilfe: "Field 13" } } }
    - { key: reifengroessen, label: Reifengrößen, typ: langtext, maxLen: 1000, hilfe: Felder 15.1 und 15.2, beschriftungen: { en: { label: "Tyre sizes", hilfe: "Fields 15.1 and 15.2" } } }
    - { key: verbleib_original, label: Verbleib Original, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, beschriftungen: { en: { label: "Where the original is" } } }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [fahrzeug, teil, nummer, ausgestellt_am, kennzeichen, anlass, ersetzt, naechste_hu, verbleib_original], beschriftungen: { en: { name: "General" } } }
    - { key: technische_daten, name: Technische Daten, art: felder, felder: [hsn, tsn, typgenehmigung, hubraum, emissionsklasse, co2, zul_gesamtmasse, anhaengelast_gebremst, anhaengelast_ungebremst, stuetzlast, reifengroessen], beschriftungen: { en: { name: "Technical data" } } }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } } }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } } }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [fahrzeug, teil, ausgestellt_am, kennzeichen, anlass]

