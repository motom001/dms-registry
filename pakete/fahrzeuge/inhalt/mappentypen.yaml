  name: Rückruf
  mehrzahl: Rückrufe
  beschreibung: Rückrufaktion des Herstellers – vom Anschreiben bis zur Bestätigung der Werkstatt.
  beschriftungen: { en: { erkennbarAn: "Recall: vehicle, workshop, appointment", name: "Recall", mehrzahl: "Recalls", beschreibung: "Manufacturer recall – from the letter to the workshop’s confirmation." } }
  titelVorlage: "Rückruf {rueckrufcode} – {fahrzeug|kurz:25} – {status}"
  erkennbarAn: "Rückrufaktion: Fahrzeug, Werkstatt, Termin"
  felder:
    - { key: fahrzeug, label: Fahrzeug, typ: referenz, ziel: fahrzeug, pflicht: true, verweisart: bezug, beschriftungen: { en: { label: "Vehicle" } } }
    - { key: rueckrufcode, label: Rückrufcode, typ: text, maxLen: 20, erkennung: {}, hilfe: "Code des Herstellers, meist sechs Zeichen", beschriftungen: { en: { label: "Recall code", hilfe: "Manufacturer’s code, usually six characters" } } }
    - { key: kba_referenz, label: KBA-Referenznummer, typ: text, maxLen: 10, muster: "[0-9]{4,6}R?", hilfe: "Fünf Ziffern und „R“ – steht oft nicht im Schreiben, sondern in der Rückrufdatenbank des KBA", beschriftungen: { en: { label: "KBA reference", hilfe: "Five digits and “R” – often not in the letter but in the KBA recall database" } } }
    - { key: grund, label: Grund, typ: text, maxLen: 200, beschriftungen: { en: { label: "Reason" } } }
