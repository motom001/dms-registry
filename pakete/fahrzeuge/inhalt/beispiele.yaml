# ({ beispiel: … }, ab DMS 0.79.0). Werkstatt und Ablageort „Safe“ setzt du selbst.
- typ: fahrzeug
  schluessel: familienauto
  werte: { versicherung: { beispiel: "haushalt:kfz" }, bezeichnung: Familienauto, art: Pkw, kennzeichen: MU-ST 123, fin: WVWZZZ1KZAW000001, erstzulassung: "2019-05-17", halter: Max Muster, hu_faellig: "2027-01-01" }
- typ: werkstattrechnung
  werte: { fahrzeug: { beispiel: familienauto }, datum: "2025-05-12", kilometerstand: 61450, arbeiten: "Inspektion, Ölwechsel, Innenraumfilter", betrag: 389.4 }
- typ: werkstattrechnung
  werte: { fahrzeug: { beispiel: familienauto }, datum: "2026-04-03", kilometerstand: 74210, arbeiten: "Reifenwechsel, Bremsbeläge vorn", betrag: 214 }
