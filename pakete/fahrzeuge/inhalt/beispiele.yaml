# Beispiel-Mappen der erfundenen Familie Muster (Lena, Tom und Jonas).
# Das Auto zeigt auf seine Kfz-Versicherung (ein Vertrag aus dem Paket Verträge), die Werkstattrechnungen (Rechnungen aus
# dem Paket Rechnungen) zeigen mit „Betrifft“ auf das Auto ({ beispiel: … }, ab DMS 0.79.0). Halter, Werkstatt und
# Ablageort „Safe“ setzt du selbst.
- typ: "vertraege:vertrag"
  schluessel: kfz
  werte:
    bezeichnung: Kfz-Versicherung Familienauto
    art: { vorgabe: "vertraege:versicherung" }
    versicherung_art: Kfz
    vertragsnummer: KFZ-2019-55
    beginn: "2019-05-17"
    mindestlaufzeit: { anzahl: 12, einheit: monate }
    verlaengerung: verlängert sich um
    verlaengerung_um: { anzahl: 12, einheit: monate }
    kuendigungsfrist: { anzahl: 1, einheit: monate }
    kuendigung_zum: Laufzeitende
    hauptfaelligkeit: "2027-01-01"
    betrag: { betrag: 412.8, waehrung: EUR }
    zahlweise: jährlich
- typ: fahrzeug
  schluessel: familienauto
  werte: { versicherung: { beispiel: kfz }, bezeichnung: Familienauto, art: Pkw, kennzeichen: MU-ST 123, fin: WVWZZZ1KZAW000001, erstzulassung: "2019-05-17", hu_faellig: "2027-01-01" }
- typ: "rechnungen:rechnung"
  werte: { betrifft: [{ beispiel: familienauto }], datum: "2025-05-12", kilometerstand: 61450, arbeiten: "Inspektion, Ölwechsel, Innenraumfilter", betrag: { betrag: 389.4, waehrung: EUR }, bezahlt_am: "2025-05-12" }
- typ: "rechnungen:rechnung"
  werte: { betrifft: [{ beispiel: familienauto }], datum: "2026-04-03", kilometerstand: 74210, arbeiten: "Reifenwechsel, Bremsbeläge vorn", betrag: { betrag: 214, waehrung: EUR }, bezahlt_am: "2026-04-03" }
