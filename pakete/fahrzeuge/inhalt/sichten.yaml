# Ansichten des Pakets Fahrzeuge. Schema: schema/inhalt.schema.json
# Ab dieser Version (Thomas, 20.11.2026): oben eine Ansicht mit dem Namen des Pakets und Symbol, darunter je Mappentyp
# eine Ansicht. Fristen-Ansichten bleiben vorerst hier und ziehen unter „Fristen“ aus Basis, sobald Ablago das kann (dms #1517).
# Ab 2.2.0 ohne „Alle Fahrzeuge“ (doppelt) und „Rechnungen zu Fahrzeugen“ (stehen am Fahrzeug unter „Rechnungen“).
- schluessel: fahrzeuge
  name: Fahrzeuge
  beschreibung: Alle Fahrzeuge
  beschriftungen: { en: { name: "Vehicles", beschreibung: "All vehicles" } }
  symbol: car
  typen: [fahrzeug]
- schluessel: hu_faellig
  name: HU fällig
  beschreibung: Fahrzeuge, deren Hauptuntersuchung in den nächsten 3 Monaten fällig oder schon überfällig ist
  beschriftungen: { en: { name: "MOT due", beschreibung: "Vehicles whose main inspection is due in the next 3 months or already overdue" } }
  eltern: fahrzeuge
  symbol: calendar-clock
  typen: [fahrzeug]
  bedingungen:
    - { feld: hu_faellig, operator: kleiner, wert: { art: heute, versatz: 3, einheit: monate } }
