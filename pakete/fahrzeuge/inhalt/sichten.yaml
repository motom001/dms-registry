# Ansichten des Pakets Fahrzeuge. Schema: schema/inhalt.schema.json
# Ab dieser Version (Thomas, 20.11.2026): oben eine Ansicht mit dem Namen des Pakets und Symbol, darunter je Mappentyp
# eine Ansicht. Fristen-Ansichten bleiben vorerst hier und ziehen unter „Fristen“ aus Basis, sobald Ablago das kann (dms #1517).
# Ab 2.3.0 (#227): Fahrzeuge außer Betrieb fallen aus „Fahrzeuge“ und „HU fällig“; neu „Hauptuntersuchungen“.
# Ab 2.2.0 ohne „Alle Fahrzeuge“ (doppelt) und „Rechnungen zu Fahrzeugen“ (stehen am Fahrzeug unter „Rechnungen“).
# Ab 2.10.1: Wie bei Haus und Gesundheit zeigt die oberste Ansicht alle Mappen des Pakets; die Fahrzeuge selbst
# stehen darunter in „Aktuelle Fahrzeuge“ (ohne die außer Betrieb). Schlüssel „fahrzeuge“ bleibt für die oberste.
- schluessel: fahrzeuge
  name: Fahrzeuge
  beschreibung: Alles zu den Fahrzeugen – Fahrzeuge, Hauptuntersuchungen, Papiere, Gutachten und Rückrufe
  beschriftungen: { en: { name: "Vehicles", beschreibung: "Everything about the vehicles – vehicles, inspections, papers, reports and recalls" } }
  symbol: car
  typen: [fahrzeug, hauptuntersuchung, zulassungsbescheinigung, fahrzeugpapiere, gutachten, rueckruf]
- schluessel: aktuelle_fahrzeuge
  name: Aktuelle Fahrzeuge
  beschreibung: Zugelassene und vorübergehend abgemeldete Fahrzeuge
  beschriftungen: { en: { name: "Current vehicles", beschreibung: "Registered and temporarily deregistered vehicles" } }
  eltern: fahrzeuge
  symbol: list-checks
  typen: [fahrzeug]
  bedingungen:
    - { feld: status, operator: einerVon, wert: { art: fest, wert: [zugelassen, vorübergehend abgemeldet] } }
- schluessel: hu_faellig
  name: HU fällig
  beschreibung: Fahrzeuge, deren Hauptuntersuchung in den nächsten 3 Monaten fällig oder schon überfällig ist
  beschriftungen: { en: { name: "MOT due", beschreibung: "Vehicles whose main inspection is due in the next 3 months or already overdue" } }
  eltern: fahrzeuge
  symbol: calendar-clock
  typen: [fahrzeug]
  bedingungen:
    - { feld: hu_faellig, operator: kleiner, wert: { art: heute, versatz: 3, einheit: monate } }
    - { feld: status, operator: einerVon, wert: { art: fest, wert: [zugelassen, vorübergehend abgemeldet] } }
- { schluessel: hauptuntersuchungen, name: Hauptuntersuchungen, symbol: clipboard-check, eltern: fahrzeuge, typen: [hauptuntersuchung], beschriftungen: { en: { name: "Main inspections" } } }
# Ab 2.9.0 (#279).
- { schluessel: zulassungsbescheinigungen, name: Zulassungsbescheinigungen, symbol: id-card, eltern: fahrzeuge, typen: [zulassungsbescheinigung], beschriftungen: { en: { name: "Registration certificates" } } }
- { schluessel: gutachten, name: Gutachten / Abnahmen, symbol: stamp, eltern: fahrzeuge, typen: [gutachten], beschriftungen: { en: { name: "Expert reports / acceptances" } } }
- { schluessel: fahrzeugpapiere, name: Fahrzeugpapiere, symbol: files, eltern: fahrzeuge, typen: [fahrzeugpapiere], beschriftungen: { en: { name: "Vehicle papers" } } }
- schluessel: offene_rueckrufe
  name: Offene Rückrufe
  beschriftungen: { en: { name: "Open recalls" } }
  eltern: fahrzeuge
  symbol: wrench
  typen: [rueckruf]
  bedingungen:
    - { feld: status, operator: einerVon, wert: { art: fest, wert: [angekündigt, Termin vereinbart] } }
