# Zusatzpaket: Portugiesisch für das Paket Texterkennung (nach dem Muster texterkennung_fra). Schema: schema/manifest.schema.json
schema: 1
id: texterkennung_por
name: Texterkennung – Zusatzsprache Portugiesisch
version: 1.0.2
beschreibung: Zusatzsprache Portugiesisch für das Grundpaket Texterkennung – damit auch portugiesische Briefe und Scans durchsuchbar werden. Enthält nur die Sprachdaten (tessdata_fast), ohne eigene Rechte, ohne Netz.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
# Symbol im Katalog (#98): Kürzel = ISO-639-1-Code der Sprache, nicht des Landes.
symbol: languages
kuerzel: PT
# 0.133.0: Ein Paket liest die Daten der Pakete, die von ihm abhängen (<paket>/<datei>).
dms: ">=0.133.0"
abhaengigkeiten:
  texterkennung: ">=2.0.0"
# Ergänzung (motom001/dms#405): das DMS ab 0.151.0 zeigt die Sprache als Häkchen „Weitere Sprachen?“ unter der
# Texterkennung; ältere DMS ignorieren das Feld.
ergaenzt: { paket: texterkennung, gruppe: Weitere Sprachen }
inhalt: {}
code:
  sprache: c
  quelle: code/
  ereignisse: []
  rechte:
    dokumente: keine
  netz: []
