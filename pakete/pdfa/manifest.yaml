# Paket PDF/A – legt zu Dokumenten eine Archivfassung ab: ein durchsuchbares PDF/A-2b mit unsichtbarer Textebene genau
# auf den Wörtern, für die Langzeitaufbewahrung. Das Original bleibt das Dokument. Schema: schema/manifest.schema.json
schema: 1
id: pdfa
name: PDF/A
version: 1.3.0
beschreibung: Legt zu jedem Dokument zusätzlich ein durchsuchbares PDF/A ab – das Format für die Langzeitaufbewahrung, auch in vielen Jahren noch lesbar. Auch E-Mails (.eml, .msg) werden so zu Seiten. Für Scans und Fotos braucht es das Paket „Texterkennung“. Das Original bleibt unverändert, ohne Netz.
autor:
  name: Thomas Meissner
  github: motom001
herausgeber: app.ablago
lizenz: Apache-2.0
kategorien: [dateiformate]
symbol: file-text
# 0.149.0: Recht dms:archivfassung, code.archivfassung, Ereignis datei.archivfassung, Wortpositionen,
# PUT /dokumente/{id}/archivfassung (DMS #631); 0.176.0: code.archivfassung.auswahl (DMS #660);
# 0.221.0: Art emails und Feld zeitzone in datei.archivfassung (DMS #946); farbige Seitenbilder (scan?farbe=1) gibt es
# seit 0.174.0 (DMS #716)
dms: ">=0.221.0"
inhalt: {}
code:
  sprache: c
  quelle: code/
  ereignisse: [datei.archivfassung]
  archivfassung:
    # PDF, JPEG und PNG liest das Paket selbst; TIFF, WebP, GIF und BMP über die Lesefassung des Pakets Bildformate.
    # E-Mails (.eml, .msg; bei application/octet-stream nur mit dieser Endung) setzt das Paket selbst zu Seiten (#143).
    typen: [application/pdf, image/jpeg, image/png, image/tiff, image/webp, image/gif, image/bmp, message/rfc822,
            application/vnd.ms-outlook, application/octet-stream]
    auswahl:              # je Art eine Ja/Nein-Einstellung unten (an: bekommt eine Archivfassung)
      pdf_text: pdf_text
      pdf_scan: pdf_scan
      bilder: bilder
      emails: emails
  rechte:
    lesen: ["*"]          # Dokumente liegen in Mappen beliebiger Typen
    dokumente: lesen      # Datei, Seitenbilder und Wortpositionen lesen; das Paket ändert keine Dokumente
    schnittstellen: ["dms:archivfassung"]  # das PDF/A neben dem Original ablegen
  netz: []
  einstellungen:
    - abschnitt: Archivfassung anlegen für …
      felder:
        - schluessel: pdf_text
          name: PDFs mit Text
          typ: janein
          standard: true
          hilfe: z. B. Online-Rechnungen, Kontoauszüge. Aus spart Platz; diese PDFs bleiben dann nur im Original.
        - schluessel: pdf_scan
          name: Gescannte PDFs
          typ: janein
          standard: true
          hilfe: PDFs ohne Text oder nur mit Text auf einzelnen Seiten. Den Text liefert das Paket Texterkennung.
        - schluessel: bilder
          name: Fotos und Bilder
          typ: janein
          standard: true
          hilfe: Immer .jpg, .jpeg und .png; mit dem Paket Bildformate auch .tif, .tiff, .webp, .gif und .bmp. Den Text liefert das Paket Texterkennung.
        - schluessel: emails
          name: E-Mails (.eml, .msg)
          typ: janein
          standard: true
          hilfe: Kopf, Text und Bilder der Mail als Seiten; Anhänge nur als Liste (sie bleiben im Original). Bilder aus dem Internet werden nie geladen.
