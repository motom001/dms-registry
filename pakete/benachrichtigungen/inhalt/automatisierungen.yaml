# Mitgelieferte Automatisierungen (Ablago #712/#678, dms-registry #109). Beim Installieren fragt Ablago, welche gleich
# eingeschaltet werden (vorausgewählt sind alle). Die Werte entsprechen dem, was Ablago bisher von selbst machte.
- schluessel: zusammenfassung
  name: Tägliche Zusammenfassung
  beschreibung: Jeder mit offenen Aufgaben bekommt einmal am Tag eine Übersicht per E-Mail – zur Uhrzeit, an den Wochentagen und Feiertagen aus seinem Profil (sonst werktags um 7:00). Abbestellen geht im Profil.
  wenn: { art: zeitplan, uhrzeit: "07:00", tage: [1, 2, 3, 4, 5], feiertage: true, jeBenutzer: true, profilzeit: true }
  dann:
    - { art: zusammenfassung }
- schluessel: favoriten
  name: Favoriten-Änderungen melden
  beschreibung: Wer eine Mappe als Favorit hat und benachrichtigt werden will, bekommt eine gebündelte Benachrichtigung „Geändert“, wenn jemand anderes sie ändert.
  wenn: { art: favorit.geaendert }
  dann:
    - { art: favoriten }
- schluessel: vertretung_eingetragen
  name: Vertretung eingetragen
  beschreibung: Wer als Vertreter hinterlegt wird, bekommt eine Aufgabe. Sie erledigt sich, wenn die Abwesenheit endet oder sich die Vertretung ändert.
  wenn: { art: benutzer.abwesenheit_gesetzt }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ereignis, feld: vertreter }], text: "Hallo {vertreter}, {benutzer} hat dich {zeitraum} als Vertreter hinterlegt." }
- schluessel: vertretung_zurueckgezogen
  name: Vertretung zurückgezogen
  beschreibung: Der bisherige Vertreter erfährt, wenn die Abwesenheit endet oder jemand anderes eingetragen ist.
  wenn: { art: benutzer.vertretung_zurueckgezogen }
  dann:
    - { art: aufgabe, als: benachrichtigung, empfaenger: [{ art: ereignis, feld: vertreter }], text: "Hallo {vertreter}, {benutzer} hat die Vertretung zurückgezogen. Du bist nicht mehr Vertreter für {benutzer}." }
- schluessel: post_fuer_dich
  name: Post für dich
  beschreibung: Wer bei neuer Post unter „An“ steht, bekommt eine Aufgabe „Post für dich – bitte zuordnen“ – bei Abwesenheit die Vertretung. Sie erledigt sich, sobald die Post zugeordnet oder erledigt ist oder an jemand anderen geht; je Post und Person gibt es nur eine.
  # Ablago #1001: bis 0.256 fest eingebaut. Wenn neue Post eingeht oder sich „An“ bzw. der Stand ändert …
  wenn: { art: mappe.geaendert, typ: "dms:post", felder: [an, stand], angelegt: true }
  # … solange jemand in „An“ steht und die Post neu ist …
  und:
    modus: alle
    karten:
      - { art: bedingung, bedingung: { art: feld, feld: an, op: nichtLeer } }
      - { art: bedingung, bedingung: { art: feld, feld: stand, op: einerVon, wert: { art: fest, wert: [Neu] } } }
  # … Aufgabe an diese Person. Ablago gibt ihr die Art „Post für dich“ und erledigt sie selbst.
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: feld, feld: an }], text: "Post für dich – bitte zuordnen" }
- schluessel: anmeldeschutz_sammelmeldung
  name: Sammelmeldung Anmeldeschutz
  beschreibung: Kurz nach Mitternacht eine Mail an die Administratoren über die Sperren seit der letzten Meldung – nur, wenn es welche gab. Angriffsversuche aus dem Internet sind normal; schalte sie ein, wenn du trotzdem Bescheid wissen willst.
  wenn: { art: zeitplan, uhrzeit: "00:00", tage: [1, 2, 3, 4, 5, 6, 7] }
  dann:
    - { art: anmeldeschutz, was: sammel }
- schluessel: kontosperre
  name: Kontosperre sofort melden
  beschreibung: Eine Mail an die Administratoren, sobald ein bestehendes Benutzerkonto nach zu vielen falschen Passwörtern gesperrt wird – je Konto höchstens einmal am Tag.
  wenn: { art: benutzer.gesperrt }
  dann:
    - { art: anmeldeschutz, was: konto }
