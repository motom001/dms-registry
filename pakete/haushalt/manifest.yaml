# Paket Haushalt. Schema: schema/manifest.schema.json
schema: 1
id: haushalt
name: Haushalt
herausgeber: app.ablago
version: 5.1.0
beschreibung: Die typischen Unterlagen eines Haushalts – Arbeit, Vorsorge, Anschaffungen und mehr – mit Fristen, Ansichten und Beispielen. Konten und Steuerjahre kommen aus dem Paket Finanzen, Verträge und Versicherungen aus Verträge, Rechnungen aus Rechnungen und Bestellungen.
autor:
  name: Thomas Meissner
  github: motom001
lizenz: Apache-2.0
# 0.75.0: Verweise auf Mappentypen von Ablago (dms:…); 0.79.0: Verweise zwischen Beispielen
# 0.113.0: Feld-Eigenschaft „für die Erkennung nutzen“ (erkennung, DMS #336/#391)
# 0.120.0: Text in Verweis umwandeln (aus_text, DMS #534) – Inhaber, Versichert und Person als Verweis auf eine Person
# 0.121.0: Feldformate und Datumsgrenzen (format, landFeld, min/max bei Datum, DMS #535)
# 0.177.0: mitgelieferte Automatisierungen (inhalt.automatisierungen, Ablago #712) – das Datumsfeld erinnert nicht mehr selbst
# 0.212.0: Ablageort aus dem Paket Basis (basis:ablageort, Ablago #883)
# 0.243.0: Verträge 1.1.0 und Rechnungen 1.1.0 (Umbau, DMS #1041) – Vertrag und Versicherung ziehen dorthin (dms-registry #163)
# 0.293.2: Texte der Rundgänge und Tipps in texte/<sprache>/entdecken.json (Ablago #1307)
dms: ">=0.293.2"
# „So nutzt du es“ (dms-registry #164)
kurzanleitung:
  de:
    - Lege deine Bank, Versicherer und Arbeitgeber einmal als Organisation an – du wählst sie danach überall aus.
    - Leg Arbeitsverhältnisse, Vorsorge und Anschaffungen als Mappe an; Konten im Paket Finanzen, Verträge und Versicherungen als Vertrag, Ausweise im Paket „Ämter & Papiere“.
    - Trag bei der Anschaffung „Garantie bis“ ein – die mitgelieferte Automatisierung erinnert rechtzeitig, wenn du sie einschaltest.
    - Ordne Anschaffungen und Fortbildungen einem Steuerjahr zu – im Steuerjahr (Paket Finanzen) stehen sie dann unter „Belege“.
  en:
    - Create your bank, insurers and employers once as an organisation – then you can choose them everywhere.
    - Create jobs, pensions and purchases as folders; accounts in the Finances package, contracts and insurance policies as a contract, IDs in the “Authorities & papers” package.
    - Enter “Warranty until” for purchases – the included automation reminds you in time once you turn it on.
    - Assign purchases and training to a tax year – the tax year (Finances package) then lists them under “Receipts”.
abhaengigkeiten:
  # Ab 2.0.0 (dms-registry #163): Vertrag und Versicherung aus Verträge, Rechnungen und Kassenbons aus Rechnungen.
  basis: ">=1.10.0"
  vertraege: ">=1.1.0"
  rechnung_bestellung: ">=1.1.0"
  # Ab 3.0.0 (dms-registry #212): Konto und Steuerjahr aus Finanzen.
  finanzen: ">=2.2.0"
inhalt:
  mappentypen: inhalt/mappentypen.yaml
  sichten: inhalt/sichten.yaml
  beispiele: inhalt/beispiele.yaml
  automatisierungen: inhalt/automatisierungen.yaml
  tipps: inhalt/tipps.yaml
