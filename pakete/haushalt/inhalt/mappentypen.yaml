# Ab 5.0.0 (#226): „Gesundheit“ ist in das Paket Gesundheit gezogen – ohne Umzug.
# Ab 4.0.0 (#225): „Ausweis & Urkunde“ ist in das Paket „Ämter & Papiere“ gezogen (Ausweis, Urkunde) – ohne Umzug.
# Mappentypen des Pakets Haushalt. Schema: schema/inhalt.schema.json
# Ablago legt sie als haushalt:<schluessel> an; angezeigt wird der Name.
# Ab 3.0.0 (dms-registry #212): Konto und Steuerjahr kommen aus dem Paket Finanzen (finanzen:konto, finanzen:steuerjahr);
# Bausparen ist dort eine Kontoart und keine Art der Vorsorge mehr.
# Ab 2.0.0 (dms-registry #163): Vertrag und Versicherung kommen aus dem Paket Verträge (Versicherung ist dort eine
# Vertragsart), Rechnungen und Kassenbons aus dem Paket Rechnungen. Den Umzug bestehender Mappen macht Verträge.
#
# Gemeinsame Felder (gleicher Schlüssel in allen Typen, damit Ansichten über mehrere Typen gehen):
#   art                Auswahl je Typ
#   person_verweis     wer im Haushalt – Verweis auf eine Person aus Basis (bis 1.0.x Textfeld person; aus_text,
#                      ein Update legt den Verweis dazu, umgewandelt wird mit Vorschau in der Werkbank, DMS #534)
#   verbleib_original  „Verbleib Originaldokumente“, Verweis auf den Ablageort des DMS
#   steuerjahr         Verweis auf das Steuerjahr aus Finanzen; das Steuerjahr zeigt diese Mappen unter „Belege“

- schluessel: arbeitsverhaeltnis
  name: Arbeitsverhältnis
  mehrzahl: Arbeitsverhältnisse
  beschreibung: Anstellung, Minijob oder Ausbildung – mit Arbeitsvertrag, Gehaltsabrechnungen und Zeugnis.
  beschriftungen: { en: { erkennbarAn: "Employment contract, payslip, reference or notice: employer, personnel number, gross/net, start date, “Entgeltabrechnung”.", name: "Employment", mehrzahl: "Jobs", beschreibung: "Job, mini-job or apprenticeship – with employment contract, payslips and reference." } }
  titelVorlage: "{person_verweis} – {arbeitgeber|kurz:25} – {beginn|jahr}"
  erkennbarAn: "Arbeitsvertrag, Gehaltsabrechnung, Zeugnis oder Kündigung: Arbeitgeber, Personalnummer, Brutto/Netto, Eintrittsdatum, „Entgeltabrechnung“."
  felder:
    - { key: arbeitgeber, label: Arbeitgeber, typ: referenz, ziel: "basis:organisation", verweisart: bezug, beschriftungen: { en: { label: "Employer" } }  }
    - { key: person_verweis, label: Person, typ: referenz, ziel: "basis:person", verweisart: bezug, aus_text: person, beschriftungen: { en: { label: "Person" } }  }
    - { key: taetigkeit, label: Tätigkeit, typ: text, erkennung: {}, maxLen: 120, beschriftungen: { en: { label: "Job title" } }  }
    - { key: beginn, label: Beginn, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "Start" } }  }
    - { key: ende, label: Ende, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "End" } }  }
    - { key: steuerjahr, label: Steuerjahre, typ: referenz, ziel: "finanzen:steuerjahr", mehrfach: true, verweisart: bezug, hilfe: In welchen Steuerjahren es zählt; dort erscheint es unter „Belege“, beschriftungen: { en: { label: "Tax years", hilfe: "Which tax years it counts for; it appears there under “Receipts”" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo der Arbeitsvertrag auf Papier liegt, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where the paper employment contract is kept" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [arbeitgeber, person_verweis, taetigkeit, beginn, ende, steuerjahr, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: protokoll, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [person_verweis, arbeitgeber, taetigkeit, beginn, ende]

- schluessel: arbeitsmedizin
  name: Arbeitsmedizinische Vorsorge
  mehrzahl: Arbeitsmedizinische Vorsorgen
  beschreibung: Vorsorgebescheinigung nach der ArbMedVV – Datum, Anlass, Art und nächster Termin. Eine Mappe je Anlass; Befunde gehören ins Paket Gesundheit.
  beschriftungen: { en: { erkennbarAn: "Occupational health certificate under ArbMedVV: “arbeitsmedizinische Vorsorge”, occasion (e.g. screen work), date, next appointment, company doctor.", name: "Occupational health check", mehrzahl: "Occupational health checks", beschreibung: "Certificate of an occupational health check (German ArbMedVV) – date, reason, type and next appointment. One folder per reason; findings belong in the Health package." } }
  titelVorlage: "{anlass} – {person_verweis} – {datum}"
  erkennbarAn: "Vorsorgebescheinigung nach ArbMedVV: „arbeitsmedizinische Vorsorge“, Anlass (z. B. Bildschirmarbeit, G 37), Datum, nächster Termin, Betriebsarzt."
  felder:
    - { key: person_verweis, label: Person, typ: referenz, ziel: "basis:person", verweisart: bezug, aus_text: person, beschriftungen: { en: { label: "Person" } } }
    - { key: arbeitsverhaeltnis, label: Arbeitsverhältnis, typ: referenz, ziel: arbeitsverhaeltnis, verweisart: bezug, hilfe: Die Vorsorge erscheint dort unter „Verknüpfungen“, beschriftungen: { en: { label: "Employment", hilfe: "The check then shows up there under “Links”" } } }
    - { key: datum, label: Datum der Vorsorge, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "Date of the check" } } }
    - { key: arzt, label: Ärztin/Arzt, typ: referenz, ziel: ["basis:organisation", "basis:person"], verweisart: bezug, hilfe: Betriebsarzt oder arbeitsmedizinischer Dienst, beschriftungen: { en: { label: "Doctor", hilfe: "Company doctor or occupational health service" } } }
    - key: anlass
      label: Anlass
      beschriftungen: { en: { label: "Reason", optionen: { "Bildschirmarbeit": "Screen work", "Lärm": "Noise", "Atemschutz": "Respiratory protection", "Feuchtarbeit": "Wet work", "Biostoffe": "Biological agents", "Gefahrstoffe": "Hazardous substances", "Hitze": "Heat", "Sonstiges": "Other" } } }
      typ: auswahl
      pflicht: true
      optionen: [Bildschirmarbeit, Lärm, Atemschutz, Feuchtarbeit, Biostoffe, Gefahrstoffe, Hitze, Sonstiges]
    - { key: anlass_text, label: Anlass genauer, typ: text, maxLen: 120, hilfe: "Wie auf der Bescheinigung, z. B. „Tätigkeiten mit Atemschutzgeräten, Gruppe 2“", beschriftungen: { en: { label: "Reason in detail", hilfe: "As on the certificate" } } }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Pflichtvorsorge": "Mandatory", "Angebotsvorsorge": "Offered", "Wunschvorsorge": "On request" } } }
      typ: auswahl
      optionen: [Pflichtvorsorge, Angebotsvorsorge, Wunschvorsorge]
    - key: naechste_vorsorge
      label: Nächste Vorsorge
      beschriftungen: { en: { label: "Next check", hilfe: "Leave empty if no further check is needed. The included automation reminds you 6 weeks before." } }
      typ: datum
      hilfe: Leer lassen, wenn keine weitere Vorsorge nötig ist. Die mitgelieferte Automatisierung erinnert 6 Wochen vorher.
      frist: { vorlauf: 6, einheit: wochen }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [person_verweis, arbeitsverhaeltnis, datum, arzt, anlass, anlass_text, art, naechste_vorsorge], beschriftungen: { en: { name: "General" } } }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } } }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } } }
    - { key: protokoll, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [person_verweis, anlass, datum, naechste_vorsorge]

- schluessel: vorsorge
  name: Vorsorge
  mehrzahl: Vorsorgeverträge
  beschreibung: Gesetzliche, betriebliche und private Altersvorsorge, Riester und Rürup. Bausparverträge sind Konten (Paket Finanzen).
  beschriftungen: { en: { erkennbarAn: "Pension information, annual statement, contract for Riester, Rürup, company or private pension: policy number, guaranteed value, contributions.", name: "Pension", mehrzahl: "Pension plans", beschreibung: "State, company and private pensions, Riester and Rürup. Building savings contracts are accounts (Finances package)." } }
  titelVorlage: "{art} – {person_verweis} – {anbieter|kurz:25}"
  erkennbarAn: "Renteninformation, Standmitteilung, Vertrag zu Riester, Rürup, Betriebsrente oder privater Rentenversicherung: Vertragsnummer, Garantiewert, Beiträge."
  felder:
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "gesetzliche Rente": "state pension", "betriebliche Altersvorsorge": "company pension", "Riester": "Riester", "Rürup": "Rürup", "private Rente": "private pension", "Sonstige": "Other" } } }
      typ: auswahl
      pflicht: true
      optionen: [gesetzliche Rente, betriebliche Altersvorsorge, Riester, Rürup, private Rente, Sonstige]
    - { key: anbieter, label: Anbieter, typ: referenz, ziel: "basis:organisation", verweisart: bezug, beschriftungen: { en: { label: "Provider" } }  }
    - { key: vertragsnummer, label: Vertragsnummer, typ: text, maxLen: 60, hilfe: Bei der gesetzlichen Rente die Versicherungsnummer, erkennung: { art: nummer }, beschriftungen: { en: { label: "Contract number", hilfe: "For the state pension, the insurance number" } }  }
    - { key: person_verweis, label: Person, typ: referenz, ziel: "basis:person", verweisart: bezug, aus_text: person, beschriftungen: { en: { label: "Person" } }  }
    - { key: beginn, label: Beginn, typ: datum, beschriftungen: { en: { label: "Start" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, beschriftungen: { en: { label: "Where the originals are" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [art, anbieter, vertragsnummer, person_verweis, beginn, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: protokoll, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [art, person_verweis, anbieter, vertragsnummer]

- schluessel: anschaffung
  name: Anschaffung
  mehrzahl: Anschaffungen
  beschreibung: Gekaufte Geräte und Möbel – mit Kassenbon, Garantie und Seriennummer.
  beschriftungen: { en: { erkennbarAn: "Receipt, proof of purchase, warranty or delivery note for a device or furniture: item, serial number, purchase date, warranty until, retailer.", name: "Purchase", mehrzahl: "Purchases", beschreibung: "Appliances and furniture you bought – with receipt, warranty and serial number." } }
  titelVorlage: "{gegenstand} – {kaufdatum|datum:MM/JJJJ}"
  erkennbarAn: "Kassenbon, Kaufbeleg, Garantie- oder Lieferschein eines Geräts oder Möbels: Artikel, Seriennummer, Kaufdatum, Garantie bis, Händler."
  felder:
    - { key: gegenstand, label: Gegenstand, typ: text, pflicht: true, maxLen: 120, beschriftungen: { en: { label: "Item" } }  }
    - { key: haendler, label: Händler, typ: referenz, ziel: "basis:organisation", verweisart: bezug, beschriftungen: { en: { label: "Retailer" } }  }
    - { key: kaufdatum, label: Kaufdatum, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "Purchase date" } }  }
    - { key: preis, label: Preis, typ: betrag, min: 0, waehrung: EUR, beschriftungen: { en: { label: "Price" } }  }
    - { key: seriennummer, label: Seriennummer, typ: text, maxLen: 80, beschriftungen: { en: { label: "Serial number" } }  }
    - key: garantie_bis
      label: Garantie bis
      beschriftungen: { en: { label: "Warranty until", hilfe: "Statutory or manufacturer’s warranty. The included automation reminds you 30 days before." } }
      typ: datum
      hilfe: Gewährleistung oder Herstellergarantie. Die mitgelieferte Automatisierung erinnert 30 Tage vorher.
      frist: { vorlauf: 30, einheit: tage }
    - { key: steuerjahr, label: Steuerjahr, typ: referenz, ziel: "finanzen:steuerjahr", ausDatum: { datumFeld: kaufdatum, zielFeld: jahr }, verweisart: bezug, hilfe: "Wenn du die Anschaffung absetzt, z. B. Arbeitsmittel", beschriftungen: { en: { label: "Tax year", hilfe: "If you deduct the purchase, e.g. work equipment" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo der Kassenbon liegt – ohne ihn keine Garantie, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where the receipt is – no warranty without it" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [gegenstand, haendler, kaufdatum, preis, seriennummer, garantie_bis, steuerjahr, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    # Ab 2.0.0: Kassenbon und Rechnung sind Rechnungen (Paket Rechnungen) mit „Betrifft“ = diese Anschaffung.
    - key: rechnungen
      name: Rechnungen
      beschriftungen: { en: { name: "Invoices" } }
      art: verknuepfungen
      quellen: [{ typ: "rechnung_bestellung:rechnung", feld: betrifft }]
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: protokoll, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [gegenstand, haendler, kaufdatum, preis, garantie_bis]

- schluessel: bildung
  name: Bildung
  mehrzahl: Bildungswege
  beschreibung: Schule, Ausbildung, Studium und Kurse – mit Zeugnissen und Bescheinigungen.
  beschriftungen: { en: { erkennbarAn: "Report, diploma, certificate of attendance or enrolment: school, university, course, grades, “Zeugnis”, period from–to.", name: "Education", mehrzahl: "Education records", beschreibung: "School, apprenticeship, university and courses – with certificates and confirmations." } }
  titelVorlage: "{art} – {person_verweis} – {einrichtung}"
  erkennbarAn: "Zeugnis, Abschluss, Teilnahme- oder Immatrikulationsbescheinigung: Schule, Hochschule, Kurs, Noten, „Zeugnis“, Zeitraum von–bis."
  felder:
    - { key: person_verweis, label: Person, typ: referenz, ziel: "basis:person", verweisart: bezug, aus_text: person, beschriftungen: { en: { label: "Person" } }  }
    - key: art
      label: Art
      beschriftungen: { en: { label: "Type", optionen: { "Schule": "School", "Ausbildung": "Apprenticeship", "Studium": "University", "Kurs": "Course", "Sonstige": "Other" } } }
      typ: auswahl
      pflicht: true
      optionen: [Schule, Ausbildung, Studium, Kurs, Sonstige]
    - { key: einrichtung, label: Einrichtung, typ: referenz, ziel: "basis:organisation", verweisart: bezug, beschriftungen: { en: { label: "Institution" } }  }
    - { key: von, label: Von, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "From" } }  }
    - { key: bis, label: Bis, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "Until" } }  }
    - { key: abschluss, label: Abschluss, typ: text, maxLen: 120, hilfe: "z. B. „Abitur“ oder „Bachelor of Arts“", beschriftungen: { en: { label: "Qualification", hilfe: "e.g. “Abitur” or “Bachelor of Arts”" } }  }
    - { key: steuerjahr, label: Steuerjahr, typ: referenz, ziel: "finanzen:steuerjahr", ausDatum: { datumFeld: bis, zielFeld: jahr }, verweisart: bezug, hilfe: Wenn du Kosten absetzt, z. B. Fortbildung, beschriftungen: { en: { label: "Tax year", hilfe: "If you deduct costs" } }  }
    - { key: verbleib_original, label: Verbleib Originaldokumente, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, hilfe: Wo Zeugnisse und Urkunden auf Papier liegen, beschriftungen: { en: { label: "Where the originals are", hilfe: "Where paper certificates are kept" } }  }
  register:
    - { key: allgemein, name: Allgemein, art: felder, felder: [person_verweis, art, einrichtung, von, bis, abschluss, steuerjahr, verbleib_original], beschriftungen: { en: { name: "General" } }  }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } }  }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } }  }
    - { key: protokoll, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } }  }
  trefferliste: [person_verweis, art, einrichtung, abschluss]
