  name: Einspruchsfrist beim Steuerbescheid
  beschreibung: 7 Tage vor dem Ende der Einspruchsfrist.
  wenn: { art: datum, typ: steuerjahr, feld: einspruch_bis, vorlauf: 7, einheit: tage, uhrzeit: "07:00" }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Einspruch bis {datum}: {titel}" }
- schluessel: ausweis_gueltig
  name: Ausweis läuft bald ab
  beschreibung: 90 Tage vor dem Ablauf – Zeit genug für einen Termin beim Bürgeramt.
  wenn: { art: datum, typ: ausweis, feld: gueltig_bis, vorlauf: 90, einheit: tage, uhrzeit: "07:00" }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Gültig bis {datum}: {titel}" }
- schluessel: garantie_endet
  name: Garantie endet bald
  beschreibung: 30 Tage vor dem Ende von Gewährleistung oder Garantie.
  wenn: { art: datum, typ: anschaffung, feld: garantie_bis, vorlauf: 30, einheit: tage, uhrzeit: "07:00" }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Garantie bis {datum}: {titel}" }
