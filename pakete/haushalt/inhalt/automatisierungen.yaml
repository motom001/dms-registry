# Mitgelieferte Automatisierungen (Ablago #712, dms-registry #108/#113). Nach der Installation aus –
# beim Installieren fragt Ablago, welche gleich eingeschaltet werden. Vorlaufzeit, Empfänger und Text stellt man selbst ein.
# Ab 3.0.0 erinnert das Paket Finanzen an die Einspruchsfrist beim Steuerbescheid.
# Ab 2.0.0 erinnert das Paket Verträge an „Kündigen bis“; die Hauptfälligkeit einer Versicherung bleibt hier.
- schluessel: versicherung_hauptfaelligkeit
  name: Hauptfälligkeit einer Versicherung
  beschreibung: Jedes Jahr 6 Wochen vor der Hauptfälligkeit – Zeit, den Beitrag und die Leistungen zu prüfen.
  wenn: { art: datum, typ: "vertraege:vertrag", feld: hauptfaelligkeit, vorlauf: 6, einheit: wochen, uhrzeit: "07:00", wiederholung: 12 }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Hauptfälligkeit am {datum}: {titel}" }
- schluessel: ausweis_gueltig
  name: Ausweis läuft bald ab
  beschreibung: 90 Tage vor dem Ablauf – Zeit genug für einen Termin beim Bürgeramt.
  wenn: { art: datum, typ: ausweis, feld: gueltig_bis, vorlauf: 90, einheit: tage, uhrzeit: "07:00" }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Gültig bis {datum}: {titel}" }
- schluessel: garantie_endet
  name: Garantie endet bald
  beschreibung: 30 Tage vor dem Ende von Gewährleistung oder Garantie.
  wenn: { art: datum, typ: anschaffung, feld: garantie_bis, vorlauf: 30, einheit: tage, uhrzeit: "07:00" }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Garantie bis {datum}: {titel}" }
- schluessel: arbeitsmedizin_naechste
  name: Nächste arbeitsmedizinische Vorsorge
  beschreibung: 6 Wochen vor der nächsten Vorsorge – Zeit, einen Termin beim Betriebsarzt zu machen.
  wenn: { art: datum, typ: arbeitsmedizin, feld: naechste_vorsorge, vorlauf: 6, einheit: wochen, uhrzeit: "07:00" }
  dann:
    - { art: aufgabe, als: aufgabe, empfaenger: [{ art: ersteller }], text: "Nächste Vorsorge am {datum}: {titel}" }
