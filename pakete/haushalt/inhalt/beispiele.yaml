# Beispiel-Mappen der erfundenen Familie Muster (Lena, Tom und Sohn Jonas).
# Die Beispiele zeigen aufeinander und auf Beispiele aus Basis ({ beispiel: … }, ab DMS 0.79.0).
# Ablageorte setzt du selbst – sie gehören dem DMS, nicht einem Paket.
# Die drei sind Personen aus Basis (ab Basis 1.1.0); Konto, Ausweis & Co. verweisen auf sie.
# Beispiel-Verträge und -Versicherungen bringt ab 2.0.0 das Paket Verträge mit.
- typ: "basis:person"
  schluessel: lena
  werte: { anrede: Frau, vorname: Lena, nachname: Muster, beziehung: [Familie], geburtstag: "1988-03-14" }
- typ: "basis:person"
  schluessel: tom
  werte: { anrede: Herr, vorname: Tom, nachname: Muster, beziehung: [Familie], geburtstag: "1986-09-02" }
- typ: "basis:person"
  schluessel: jonas
  werte: { anrede: Herr, vorname: Jonas, nachname: Muster, beziehung: [Familie], geburtstag: "2010-05-28" }
- typ: konto
  werte: { bank: { beispiel: "basis:sparkasse" }, art: Girokonto, inhaber_verweis: [{ beispiel: lena }, { beispiel: tom }], iban: DE02 1203 0000 0000 2020 51, eroeffnet_am: "2015-04-01" }
- typ: konto
  werte: { art: Depot, inhaber_verweis: [{ beispiel: lena }], eroeffnet_am: "2021-09-15" }
- typ: steuerjahr
  schluessel: steuer2025
  werte: { jahr: "2025", abgegeben_am: "2026-05-20", bescheid_vom: "2026-08-12", ergebnis: 843.17, einspruch_bis: "2026-09-12" }
- typ: arbeitsverhaeltnis
  werte: { steuerjahr: [{ beispiel: steuer2025 }], person_verweis: { beispiel: tom }, taetigkeit: Elektroniker, beginn: "2018-08-01" }
- typ: vorsorge
  werte: { art: gesetzliche Rente, person_verweis: { beispiel: lena }, vertragsnummer: "12 150378 M 007" }
- typ: ausweis
  werte: { art: Personalausweis, person_verweis: { beispiel: jonas }, nummer: L01X00T47, ausgestellt_am: "2026-06-02", gueltig_bis: "2032-06-01" }
- typ: ausweis
  werte: { art: Geburtsurkunde, person_verweis: { beispiel: jonas }, ausgestellt_am: "2010-06-03" }
- typ: gesundheit
  werte: { praxis: { beispiel: "basis:praxis" }, person_verweis: { beispiel: jonas }, art: Impfung, datum: "2026-02-10" }
- typ: anschaffung
  werte: { gegenstand: Waschmaschine, kaufdatum: "2025-01-18", preis: 549, seriennummer: WM-4711-0815, garantie_bis: "2027-01-18" }
- typ: bildung
  werte: { person_verweis: { beispiel: jonas }, art: Schule, von: "2016-08-01", bis: "2020-07-31", abschluss: Grundschule }
