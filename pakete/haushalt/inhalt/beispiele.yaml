# Beispiel-Mappen der erfundenen Familie Muster (Lena, Tom und Sohn Jonas).
# Die Beispiele zeigen aufeinander und auf Beispiele aus Basis ({ beispiel: … }, ab DMS 0.79.0).
# Ablageorte setzt du selbst – sie gehören dem DMS, nicht einem Paket.
# Die drei sind Personen aus den Beispielen von Basis (ab Basis 1.10.0, vorher hier); Konto, Arbeitsverhältnis & Co. verweisen auf sie.
# Ab 4.0.0: Ausweise und Urkunden bringt das Paket „Ämter & Papiere“ mit, den Steuerbescheid ebenso (als Bescheid).
# Ab 3.0.0 sind Konto, Kontoauszug, Freistellungsauftrag und Steuerjahr Mappentypen aus dem Paket Finanzen.
# Beispiel-Verträge und -Versicherungen bringt ab 2.0.0 das Paket Verträge mit.
- typ: "finanzen:konto"
  werte: { bank: { beispiel: "basis:sparkasse" }, art: Girokonto, inhaber_verweis: [{ beispiel: "basis:lena" }, { beispiel: "basis:tom" }], iban: DE89 3704 0044 0532 0130 00, eroeffnet_am: "2015-04-01" }
- typ: "finanzen:konto"
  schluessel: depot
  werte: { bank: { beispiel: "basis:sparkasse" }, art: Depot, inhaber_verweis: [{ beispiel: "basis:lena" }], eroeffnet_am: "2021-09-15" }
- typ: "finanzen:kontoauszug"
  werte: { konto: { beispiel: depot }, nummer: "1/2026", zeitraum: Quartal, beginn: "2026-01-01", ende: "2026-03-31" }
- typ: "finanzen:freistellungsauftrag"
  werte: { bank: { beispiel: "basis:sparkasse" }, betrag: 2000, jahr: "2026", person_verweis: [{ beispiel: "basis:lena" }, { beispiel: "basis:tom" }] }
- typ: "finanzen:steuerjahr"
  schluessel: steuer2025
  werte: { jahr: "2025", abgegeben_am: "2026-05-20" }
- typ: arbeitsverhaeltnis
  schluessel: tom_arbeit
  werte: { steuerjahr: [{ beispiel: steuer2025 }], person_verweis: { beispiel: "basis:tom" }, taetigkeit: Elektroniker, beginn: "2018-08-01" }
- typ: arbeitsmedizin
  werte: { person_verweis: { beispiel: "basis:tom" }, arbeitsverhaeltnis: { beispiel: tom_arbeit }, datum: "2025-11-12", anlass: Lärm, art: Pflichtvorsorge, naechste_vorsorge: "2028-11-12" }
- typ: vorsorge
  werte: { art: gesetzliche Rente, person_verweis: { beispiel: "basis:lena" }, vertragsnummer: "12 150378 M 007" }  # Beispielnummer mit ungültiger Prüfziffer
- typ: gesundheit
  werte: { praxis: { beispiel: "basis:praxis" }, person_verweis: { beispiel: "basis:jonas" }, art: Impfung, datum: "2026-02-10" }
- typ: anschaffung
  werte: { gegenstand: Waschmaschine, kaufdatum: "2025-01-18", preis: 549, seriennummer: WM-4711-0815, garantie_bis: "2027-01-18" }
- typ: bildung
  werte: { person_verweis: { beispiel: "basis:jonas" }, art: Schule, von: "2016-08-01", bis: "2020-07-31", abschluss: Grundschule }
