# Ansichten des Pakets Haushalt. Schema: schema/inhalt.schema.json
# Ordner „Haushalt“ mit je einer Ansicht pro Mappentyp, dazu Ansichten für anstehende Fristen.
# Ab 2.0.0: Verträge und Versicherungen sind Verträge aus dem Paket Verträge (vertraege:vertrag).

- schluessel: haushalt
  name: Haushalt
  beschreibung: Alle Unterlagen des Haushalts
  beschriftungen: { en: { name: "Household", beschreibung: "All household documents" } }
  typen: [konto, "vertraege:vertrag", steuerjahr, arbeitsverhaeltnis, vorsorge, ausweis, gesundheit, anschaffung, bildung]

- { schluessel: konten, name: Konten, eltern: haushalt, typen: [konto], beschriftungen: { en: { name: "Accounts" } }  }
- { schluessel: vertraege, name: Verträge, eltern: haushalt, typen: ["vertraege:vertrag"], beschriftungen: { en: { name: "Contracts" } }  }
- schluessel: versicherungen
  name: Versicherungen
  beschriftungen: { en: { name: "Insurance policies" } }
  eltern: haushalt
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: versicherung_art, operator: nichtLeer }
- { schluessel: steuerjahre, name: Steuerjahre, eltern: haushalt, typen: [steuerjahr], beschriftungen: { en: { name: "Tax years" } }  }
- { schluessel: arbeit, name: Arbeitsverhältnisse, eltern: haushalt, typen: [arbeitsverhaeltnis], beschriftungen: { en: { name: "Employments" } }  }
- { schluessel: vorsorge, name: Vorsorge, eltern: haushalt, typen: [vorsorge], beschriftungen: { en: { name: "Pension" } }  }
- { schluessel: ausweise, name: Ausweise & Urkunden, eltern: haushalt, typen: [ausweis], beschriftungen: { en: { name: "IDs & certificates" } }  }
- { schluessel: gesundheit, name: Gesundheit, eltern: haushalt, typen: [gesundheit], beschriftungen: { en: { name: "Health" } }  }
- { schluessel: anschaffungen, name: Anschaffungen, eltern: haushalt, typen: [anschaffung], beschriftungen: { en: { name: "Purchases" } }  }
- { schluessel: bildung, name: Bildung, eltern: haushalt, typen: [bildung], beschriftungen: { en: { name: "Education" } }  }

# Versicherungen nach Art: Sach- und Personenversicherungen.
- schluessel: sachversicherungen
  name: Sachversicherungen
  beschriftungen: { en: { name: "Property insurance" } }
  eltern: versicherungen
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: versicherung_art, operator: einerVon, wert: [Haftpflicht, Hausrat, Wohngebäude, Kfz, Rechtsschutz] }
- schluessel: personenversicherungen
  name: Personenversicherungen
  beschriftungen: { en: { name: "Personal insurance" } }
  eltern: versicherungen
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: versicherung_art, operator: einerVon, wert: [Berufsunfähigkeit, Leben, Kranken-Zusatz, Reise, Unfall] }

# Fristen
- schluessel: kuendigung_bald
  name: Kündigung in den nächsten 3 Monaten
  beschreibung: Verträge und Versicherungen, die du bald kündigen müsstest, wenn du wechseln willst
  beschriftungen: { en: { name: "Cancellation in the next 3 months", beschreibung: "Contracts and policies you would soon have to cancel if you want to switch" } }
  eltern: haushalt
  typen: ["vertraege:vertrag"]
  bedingungen:
    - { feld: kuendigen_bis, operator: zwischen, wert: [{ art: heute }, { art: heute, versatz: 3, einheit: monate }] }
- schluessel: laeuft_ab
  name: Läuft bald ab
  beschreibung: Ausweise, die in den nächsten 6 Monaten ablaufen oder schon abgelaufen sind
  beschriftungen: { en: { name: "Expiring soon", beschreibung: "IDs that expire in the next 6 months or have already expired" } }
  eltern: haushalt
  typen: [ausweis]
  bedingungen:
    - { feld: gueltig_bis, operator: kleiner, wert: { art: heute, versatz: 6, einheit: monate } }
- schluessel: garantie_bald
  name: Garantie läuft ab
  beschreibung: Anschaffungen, deren Garantie in den nächsten 3 Monaten endet
  beschriftungen: { en: { name: "Warranty expiring", beschreibung: "Purchases whose warranty ends in the next 3 months" } }
  eltern: haushalt
  typen: [anschaffung]
  bedingungen:
    - { feld: garantie_bis, operator: zwischen, wert: [{ art: heute }, { art: heute, versatz: 3, einheit: monate }] }
