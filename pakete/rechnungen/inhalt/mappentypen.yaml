# Mappentypen des Pakets Rechnungen (dms-registry #161). Schema: schema/inhalt.schema.json
# Kennungen nach REGELN.md, „Gleiche Kennungen“: von, an, betrag, datum, betrifft, steuerjahr, zahlweise, notiz …
# „betrifft“ zeigt auch auf Typen von Paketen, die selbst von Rechnungen abhängen (zielOptional, DMS #1036).

- schluessel: rechnung
  name: Rechnung
  beschreibung: Rechnung, Quittung, Kassenbon, Gutschrift oder Erstattung – eingehend oder ausgehend. Eine Gutschrift trägst du mit Minus ein.
  beschriftungen: { en: { name: "Invoice", beschreibung: "Invoice, receipt, till receipt, credit note or refund – incoming or outgoing. Enter a credit note with a minus sign." } }
  titelVorlage: "{von} – {datum}"
  felder:
    # Oben
    - key: von
      label: Rechnungssteller
      beschriftungen: { en: { label: "Issued by" } }
      typ: referenz
      ziel: ["basis:organisation", "basis:person"]
      verweisart: bezug
      erkennung: { art: verweis }
    - key: betrag
      label: Betrag
      beschriftungen: { en: { label: "Amount", hilfe: "Gross. A credit note or refund? Enter it with a minus sign." } }
      typ: betrag
      negativ: true
      hilfe: Brutto. Gutschrift oder Erstattung? Mit Minus eintragen.
      erkennung: { art: betrag }
    - { key: datum, label: Rechnungsdatum, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "Invoice date" } } }
    - { key: faellig_am, label: Fällig am, typ: datum, beschriftungen: { en: { label: "Due on" } } }
    - { key: bezahlt_am, label: Bezahlt am, typ: datum, beschriftungen: { en: { label: "Paid on" } } }
    - key: status
      label: Status
      beschriftungen: { en: { label: "Status" } }
      typ: text
      maxLen: 120
      berechnet: true
      hilfe: z. B. „offen – fällig am 15.11.2026“, „bezahlt am 12.11.2026“, „Gutschrift – noch nicht erhalten“
    # Wozu
    - key: betrifft
      label: Betrifft
      beschriftungen: { en: { label: "Concerns", hilfe: "What the invoice is for – a vehicle, flat, purchase or contract" } }
      typ: referenz
      ziel: "vertraege:vertrag"
      zielOptional: ["fahrzeuge:fahrzeug", "haus:immobilie", "vermietung:mietobjekt", "vermietung:wohnung", "haushalt:anschaffung"]
      mehrfach: true
      gleicherTyp: true
      verweisart: bezug
      hilfe: Wofür die Rechnung ist – Fahrzeug, Wohnung, Anschaffung oder Vertrag
    - { key: vertrag, label: Gehört zu Vertrag, typ: referenz, ziel: "vertraege:vertrag", verweisart: zugehoerigkeit, beschriftungen: { en: { label: "Belongs to contract" } } }
    - { key: steuerjahr, label: Steuerjahr, typ: referenz, zielOptional: ["haushalt:steuerjahr"], verweisart: bezug, hilfe: Wenn du die Kosten absetzen willst, beschriftungen: { en: { label: "Tax year", hilfe: "If you want to deduct the costs" } } }
    # Einzelheiten (eingeklappt)
    - { key: rechnungsnummer, label: Rechnungsnummer, typ: text, maxLen: 60, wiederfinden: true, erkennung: { art: nummer }, beschriftungen: { en: { label: "Invoice number" } } }
    - { key: kundennummer, label: Kunden- oder Vertragsnummer, typ: text, maxLen: 60, erkennung: { art: nummer }, beschriftungen: { en: { label: "Customer or contract number" } } }
    - key: zahlweise
      label: Bezahlt per
      beschriftungen: { en: { label: "Paid by", optionen: { "Überweisung": "bank transfer", "Lastschrift": "direct debit", "Karte": "card", "bar": "cash", "PayPal und Co.": "PayPal etc.", "Rechnung": "on account" } } }
      typ: auswahl
      optionen: [Überweisung, Lastschrift, Karte, bar, PayPal und Co., Rechnung]
    - { key: bezahlt_von, label: Bezahlt von, typ: referenz, ziel: "basis:person", verweisart: bezug, beschriftungen: { en: { label: "Paid by (person)" } } }
    - key: an
      label: Rechnungsempfänger
      beschriftungen: { en: { label: "Billed to", hilfe: "Empty means us (the household); in a business the own organisation" } }
      typ: referenz
      ziel: ["basis:organisation", "basis:person"]
      verweisart: bezug
      hilfe: Leer heißt wir (der Haushalt); im Betrieb die eigene Organisation
    # Beträge im Einzelnen – nur beruflich
    - { key: netto, label: Netto, typ: betrag, negativ: true, beschriftungen: { en: { label: "Net" } } }
    - { key: ust_satz, label: Umsatzsteuersatz, typ: prozent, nachkomma: 1, hilfe: z. B. 19 oder 7 – auch ausländische Sätze, beschriftungen: { en: { label: "VAT rate", hilfe: "e.g. 19 or 7 – foreign rates too" } } }
    - { key: ust, label: Umsatzsteuer, typ: betrag, negativ: true, beschriftungen: { en: { label: "VAT" } } }
    - { key: skonto, label: Skonto, typ: betrag, beschriftungen: { en: { label: "Cash discount" } } }
    - { key: skonto_bis, label: Skonto bis, typ: datum, beschriftungen: { en: { label: "Cash discount until" } } }
    # Ausgangsrechnung – nur, wenn wir der Rechnungssteller sind
    - { key: zahlungseingang_am, label: Zahlungseingang am, typ: datum, beschriftungen: { en: { label: "Payment received on" } } }
    - key: mahnstufe
      label: Mahnstufe
      beschriftungen: { en: { label: "Dunning level", optionen: { "keine": "none", "Erinnerung": "reminder", "1. Mahnung": "1st reminder", "2. Mahnung": "2nd reminder", "Inkasso": "collection" } } }
      typ: auswahl
      optionen: [keine, Erinnerung, 1. Mahnung, 2. Mahnung, Inkasso]
    - { key: interne_nummer, label: Interne Nummer, typ: text, maxLen: 40, beschriftungen: { en: { label: "Internal number" } } }
    # Fahrzeug – wenn „betrifft“ ein Fahrzeug ist
    - { key: kilometerstand, label: Kilometerstand, typ: zahl, beschriftungen: { en: { label: "Mileage" } } }
    - { key: arbeiten, label: Arbeiten, typ: langtext, hilfe: z. B. Inspektion, Bremsen vorne, beschriftungen: { en: { label: "Work done", hilfe: "e.g. service, front brakes" } } }
    # Vermietung – wenn „betrifft“ ein Mietobjekt oder eine Wohnung ist
    - { key: umlagefaehig, label: Umlagefähig, typ: janein, hilfe: Gehört in die Nebenkostenabrechnung, beschriftungen: { en: { label: "Recoverable", hilfe: "Belongs in the service charge statement" } } }
    - key: kostenart
      label: Kostenart
      beschriftungen: { en: { label: "Cost type", optionen: { "Grundsteuer": "Property tax", "Wasser und Abwasser": "Water and sewage", "Heizung und Warmwasser": "Heating and hot water", "Müll": "Waste", "Straßenreinigung": "Street cleaning", "Hausreinigung": "Cleaning", "Garten": "Garden", "Hausmeister": "Caretaker", "Versicherung": "Insurance", "Strom Allgemein": "Common electricity", "Reparatur": "Repair", "Sonstiges": "Other" } } }
      typ: auswahl
      optionen: [Grundsteuer, Wasser und Abwasser, Heizung und Warmwasser, Müll, Straßenreinigung, Hausreinigung, Garten, Hausmeister, Versicherung, Strom Allgemein, Reparatur, Sonstiges]
    - key: positionen
      label: Positionen
      beschriftungen: { en: { label: "Items" } }
      typ: tabelle
      quelle: { typ: rechnungsposition, feld: rechnung, trefferliste: standard, neu: "+ Position" }
    - { key: verbleib_original, label: Verbleib Original, typ: referenz, ziel: "basis:ablageort", verweisart: bezug, beschriftungen: { en: { label: "Where the original is" } } }
    - { key: notiz, label: Bemerkungen, typ: langtext, beschriftungen: { en: { label: "Remarks" } } }
  register:
    - key: rechnung
      name: Rechnung
      beschriftungen: { en: { name: "Invoice" } }
      art: felder
      felder: [von, betrag, datum, faellig_am, bezahlt_am, status,
               betrifft, vertrag, steuerjahr,
               rechnungsnummer, kundennummer, zahlweise, bezahlt_von, an,
               netto, ust_satz, ust, skonto, skonto_bis,
               zahlungseingang_am, mahnstufe, interne_nummer,
               kilometerstand, arbeiten,
               umlagefaehig, kostenart,
               positionen, verbleib_original, notiz]
      abschnitte:
        - { vor: betrifft, titel: Wozu, beschriftungen: { en: { titel: "What for" } } }
        - { vor: rechnungsnummer, titel: Einzelheiten, eingeklappt: true, beschriftungen: { en: { titel: "Details" } } }
        - { vor: netto, titel: Beträge im Einzelnen, eingeklappt: true, beschriftungen: { en: { titel: "Amounts in detail" } }, anzeigen: { bedingungen: [{ art: merkmal, merkmal: beruflich }] } }
        - { vor: zahlungseingang_am, titel: Ausgangsrechnung, beschriftungen: { en: { titel: "Outgoing invoice" } }, anzeigen: { bedingungen: [{ art: eigeneOrganisation, feld: von }] } }
        - { vor: kilometerstand, titel: Fahrzeug, beschriftungen: { en: { titel: "Vehicle" } }, anzeigen: { bedingungen: [{ art: verweistyp, feld: betrifft, typ: fahrzeuge:fahrzeug }] } }
        - { vor: umlagefaehig, titel: Vermietung, beschriftungen: { en: { titel: "Letting" } }, anzeigen: { modus: eine, bedingungen: [{ art: verweistyp, feld: betrifft, typ: vermietung:mietobjekt }, { art: verweistyp, feld: betrifft, typ: vermietung:wohnung }] } }
        - { vor: positionen, titel: Positionen, beschriftungen: { en: { titel: "Items" } } }
    - { key: anlagen, name: Anlagen, art: dokumente, beschriftungen: { en: { name: "Attachments" } } }
    - { key: lieferscheine, name: Lieferscheine, art: verknuepfungen, quellen: [{ typ: lieferschein, feld: rechnung }], beschriftungen: { en: { name: "Delivery notes" } } }
    - { key: verknuepfungen, name: Verknüpfungen, art: verknuepfungen, beschriftungen: { en: { name: "Links" } } }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [von, datum, betrag, faellig_am, status]

- schluessel: lieferschein
  name: Lieferschein
  beschreibung: Lieferschein zu einer Bestellung – was geliefert wurde, und ob es vollständig war.
  beschriftungen: { en: { name: "Delivery note", beschreibung: "Delivery note for an order – what was delivered and whether it was complete." } }
  titelVorlage: "{von} – {datum}"
  felder:
    - { key: von, label: Lieferant, typ: referenz, ziel: ["basis:organisation", "basis:person"], verweisart: bezug, erkennung: { art: verweis }, beschriftungen: { en: { label: "Supplier" } } }
    - { key: an, label: Empfänger, typ: referenz, ziel: ["basis:organisation", "basis:person"], verweisart: bezug, hilfe: Leer heißt wir, beschriftungen: { en: { label: "Recipient", hilfe: "Empty means us" } } }
    - { key: datum, label: Lieferdatum, typ: datum, erkennung: { art: datum }, beschriftungen: { en: { label: "Delivery date" } } }
    - { key: lieferscheinnummer, label: Lieferscheinnummer, typ: text, maxLen: 60, wiederfinden: true, erkennung: { art: nummer }, beschriftungen: { en: { label: "Delivery note number" } } }
    - { key: bestellnummer, label: Bestellnummer, typ: text, maxLen: 60, erkennung: { art: nummer }, beschriftungen: { en: { label: "Order number" } } }
    - { key: betrifft, label: Betrifft, typ: referenz, ziel: "vertraege:vertrag", zielOptional: ["fahrzeuge:fahrzeug", "haus:immobilie", "vermietung:mietobjekt", "vermietung:wohnung", "haushalt:anschaffung"], mehrfach: true, gleicherTyp: true, verweisart: bezug, beschriftungen: { en: { label: "Concerns" } } }
    - key: vollstaendig
      label: Vollständig erhalten
      beschriftungen: { en: { label: "Received in full", optionen: { "ja": "yes", "nein": "no", "teilweise": "partly" } } }
      typ: auswahl
      optionen: [ja, nein, teilweise]
    - { key: rechnung, label: Gehört zu Rechnung, typ: referenz, ziel: rechnung, verweisart: zugehoerigkeit, beschriftungen: { en: { label: "Belongs to invoice" } } }
    - { key: notiz, label: Bemerkungen, typ: langtext, beschriftungen: { en: { label: "Remarks" } } }
  register:
    - { key: lieferschein, name: Lieferschein, art: felder, felder: [von, an, datum, lieferscheinnummer, bestellnummer, betrifft, vollstaendig, rechnung, notiz], beschriftungen: { en: { name: "Delivery note" } } }
    - { key: dokumente, name: Dokumente, art: dokumente, beschriftungen: { en: { name: "Documents" } } }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [von, datum, lieferscheinnummer, vollstaendig, rechnung]

- schluessel: rechnungsposition
  name: Rechnungsposition
  beschreibung: Eine Zeile einer Rechnung. Gehört immer zu ihrer Rechnung und erscheint nur dort.
  beschriftungen: { en: { name: "Invoice item", beschreibung: "One line of an invoice. Always belongs to its invoice and only appears there." } }
  # Ohne Nummer: „{nr}. …“ ergäbe sonst „. Bremsen vorne“ (Fund Entwicklung 11.11.); die Nr. steht in der Tabelle.
  titelVorlage: "{beschreibung}"
  gehoertZu: rechnung
  felder:
    - { key: rechnung, label: Rechnung, typ: referenz, ziel: rechnung, pflicht: true, verweisart: zugehoerigkeit, beschriftungen: { en: { label: "Invoice" } } }
    - { key: nr, label: Nr., typ: zahl, beschriftungen: { en: { label: "No." } } }
    - { key: beschreibung, label: Beschreibung, typ: text, maxLen: 300, pflicht: true, beschriftungen: { en: { label: "Description" } } }
    - { key: menge, label: Menge, typ: zahl, nachkomma: 3, beschriftungen: { en: { label: "Quantity" } } }
    - { key: einheit, label: Einheit, typ: text, maxLen: 20, hilfe: z. B. Stück, Std., kg, beschriftungen: { en: { label: "Unit", hilfe: "e.g. pcs, h, kg" } } }
    - { key: einzelpreis, label: Einzelpreis, typ: betrag, negativ: true, beschriftungen: { en: { label: "Unit price" } } }
    - { key: gesamtpreis, label: Gesamtpreis, typ: betrag, negativ: true, hilfe: Leer lassen – dann rechnet das Paket Menge × Einzelpreis, beschriftungen: { en: { label: "Total", hilfe: "Leave empty – the package then calculates quantity × unit price" } } }
    - { key: ust_satz, label: Umsatzsteuersatz, typ: prozent, nachkomma: 1, hilfe: Mit Satz gelten die Preise netto, beschriftungen: { en: { label: "VAT rate", hilfe: "With a rate the prices are net" } } }
    - { key: ust_betrag, label: Umsatzsteuer, typ: betrag, negativ: true, berechnet: true, beschriftungen: { en: { label: "VAT" } } }
    - { key: artikelnummer, label: Artikelnummer, typ: text, maxLen: 60, beschriftungen: { en: { label: "Item number" } } }
  register:
    - { key: position, name: Position, art: felder, felder: [rechnung, nr, beschreibung, menge, einheit, einzelpreis, gesamtpreis, ust_satz, ust_betrag, artikelnummer], beschriftungen: { en: { name: "Item" } } }
    - { key: historie, name: Historie, art: protokoll, beschriftungen: { en: { name: "History" } } }
  trefferliste: [nr, beschreibung, menge, einheit, einzelpreis, gesamtpreis, ust_satz]
