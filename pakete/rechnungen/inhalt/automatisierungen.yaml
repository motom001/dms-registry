# Mitgelieferte Automatisierung (Ablago #712, DMS #1082): gleich eingeschaltet; Uhrzeit und Tage kannst du ändern.
- schluessel: taeglich_pruefen
  name: Rechnungen täglich prüfen
  beschreibung: Jeden Morgen setzt das Paket den Status der Rechnungen neu (z. B. „überfällig seit …“) und vergleicht die Positionen mit dem Betrag. Ausgeschaltet rechnet es nur, wenn jemand eine Rechnung ändert.
  eingeschaltet: true
  wenn: { art: zeitplan, uhrzeit: "05:10", tage: [1, 2, 3, 4, 5, 6, 7] }
  dann:
    - { art: paket, aufgabe: taeglich }
