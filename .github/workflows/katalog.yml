# Veröffentlicht den Katalog (katalog.json, katalog.sig und Archive) und die Katalog-Webseite auf dem
# Branch gh-pages, erreichbar über GitHub Pages unter https://catalog.ablago.app/ (eigene Domain, Datei CNAME).
# Jede Paketversion liegt zusätzlich als Datei an einem Release (#156): Von dort lädt Ablago, und GitHub zählt die
# Downloads. Einmal am Tag läuft der Katalog neu, damit die Zahlen aktuell sind.
name: Katalog veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hoechstens:
        description: 'Höchstens so viele neue Releases in diesem Lauf (0 = alle)'
        default: '20'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    # Der Signierschlüssel liegt nur als Secret KATALOG_SIGNIERSCHLUESSEL in dieser Environment; sie ist auf den
    # Branch main beschränkt (Settings → Environments → katalog). Anleitung: README, „Katalog signieren“.
    environment: katalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet --require-hashes -r werkzeuge/requirements.txt
      - name: Bisherigen Stand holen
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dms-registry
          key: wasm-${{ hashFiles('werkzeuge/wasi-sdk.sh', 'pakete/*/code/bauen.sh') }}
          restore-keys: wasm-
      # Nur Versionen, die noch nicht im Katalog stehen: Veröffentlichte Archive ändern sich nie.
      - name: Pakete mit Code bauen
        run: python3 werkzeuge/bauen.py --unveroeffentlicht site
      - name: Katalog bauen
        run: python3 werkzeuge/katalog.py site
      # Releases ändern sich nie; fehlende werden angelegt (beim ersten Lauf für alle bisherigen Versionen). Erst wenn
      # jede Version ihre Release-Datei hat, geht es weiter – katalog.json zeigt schon dorthin.
      - name: Releases anlegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_HOECHSTENS: ${{ inputs.hoechstens || '20' }}
        run: python3 werkzeuge/releases.py anlegen site
      - name: Downloads zählen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 werkzeuge/releases.py zaehlen site
      # Auf Pages bleibt nur die aktuelle Version je Paket (#133) – für die Sammeldatei im Browser. Gelöscht wird nur,
      # was als passende Release-Datei da ist.
      - name: Pages ausdünnen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 werkzeuge/releases.py ausduennen site
      # Ed25519 über die Bytes von katalog.json (#74). Ohne Secret (Fork, oder bevor es angelegt ist) bleibt der
      # Lauf grün: unsigniert, mit deutlicher Warnung. Danach prüft das Werkzeug die Signatur mit schluessel/*.pub.
      - name: Katalog signieren
        env:
          KATALOG_SIGNIERSCHLUESSEL: ${{ secrets.KATALOG_SIGNIERSCHLUESSEL }}
        run: python3 werkzeuge/signieren.py signieren site --schluessel-env KATALOG_SIGNIERSCHLUESSEL
      - name: Webseite bauen
        run: python3 werkzeuge/webseite.py site
      - name: Größe prüfen
        run: python3 werkzeuge/releases.py groesse site
      - name: Veröffentlichen
        run: |
          cd site
          touch .nojekyll
          # Eigene Domain bei jeder Veröffentlichung mitschreiben (dms-registry#111), sonst schaltet Pages sie ab.
          echo catalog.ablago.app > CNAME
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          # Ohne Historie (#133): Jede Veröffentlichung ist ein einzelner Commit, gelöschte Archive wachsen nicht im
          # Repository mit. Ablago und die Webseite brauchen nur den aktuellen Stand.
          git checkout -q --orphan veroeffentlichen
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Katalog ${GITHUB_SHA::7}"
          git push --force origin HEAD:gh-pages
