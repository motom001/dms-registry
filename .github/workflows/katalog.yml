# Veröffentlicht den Katalog (katalog.json, katalog.sig und Archive) und die Katalog-Webseite auf dem
# Branch gh-pages, erreichbar über GitHub Pages unter https://catalog.ablago.app/ (eigene Domain, Datei CNAME).
name: Katalog veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    # Der Signierschlüssel liegt nur als Secret KATALOG_SIGNIERSCHLUESSEL in dieser Environment; sie ist auf den
    # Branch main beschränkt (Settings → Environments → katalog). Anleitung: README, „Katalog signieren“.
    environment: katalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet --require-hashes -r werkzeuge/requirements.txt
      - name: Bisherigen Stand holen
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/dms-registry
          key: wasm-${{ hashFiles('werkzeuge/wasi-sdk.sh', 'pakete/*/code/bauen.sh') }}
          restore-keys: wasm-
      # Nur Versionen, die noch nicht im Katalog stehen: Veröffentlichte Archive ändern sich nie.
      - name: Pakete mit Code bauen
        run: python3 werkzeuge/bauen.py --unveroeffentlicht site
      - name: Katalog bauen
        run: python3 werkzeuge/katalog.py site
      # Ed25519 über die Bytes von katalog.json (#74). Ohne Secret (Fork, oder bevor es angelegt ist) bleibt der
      # Lauf grün: unsigniert, mit deutlicher Warnung. Danach prüft das Werkzeug die Signatur mit schluessel/*.pub.
      - name: Katalog signieren
        env:
          KATALOG_SIGNIERSCHLUESSEL: ${{ secrets.KATALOG_SIGNIERSCHLUESSEL }}
        run: python3 werkzeuge/signieren.py signieren site --schluessel-env KATALOG_SIGNIERSCHLUESSEL
      - name: Webseite bauen
        run: python3 werkzeuge/webseite.py site
      - name: Veröffentlichen
        run: |
          cd site
          touch .nojekyll
          # Eigene Domain bei jeder Veröffentlichung mitschreiben (dms-registry#111), sonst schaltet Pages sie ab.
          echo catalog.ablago.app > CNAME
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Katalog ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
