# Veröffentlicht den Katalog (katalog.json und Archive) auf dem Branch gh-pages,
# erreichbar unter https://raw.githubusercontent.com/motom001/dms-registry/gh-pages/katalog.json
# (und über GitHub Pages, sobald es für den Branch gh-pages eingeschaltet ist).
name: Katalog veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml jsonschema markdown
      - name: Bisherigen Stand holen
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dms-registry
          key: wasm-${{ hashFiles('werkzeuge/wasi-sdk.sh', 'pakete/*/code/bauen.sh') }}
          restore-keys: wasm-
      # Nur Versionen, die noch nicht im Katalog stehen: Veröffentlichte Archive ändern sich nie.
      - name: Pakete mit Code bauen
        run: python3 werkzeuge/bauen.py --unveroeffentlicht site
      - name: Katalog bauen
        run: python3 werkzeuge/katalog.py site
      - name: Webseite bauen
        run: python3 werkzeuge/webseite.py site
      - name: Veröffentlichen
        run: |
          cd site
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Katalog ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
