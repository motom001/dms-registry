# Prüft Vorlage und Pakete nach REGELN.md – bei jedem Pull Request und auf main.
name: Pakete prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet --require-hashes -r werkzeuge/requirements.txt
      - name: Tests der Prüfung
        run: python3 -m unittest werkzeuge/test_pruefen.py werkzeuge/test_sammeldatei.py werkzeuge/test_signieren.py werkzeuge/test_symbole.py werkzeuge/test_sprachen.py werkzeuge/test_webseite.py werkzeuge/test_releases.py
      # Pakete mit Code: aus dem Quellcode bauen (WASI-SDK und Bibliotheken bleiben im Cache), danach prüft
      # pruefen.py das Modul gegen die DMS-Paket-ABI.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dms-registry
          key: wasm-${{ hashFiles('werkzeuge/wasi-sdk.sh', 'pakete/*/code/bauen.sh') }}
          restore-keys: wasm-
      - name: Pakete mit Code bauen
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 werkzeuge/bauen.py --geaendert origin/${{ github.base_ref }}
          else
            python3 werkzeuge/bauen.py --alle
          fi
      # Tests, die ein gebautes Modul brauchen (z. B. das echte Modell von ki_aehnlich): tests/ci.sh je gebautem Paket.
      - name: Tests der gebauten Pakete
        run: |
          for t in pakete/*/tests/ci.sh; do
            [ -e "$t" ] || continue
            p="${t%/tests/ci.sh}"
            if [ -f "$p/code/modul.wasm" ]; then echo "▸ $p"; bash "$t"; fi
          done
      - name: Vorlage und Pakete prüfen
        run: |
          basis=""
          if [ "${{ github.event_name }}" = pull_request ]; then basis="--basis origin/${{ github.base_ref }}"; fi
          python3 werkzeuge/pruefen.py $basis
      # Mit dem echten Installer von Ablago (motom001/dms#1124): installiert die Pakete in eine Testdatenbank, im
      # Pull Request als Update vom Stand des Ziel-Zweigs aus (gleiche Id = Update, ersetzt = Umzug, umbau läuft mit).
      # Saubere Kopien aus git, damit gebaute Module nicht als „Inhalt anders bei gleicher Version“ zählen.
      # ABLAGO beim Kern-Update hochziehen.
      - name: Pakete mit dem Installer von Ablago prüfen
        env:
          ABLAGO: ghcr.io/motom001/dms:0.257.0
        run: |
          git worktree add -q "$RUNNER_TEMP/neu" HEAD
          if [ "${{ github.event_name }}" = pull_request ]; then
            git worktree add -q "$RUNNER_TEMP/alt" "origin/${{ github.base_ref }}"
            docker run --rm -v "$RUNNER_TEMP/alt/pakete:/alt:ro" -v "$RUNNER_TEMP/neu/pakete:/neu:ro" "$ABLAGO" pakete-pruefen /alt /neu
          else
            docker run --rm -v "$RUNNER_TEMP/neu/pakete:/neu:ro" "$ABLAGO" pakete-pruefen /neu
          fi
      # Sprachpakete (#116, motom001/dms#731): Abdeckung je Sprache gegen die neueste veröffentlichte Ablago-Version,
      # Fehler wie beim Installieren (HTML, Steuerzeichen); Hinweise (unbekannte Schlüssel, Platzhalter) machen nichts rot.
      - name: Sprachpakete gegen die neueste Ablago-Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo motom001/dms --json tagName -q .tagName 2>/dev/null || true)
          git clone --quiet --depth 1 ${tag:+--branch "$tag"} --filter=blob:none --sparse https://github.com/motom001/dms ../ablago
          git -C ../ablago sparse-checkout set shared/src/sprachen
          python3 werkzeuge/sprachen.py --ablago ../ablago
      - name: Kategorien und Issue-Vorlage aktuell (#84, #86)
        run: python3 werkzeuge/vorlagen.py --pruefen
      - name: Katalog lässt sich bauen (ohne veröffentlichte Version zu ändern)
        run: |
          if git fetch --depth 1 origin gh-pages; then git worktree add site FETCH_HEAD; else mkdir site; fi
          python3 werkzeuge/katalog.py --probe site
      - name: Webseite lässt sich bauen
        run: |
          mkdir -p /tmp/probe && python3 werkzeuge/katalog.py --ohne-bau /tmp/probe && python3 werkzeuge/webseite.py /tmp/probe
          node --check /tmp/probe/sammeldatei.js
      - name: Neues Paket aus der Vorlage lässt sich anlegen
        run: |
          werkzeuge/neues-paket.sh probe_paket "Probe"
          sed -i 's/<Name>/CI/' pakete/probe_paket/LICENSE
          python3 werkzeuge/pruefen.py pakete/probe_paket
      - name: Signed-off-by in allen Commits des Pull Requests
        if: github.event_name == 'pull_request'
        run: |
          fehlt=$(git log --no-merges --format='%H %s%n%b%n--ENDE--' origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | awk '/^[0-9a-f]{40} /{c=$1; ok=0} /^Signed-off-by: /{ok=1} /^--ENDE--$/{ if(!ok) print c }')
          if [ -n "$fehlt" ]; then echo "::error::Commits ohne Signed-off-by (git commit -s): $fehlt"; exit 1; fi
