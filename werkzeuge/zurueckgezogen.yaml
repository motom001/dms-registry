# Bewusst zurückgezogene Paketversionen (Tag <id>-v<version>), z. B. wegen eines Fehlers. Zurückziehen heißt: hier
# eintragen – katalog.py nimmt die Version beim nächsten Lauf aus katalog.json und von der Webseite, ein Paket ohne
# Versionen ganz – und das Release von Hand löschen, sonst bleibt die Datei öffentlich ladbar.
# Ohne Eintrag meldet werkzeuge/releases.py zaehlen ein Release ohne Katalog-Version als Fehler (Schutz vor Verlust).

