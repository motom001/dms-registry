# Kategorien und Symbole der Pakete (dms-registry #84, #98) – feste Listen, keine freien Schlagwörter.
# Jedes Paket hat 1–2 Kategorien und möglichst ein Symbol; die CI prüft das
# (python3 werkzeuge/vorlagen.py --pruefen, python3 werkzeuge/pruefen.py). Neue Kategorie nur über ein Issue.
# Stufe 2 (#80, #84, #98): Der Autor setzt `kategorien` und `symbol` im Manifest selbst – das Manifest
# gewinnt. Die Einträge unten sind der Übergang für Pakete, deren Manifest die Felder noch nicht hat;
# mit der nächsten Version eines Pakets wandern sie ins Manifest und können hier weg.
kategorien:
  - { kennung: vorlagen, de: Vorlagen für die Ablage, en: Filing templates }
  - { kennung: dateiformate, de: Dateiformate, en: File formats }
  - { kennung: volltext, de: Texterkennung und Volltext, en: Text recognition and full text }
  - { kennung: sprachen, de: Sprachen, en: Languages }
  - { kennung: ki, de: KI, en: AI }
  - { kennung: suche, de: Suche, en: Search }
  - { kennung: post, de: Post und Scannen, en: Mail and scanning }
  - { kennung: sicherung, de: Sicherung, en: Backup }
  - { kennung: entwickler, de: Für Entwickler, en: For developers }
pakete:
  basis: [vorlagen]
  fahrzeuge: [vorlagen]
  haus: [vorlagen]
  haushalt: [vorlagen]
  vermietung: [vorlagen]
  bildformate: [dateiformate]
  office_email: [dateiformate, volltext]
  texterkennung: [volltext, suche]
  texterkennung.fra: [sprachen, volltext]
  texterkennung.spa: [sprachen, volltext]
  texterkennung.ita: [sprachen, volltext]
  texterkennung.nld: [sprachen, volltext]
  texterkennung.por: [sprachen, volltext]
  texterkennung.pol: [sprachen, volltext]
  texterkennung.tur: [sprachen, volltext]
  texterkennung.rus: [sprachen, volltext]
  texterkennung.ukr: [sprachen, volltext]
  texterkennung.ara: [sprachen, volltext]
  ki_aehnlich: [ki, suche]
  ki_assistent: [ki, suche]
  trennblatt: [post]
  sicherung_webdav: [sicherung]
  hallo_post: [entwickler]
# Symbole (#98): Name eines Lucide-Symbols aus werkzeuge/symbole/, bei Zusatzsprachen mit Sprachkürzel.
symbole:
  basis: contact
  bildformate: image
  fahrzeuge: car
  hallo_post: mail
  haus: house
  haushalt: wallet
  ki_aehnlich: files
  ki_assistent: message-circle-question-mark
  office_email: file-text
  sicherung_webdav: cloud-upload
  texterkennung: scan-text
  trennblatt: scan-barcode
  vermietung: key-round
