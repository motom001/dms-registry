# Beispiel-Mappen (optional). Bei der Installation fragt Ablago, ob sie angelegt werden sollen.
# Keine echten Daten!
# Verweise zwischen Beispielen (ab Ablago 0.79.0): einem Beispiel einen schluessel geben und in einem
# Verweisfeld eines anderen  feld: { beispiel: erstes }  schreiben – auf Abhängigkeiten: { beispiel: "basis:stadtwerke" }.
# Beispiel-Dokumente (ab Ablago 0.223.0, dann dms: ">=0.223.0"): Dateien unter inhalt/beispiele/ unter dokumente nennen,
#   dokumente:
#     - { datei: beispiele/erstes/vertrag.pdf, titel: Vertrag, datum: "2027-01-31", register: dokumente }
# Nur PDF, PNG und JPEG; jede Datei dort muss genannt sein. NUR ERFUNDENE INHALTE: Persona-Namen (Lena, Jonas, Markus,
# Petra, Herr Özdemir, Katrin), Beispiel-Domains (example.org), ungültige Beispielwerte für IBAN, Steuer- und
# Versichertennummern – keine echten Briefe, auch nicht geschwärzt. Siehe REGELN.md, „Beispiel-Dokumente“.
- typ: beispiel
  schluessel: erstes
  werte:
    bezeichnung: Erstes Beispiel
    art: Eins
    datum: "2027-01-31"
    betrag: 12.5
