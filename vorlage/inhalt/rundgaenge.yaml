# Rundgänge dieses Pakets (Ablago ab 0.285.0, dann dms: ">=0.285.0"). Schema: schema/inhalt.schema.json
# Im Manifest einkommentieren: inhalt.rundgaenge: inhalt/rundgaenge.yaml – REGELN.md, „Rundgänge und Tipps“.
# Ein Rundgang führt durch eine Aufgabe; Ablago hebt Schritt für Schritt eine Stelle hervor. Er startet nie von selbst:
# Mit nach_installation bietet Ablago ihn 30 Tage lang als Tipp an. Texte in Du-Form.
# Texte in mehreren Sprachen (Ablago ab 0.293.2, #1307): titel, beschreibung, text, ort … weglassen und stattdessen in
# texte/de/entdecken.json und texte/en/entdecken.json schreiben – Schlüssel wie „rundgang.beispiel-anlegen.titel“ oder
# „rundgang.beispiel-anlegen.datum.text“ (Unterstriche werden zu Bindestrichen). REGELN.md, „Rundgänge und Tipps“.
# Ziele sind Anker aus werkzeuge/anker.yaml (Kopie aus Ablago), z. B. neu, liste, mappe.feld:<key>, mappe.register:<key>.

- schluessel: beispiel_anlegen
  titel: Beispiel anlegen             # aufgabenbezogen, höchstens 60 Zeichen
  beschreibung: Wo du ein Beispiel anlegst und wo Datum und Betrag stehen.
  start: nach_installation            # manuell | nach_installation (einmal je Paket) | nach_update
  fuer: lesen                         # lesen | verwalten
  oeffne:
    mappe: { typ: beispiel }          # zuletzt geänderte Mappe des Typs; neu: { typ } = leeres Formular
  ersatz: Sobald du ein Beispiel angelegt hast, zeigt dir Ablago hier, wie es geht.
  schritte:                           # 1 bis 8
    - schluessel: neu
      ziel: neu
      ort: Oben in der Kopfzeile      # Pflicht bei ziel – für Screenreader
      titel: Neu anlegen
      text: Unter „+ Neu“ legst du ein Beispiel an.
    - schluessel: datum
      ziel: mappe.feld:datum          # das Feld muss es im geöffneten Mappentyp geben
      ort: Rechts in der Mappe
      titel: Datum
      text: Hier steht das Datum des Beispiels.
      handbuch: benutzer/mappen/      # optional: Seite im Handbuch (benutzer/ oder admin/)
    - schluessel: fertig              # ohne ziel steht der Schritt in der Mitte
      titel: Fertig
      text: Mehr brauchst du nicht – Dokumente legst du im Register „Dokumente“ ab.
