# Mappentypen dieses Pakets. Schema: schema/inhalt.schema.json
# Schlüssel sind im Paket lokal; Ablago legt den Typ als <paket-id>_<schluessel> an.
# Feldtypen: text, langtext, formatiert, zahl, betrag, datum, janein, auswahl, referenz, passwort
# Registerarten: felder, dokumente, verknuepfungen, protokoll

- schluessel: beispiel
  name: Beispiel
  beschreibung: Ein Beispiel-Mappentyp – ersetzen oder löschen.
  titelVorlage: "{bezeichnung}"
  felder:
    - key: bezeichnung
      label: Bezeichnung
      typ: text
      pflicht: true
      maxLen: 120
    - key: art
      label: Art
      typ: auswahl
      optionen: [Eins, Zwei, Sonstige]
      standard: Eins
    - key: datum
      label: Datum
      typ: datum
      # Erinnerung als Aufgabe „Frist“, hier 1 Monat vorher:
      frist: { vorlauf: 1, einheit: monate }
    - key: betrag
      label: Betrag
      typ: betrag
      min: 0
      waehrung: EUR
    # Format eines Textfelds (braucht dms: ">=0.121.0", siehe REGELN.md): email, telefon, internetseite, iban, plz
    #   - { key: telefon, label: Telefon, typ: text, maxLen: 40, format: telefon }
    # Grenzen eines Datumsfelds: min/max als "JJJJ-MM-TT" oder heute, z. B. max: heute für einen Geburtstag
    # Für die Erkennung nutzen (braucht dms: ">=0.113.0", siehe REGELN.md): z. B. an einer Vertragsnummer
    #   erkennung: { art: nummer, hinweis: "Steht oben rechts, Muster VN-######" }
    # oder ohne Art – Ablago schließt sie aus Feldart und Bezeichnung:
    #   erkennung: {}
    # Verweis auf einen Typ dieses Pakets: ziel: beispiel
    # Verweis auf ein anderes Paket:      ziel: basis:organisation (dann unter abhaengigkeiten nennen)
    # Verweis auf einen Typ von Ablago:      ziel: dms:ablageort (auch dms:benutzer, dms:rolle; braucht dms: ">=0.75.0")
    # - key: organisation
    #   label: Organisation
    #   typ: referenz
    #   ziel: basis:organisation
    #   verweisart: bezug
    # War ein Feld bisher Text und wird jetzt ein Verweis (braucht dms: ">=0.120.0", siehe REGELN.md): neues Feld mit
    # eigener Kennung, keine Pflicht, und aus_text mit der Kennung des alten Textfelds – das alte Feld fällt aus dem Paket.
    #   aus_text: organisation_text
  register:
    - key: daten
      name: Daten
      art: felder
      felder: [bezeichnung, art, datum, betrag]
    - key: dokumente
      name: Dokumente
      art: dokumente
    - key: protokoll
      name: Protokoll
      art: protokoll
  trefferliste: [bezeichnung, art, datum, betrag]
