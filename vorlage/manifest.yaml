# Beschreibung des Pakets. Schema: schema/manifest.schema.json
schema: 1

# Id = Ordnername unter pakete/: Kleinbuchstaben, Ziffern, _; beginnt mit einem Buchstaben; max. 40 Zeichen
# (über 20 erst ab Ablago 0.229.0). Eine Id nur einmal: werkzeuge/ids.txt (REGELN.md, „Eine Id nur einmal“).
id: vorlage
name: Vorlage
# Herausgeber (#173): Alle Pakete dieser Registry gibt das Ablago-Projekt heraus – Pflicht für jede neue Version.
herausgeber: app.ablago
version: 1.0.0                      # SemVer; bei jeder Änderung erhöhen und CHANGELOG.md ergänzen
beschreibung: Kurz in einem Satz, was das Paket bringt.

autor:
  name: Vorname Nachname
  github: dein-github-name
lizenz: MIT                         # SPDX-Kennung aus REGELN.md, Text in LICENSE

# Für den Katalog (REGELN.md, „Kategorien“ und „Symbol“) – bitte einkommentieren und passend wählen.
# Ablago liest beide Felder nicht; ohne symbol zeigt der Katalog den Anfangsbuchstaben.
# kategorien: [vorlagen]            # 1–2 aus werkzeuge/kategorien.yaml
# symbol: file-text                 # Lucide-Name aus werkzeuge/symbole/, z. B. car, house, image, mail
# kuerzel: FR                       # optional, nur mit symbol: 2–3 Großbuchstaben unten rechts (z. B. Sprache)

# Ab welcher Ablago-Version das Paket läuft (SemVer-Bereich).
dms: ">=0.41.0"

# Andere Pakete, die vorher installiert sein müssen (Id: Versionsbereich).
abhaengigkeiten: {}
#  basis: ">=1.0.0"

# Optional: Dieses Paket ergänzt ein anderes (steht dann auch unter abhaengigkeiten), z. B. eine Zusatzsprache die
# Texterkennung. Ablago ab 0.151.0 zeigt es beim Installieren als Häkchen unter dem ergänzten Paket.
# ergaenzt: { paket: basis, gruppe: Weitere Vorlagen }

# Was das Paket anlegt. Pfade relativ zum Paketordner.
inhalt:
  mappentypen: inhalt/mappentypen.yaml
  sichten: inhalt/sichten.yaml
  beispiele: inhalt/beispiele.yaml   # optional: Beispiel-Mappen, auf Wunsch bei der Installation
#  wortlisten: inhalt/wortlisten.yaml # optional (Ablago ab 0.127.0): gleichbedeutende Wörter für die Suche,
#                                     # z. B. - woerter: [Kfz, Auto, PKW]; dann dms: ">=0.127.0"
#  automatisierungen: inhalt/automatisierungen.yaml # optional (Ablago ab 0.177.0): vorgefertigte Automatisierungen,
#                                     # z. B. „Neue Dokumente melden“; dann dms: ">=0.177.0"

# Nur für Pakete mit Code (Ablago ab 0.88.0) – sonst weglassen, dazu den Ordner code/. Siehe code/README.md.
# code:
#   sprache: rust                    # rust, go, c, assemblyscript, javascript
#   quelle: code/
#   ereignisse:                      # worauf das Paket reagiert (nicht blockierend)
#     - dokument.hochgeladen
#   rechte:                          # Rechte des Dienstkontos dieses Pakets
#     lesen: [vorlage:beispiel]      # Mappentypen, die es lesen darf
#     schreiben: [vorlage:beispiel]  # … und ändern darf
#     dokumente: lesen               # keine | lesen | schreiben
#   netz: []                         # erlaubte Adressen, z. B. ["https://api.beispiel.de"]
#   einstellungen:                   # daraus baut Ablago ein Formular (Werkbank → Pakete → Einstellungen)
#     - abschnitt: Allgemein         # Abschnitt: Überschrift, optional hilfe, felder
#       felder:
#         - schluessel: aktiv
#           name: Regeln automatisch anwenden
#           typ: janein              # text, mehrzeilig, zahl, janein, datum, auswahl, mehrfachauswahl, geheim,
#           standard: true           # Verweise: mappentyp, feld (mit mappentyp:), benutzer, rolle, sicht
#         - schluessel: schluessel_api
#           name: API-Schlüssel
#           typ: geheim              # Zugangsdaten nur als geheim – nie als text oder als standard
#     - liste: regeln                # Liste gleich aufgebauter Einträge (zweite und letzte Ebene)
#       name: Regeln
#       eintrag: Regel
#       sortierbar: true
#       felder:
#         - { schluessel: absender, name: Absender enthält, typ: text }
#         - { schluessel: ziel, name: Mappentyp, typ: mappentyp, pflicht: true }
#   aktionen:                        # Knöpfe im Formular; Ablago ruft das Paket auf und zeigt die Antwort
#     - { schluessel: anwenden, name: Regeln jetzt auf neue Post anwenden, bestaetigen: true }
